// ===== Math helpers =====
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function hash1(n) { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }

function resolveWalls(e, walls) {
  for (const w of walls) {
    const nx = clamp(e.x, w.x, w.x + w.w);
    const ny = clamp(e.y, w.y, w.y + w.h);
    const dx = e.x - nx, dy = e.y - ny;
    const d = Math.hypot(dx, dy);
    if (d < e.r) {
      if (d === 0) {
        const left = e.x - w.x, right = (w.x + w.w) - e.x, top = e.y - w.y, bottom = (w.y + w.h) - e.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) e.x = w.x - e.r;
        else if (m === right) e.x = w.x + w.w + e.r;
        else if (m === top) e.y = w.y - e.r;
        else e.y = w.y + w.h + e.r;
      } else {
        const push = (e.r - d) / d;
        e.x += dx * push;
        e.y += dy * push;
      }
    }
  }
}
function clampToWorld(e, world) {
  e.x = clamp(e.x, e.r, world.w - e.r);
  e.y = clamp(e.y, e.r, world.h - e.r);
}
function hasLineOfSight(x1, y1, x2, y2, solids) {
  const d = dist(x1, y1, x2, y2);
  const steps = Math.max(1, Math.ceil(d / 18));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = lerp(x1, x2, t), y = lerp(y1, y2, t);
    for (const w of solids) {
      if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return false;
    }
  }
  return true;
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ===== Audio =====
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slideTo, when) {
  if (!actx) return;
  const t0 = when || actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gain.gain.setValueAtTime(vol || 0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function noiseBurst(dur, vol, filterFreq, when) {
  if (!actx) return;
  const t0 = when || actx.currentTime;
  const bufferSize = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const src = actx.createBufferSource();
  src.buffer = buffer;
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq || 4000;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(filter).connect(gain).connect(actx.destination);
  src.start(t0);
}
function sndShot() { noiseBurst(0.12, 0.35, 3200); tone(180, 0.08, 'square', 0.15, 60); }

let humOsc = null, humGain = null;
function startHum() {
  stopHum();
  if (!actx) return;
  humOsc = actx.createOscillator();
  humOsc.type = 'sawtooth';
  humOsc.frequency.value = 55;
  humGain = actx.createGain();
  humGain.gain.value = 0;
  humOsc.connect(humGain).connect(actx.destination);
  humOsc.start();
}
function stopHum() {
  if (humOsc) { try { humOsc.stop(); } catch (e) {} try { humOsc.disconnect(); } catch (e) {} humOsc = null; humGain = null; }
}
function updateHum() {
  // low drone belongs to vortex anomalies only — it deepens as you close in
  if (!humGain || !level) return;
  let minD = Infinity;
  for (const a of level.anomalies) {
    if (a.type === 'vortex') minD = Math.min(minD, dist(player.x, player.y, a.x, a.y) - a.r);
  }
  const g = minD === Infinity ? 0 : clamp(1 - minD / 350, 0, 1) * 0.09;
  humGain.gain.setTargetAtTime(g, actx.currentTime, 0.15);
}

// ===== Procedural chiptune soundtrack (slow, minor, one song per run) =====
const music = { on: false, step: 0, nextT: 0, tempo: 0.44, base: 82.4, bass: [], lead: [] };
function genSong() {
  const rng = mulberry32((Math.random() * 1e9) | 0);
  const minor = [0, 2, 3, 5, 7, 8, 10];
  music.base = 73.4 * Math.pow(2, Math.floor(rng() * 4) / 12);
  music.tempo = 0.42 + rng() * 0.14;
  const prog = [0, 0, rng() < 0.5 ? 5 : 3, rng() < 0.5 ? 3 : 8];
  music.bass = []; music.lead = [];
  for (let i = 0; i < 16; i++) {
    const deg = prog[(i / 4) | 0];
    music.bass.push(i % 2 === 0 ? deg : (rng() < 0.3 ? deg + 7 : -1));
    music.lead.push(rng() < 0.22 ? minor[(minor.indexOf(deg % 12) + [0, 2, 4][Math.floor(rng() * 3)] + 7) % 7] + 12 : -1);
  }
  music.step = 0; music.nextT = 0;
}
function noteFreq(semi) { return music.base * Math.pow(2, semi / 12); }
function musicTick() {
  if (!actx || !music.on) return;
  if (music.nextT < actx.currentTime) music.nextT = actx.currentTime + 0.05;
  while (music.nextT < actx.currentTime + 0.3) {
    const s = music.step, t = music.nextT;
    const b = music.bass[s];
    if (b >= 0) tone(noteFreq(b), music.tempo * 0.9, 'square', 0.026, undefined, t);
    const l = music.lead[s];
    if (l >= 0) tone(noteFreq(l) * 2, music.tempo * 1.7, 'triangle', 0.02, noteFreq(l) * 2 * 0.99, t);
    if (s % 8 === 0) tone(55, 0.12, 'sine', 0.05, 30, t);          // kick
    if (s % 4 === 2) noiseBurst(0.03, 0.016, 6000, t);             // hat
    music.step = (music.step + 1) % 16;
    music.nextT += music.tempo;
  }
}

// ===== Level lifecycle: procedural placement =====
const CRATE_S = 28;
const ANOM_TYPES = ['fry', 'vortex', 'arc', 'acid'];
function overlapsAny(rect, list, pad) {
  for (const o of list) {
    if (rect.x - pad < o.x + o.w && rect.x + rect.w + pad > o.x &&
        rect.y - pad < o.y + o.h && rect.y + rect.h + pad > o.y) return true;
  }
  return false;
}
function generateLevel(def) {
  const rng = mulberry32((Math.random() * 1e9) | 0); // new layout every raid
  const world = { w: def.world.w, h: def.world.h };
  const start = { x: 130, y: world.h / 2 };
  const walls = def.walls.map(w => ({ x: w.x, y: w.y, w: w.w, h: w.h }));
  const solids = walls.slice();
  const inner = { x: 60, y: 60, w: world.w - 120, h: world.h - 120 };

  function placeRect(w, h, ok) {
    for (let i = 0; i < 60; i++) {
      const r = { x: inner.x + rng() * (inner.w - w), y: inner.y + rng() * (inner.h - h), w, h };
      if (overlapsAny(r, solids, 16)) continue;
      if (ok && !ok(r)) continue;
      return r;
    }
    return null;
  }
  const crates = [], cars = [], trees = [], bushes = [];
  for (let i = 0; i < def.counts.crates; i++) {
    const r = placeRect(CRATE_S, CRATE_S, r => dist(r.x, r.y, start.x, start.y) > 120);
    if (r) { crates.push(r); solids.push(r); }
  }
  for (let i = 0; i < def.counts.cars; i++) {
    const horiz = rng() < 0.5;
    const r = placeRect(horiz ? 76 : 38, horiz ? 38 : 76, r => dist(r.x, r.y, start.x, start.y) > 150);
    if (r) { r.horiz = horiz; cars.push(r); solids.push(r); }
  }
  for (let i = 0; i < def.counts.trees; i++) {
    const r = placeRect(16, 16, r => dist(r.x, r.y, start.x, start.y) > 120);
    if (r) { trees.push(r); solids.push(r); }
  }
  for (let i = 0; i < def.counts.bushes; i++) {
    const r = placeRect(52, 52, null);
    if (r) bushes.push({ x: r.x + 26, y: r.y + 26, r: 24 + rng() * 8 });
  }
  // anomalies keep clearance from every solid so they can never seal a corridor
  const anomalies = [];
  for (let i = 0; i < def.counts.anomalies; i++) {
    const ar = 40 + rng() * 16;
    for (let t = 0; t < 80; t++) {
      const x = inner.x + ar + rng() * (inner.w - ar * 2);
      const y = inner.y + ar + rng() * (inner.h - ar * 2);
      if (dist(x, y, start.x, start.y) < 240) continue;
      const box = { x: x - ar - 45, y: y - ar - 45, w: (ar + 45) * 2, h: (ar + 45) * 2 };
      if (overlapsAny(box, solids, 0)) continue;
      if (anomalies.some(a => dist(x, y, a.x, a.y) < a.r + ar + 60)) continue;
      anomalies.push({
        x, y, r: ar, type: ANOM_TYPES[Math.floor(rng() * ANOM_TYPES.length)],
        reveal: 0, pT: rng() * 2, sndT: rng() * 2, spin: rng() * Math.PI * 2,
      });
      break;
    }
  }
  const clearOfAnomalies = (x, y, pad) => anomalies.every(a => dist(x, y, a.x, a.y) > a.r + pad);
  function placePoint(minStartDist, pad, extra) {
    for (let t = 0; t < 90; t++) {
      const x = inner.x + 30 + rng() * (inner.w - 60);
      const y = inner.y + 30 + rng() * (inner.h - 60);
      if (dist(x, y, start.x, start.y) < minStartDist) continue;
      if (overlapsAny({ x: x - pad, y: y - pad, w: pad * 2, h: pad * 2 }, solids, 0)) continue;
      if (!clearOfAnomalies(x, y, 30)) continue;
      if (extra && !extra(x, y)) continue;
      return { x, y };
    }
    return { x: world.w - 150, y: world.h / 2 };
  }
  // extraction gate: always deeper in — far right side
  const exPos = placePoint(world.w * 0.55, 55, x => x > world.w * 0.62);
  const extraction = {
    x: clamp(exPos.x - 50, 60, world.w - 160),
    y: clamp(exPos.y - 50, 60, world.h - 160),
    w: 100, h: 100,
  };
  // artifact: mid-depth, never near start or the gate
  const diag = Math.hypot(world.w, world.h);
  const artPos = placePoint(diag * 0.4, 25, (x, y) => dist(x, y, extraction.x + 50, extraction.y + 50) > 220);
  // enemies never spawn in the player's line of sight at start
  const hiddenFromStart = (x, y) => !hasLineOfSight(start.x, start.y, x, y, solids) || dist(x, y, start.x, start.y) > 520;
  const marauders = def.marauderWeapons.map(wp => {
    const p = placePoint(340, 20, hiddenFromStart);
    const face = rng() * Math.PI * 2;
    return {
      x: p.x, y: p.y, r: 11, hp: 2, alive: true,
      facing: face, baseFacing: face, weapon: wp,
      state: 'patrol', patrolT: rng() * 10,
      fireCD: 0, aimT: 0, staggerT: 0, burst: 0, burstT: 0,
      targetKind: 'none', searchTimer: 0, lastKnownX: p.x, lastKnownY: p.y,
      walkT: 0, bittenBy: null, mutTarget: null,
    };
  });
  const mutants = [];
  for (let i = 0; i < def.mutantCount; i++) {
    const p = placePoint(380, 20, hiddenFromStart);
    mutants.push({
      x: p.x, y: p.y, r: 13, hp: 2, alive: true, facing: 0,
      state: 'wander', wanderT: rng() * 2, wanderAngle: rng() * Math.PI * 2,
      wanderCX: p.x, wanderCY: p.y, meleeCD: 0, staggerT: 0, walkT: 0,
    });
  }
  const art = ARTIFACTS[def.artTiers[Math.floor(rng() * def.artTiers.length)]];
  const decor = [];
  for (let i = 0; i < 26; i++) {
    decor.push({ x: rng() * world.w, y: rng() * world.h, w: 16 + rng() * 46, h: 6 + rng() * 14 });
  }
  return {
    name: def.name, theme: THEMES[def.theme], world,
    artifactName: art.name, artifactValue: art.value,
    playerStart: start,
    walls, crates, cars, trees, solids, bushes, decor,
    marauders, mutants, anomalies,
    artifact: { x: artPos.x, y: artPos.y, taken: false },
    extraction, stealthBroken: false,
  };
}

function loadLevel(idx) {
  levelIndex = idx;
  level = generateLevel(LEVELS[idx]);
  player.x = level.playerStart.x;
  player.y = level.playerStart.y;
  player.r = 11;
  player.alive = true; player.hasArtifact = false;
  player.facing = 0; player.dashCD = 0; player.dashTime = 0; player.invuln = 0; player.fireCD = 0;
  player.weapon = unlockedWeapons[clamp(gear.weapon, 0, unlockedWeapons.length - 1)];
  player.ammo = WEAPONS[player.weapon].startAmmo;
  player.bolts = gear.bolts; player.boltCD = 0; player.walkT = 0;
  bullets = []; boltsFlying = []; drops = []; particles = []; decals = [];
  levelStats = { startTime: performance.now(), kills: 0 };
  detectorTimer = 0.3;
  camera.x = player.x - W / 2; camera.y = player.y - H / 2;
  clampCamera();
  startHum();
  enterState('intro');
}
function restartLevel() { loadLevel(levelIndex); }

function enterState(s) { state = s; stateTimer = 0; inputLock = 0.22; }

function completeLevel() {
  const timeSec = (performance.now() - levelStats.startTime) / 1000;
  const stealth = !level.stealthBroken;
  const stealthBonus = stealth ? 300 : 0;
  const timeBonus = Math.max(0, 240 - Math.floor(timeSec * 2));
  const score = level.artifactValue + stealthBonus + timeBonus + levelStats.kills * 25;
  runStats.kills += levelStats.kills;
  runStats.timeTotal += timeSec;
  runStats.score += score;
  if (stealth) runStats.stealthCount++;
  runStats.levels++;
  stopHum();
  sndExtract();
  if (levelIndex + 1 >= LEVELS.length) {
    lastVictoryStats = { kills: runStats.kills, levels: runStats.levels, stealthCount: runStats.stealthCount, timeTotal: runStats.timeTotal, score: runStats.score };
    enterState('victory');
  } else {
    lastCompleteStats = { name: level.name, artifactName: level.artifactName, time: timeSec, kills: levelStats.kills, stealth, value: level.artifactValue, score };
    enterState('levelcomplete');
  }
}

function killPlayer(reason) {
  if (!player.alive) return;
  player.alive = false;
  sndPlayerDeath();
  spawnBlood(player.x, player.y, true);
  stopHum();
  deathReason = reason;
  enterState('dead');
}

// ===== Combat =====
function playerConcealed() {
  for (const b of level.bushes) {
    if (dist(player.x, player.y, b.x, b.y) < b.r) return true;
  }
  return false;
}
function nearestAliveEnemyWithin(x, y, radius) {
  let best = null, bestD = radius;
  for (const m of level.marauders) {
    if (m.alive) { const d = dist(x, y, m.x, m.y); if (d < bestD) { bestD = d; best = m; } }
  }
  for (const u of level.mutants) {
    if (u.alive) { const d = dist(x, y, u.x, u.y); if (d < bestD) { bestD = d; best = u; } }
  }
  return best;
}
function alertNearby(x, y, radius) {
  if (!level) return;
  level.stealthBroken = true;
  for (const m of level.marauders) {
    if (m.alive && dist(m.x, m.y, x, y) < radius) {
      if (m.state === 'patrol') startAim(m, 0.15);
      m.state = 'alert'; m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 3.5;
    }
  }
  for (const u of level.mutants) {
    if (u.alive && dist(u.x, u.y, x, y) < radius) u.state = 'chase';
  }
}
function dropWeapon(m) {
  drops.push({ x: m.x + (Math.random() - 0.5) * 10, y: m.y + (Math.random() - 0.5) * 10, type: m.weapon, ammo: 3 + Math.floor(Math.random() * 4), cd: 0 });
}
function killMarauder(m, byPlayer) {
  m.alive = false;
  if (byPlayer) levelStats.kills++;
  spawnBlood(m.x, m.y, false);
  dropWeapon(m);
  sndEnemyDeath();
}
function killMutant(u, byPlayer) {
  u.alive = false;
  if (byPlayer) levelStats.kills++;
  spawnBlood(u.x, u.y, true);
  sndEnemyDeath();
}
function damageMarauder(m, dmg, hx, hy, byPlayer) {
  m.hp -= dmg;
  spawnSpark(hx, hy);
  spawnBlood(m.x, m.y, false);
  if (m.hp <= 0) { killMarauder(m, byPlayer); return; }
  // hit interrupts aiming/firing
  m.staggerT = 0.45;
  m.aimT = Math.max(m.aimT, 0.35);
  m.burst = 0;
  if (byPlayer) {
    m.state = 'alert'; m.targetKind = 'player';
    m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 4;
    alertNearby(m.x, m.y, 300);
  }
}
function damageMutant(u, dmg, hx, hy, byPlayer) {
  u.hp -= dmg;
  spawnSpark(hx, hy);
  spawnBlood(u.x, u.y, false);
  if (u.hp <= 0) { killMutant(u, byPlayer); return; }
  u.staggerT = 0.3;
  u.state = 'chase';
  sndMutantHurt();
}
function meleeKill(target) {
  target.alive = false;
  levelStats.kills++;
  spawnBlood(target.x, target.y, target.r > 11);
  if (target.weapon) dropWeapon(target);
  sndMelee();
}
function firePlayerBullets() {
  const w = WEAPONS[player.weapon];
  for (let i = 0; i < w.pellets; i++) {
    const a = player.facing + (Math.random() - 0.5) * 2 * w.spread + (w.pellets > 1 ? (i - (w.pellets - 1) / 2) * (w.spread / w.pellets) : 0);
    bullets.push({
      x: player.x + Math.cos(player.facing) * 16, y: player.y + Math.sin(player.facing) * 16,
      vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
      owner: 'player', life: w.life, alive: true,
    });
  }
  if (player.weapon === 'sawnoff') sndShotgun(); else sndShot();
  alertNearby(player.x, player.y, 420);
  spawnMuzzleFlash(player.x, player.y, player.facing);
}
function fireEnemyBullet(m, angle, d) {
  // distance-based spread: near shots are accurate, far shots often miss
  const spread = 0.03 + clamp(d / 420, 0, 1) * 0.22;
  const w = m.weapon;
  const pellets = w === 'sawnoff' ? 3 : 1;
  const life = w === 'sawnoff' ? 0.45 : 1.0;
  for (let i = 0; i < pellets; i++) {
    const a = angle + (Math.random() - 0.5) * 2 * spread + (pellets > 1 ? (i - 1) * 0.14 : 0);
    bullets.push({
      x: m.x + Math.cos(a) * 14, y: m.y + Math.sin(a) * 14,
      vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
      owner: 'enemy', shooter: m, life, alive: true,
    });
  }
  sndEnemyShot();
}
function tryAttack() {
  if (!player.alive || player.fireCD > 0) return;
  const target = nearestAliveEnemyWithin(player.x, player.y, MELEE_RANGE);
  if (target) {
    meleeKill(target);
    player.fireCD = 0.28;
    spawnMeleeSlash(player.x, player.y, player.facing);
    return;
  }
  if (player.ammo <= 0) { sndDryFire(); player.fireCD = 0.3; return; }
  player.ammo--;
  firePlayerBullets();
  player.fireCD = WEAPONS[player.weapon].cd;
}
function tryDash() {
  if (!player.alive || player.dashCD > 0) return;
  player.dashAngle = player.isMoving ? player.lastMoveAngle : player.facing;
  player.dashTime = 0.16;
  player.dashCD = 0.9;
  player.invuln = 0.22;
  sndDash();
  spawnDashTrail(player.x, player.y);
}
function throwBolt() {
  if (!player.alive || player.bolts <= 0 || player.boltCD > 0) return;
  player.bolts--;
  player.boltCD = 0.4;
  boltsFlying.push({
    x: player.x + Math.cos(player.facing) * 14, y: player.y + Math.sin(player.facing) * 14,
    vx: Math.cos(player.facing) * 520, vy: Math.sin(player.facing) * 520,
    life: 0.48, spin: Math.random() * Math.PI,
  });
  sndBoltThrow();
}
function triggerAnomaly(a) {
  if (a.reveal <= 0.3) {
    // each anomaly type has its own discharge voice — you learn them by ear
    if (a.type === 'fry') { noiseBurst(0.35, 0.4, 900); tone(90, 0.3, 'sawtooth', 0.2, 45); }
    else if (a.type === 'vortex') { tone(180, 0.5, 'sine', 0.25, 35); noiseBurst(0.3, 0.2, 400); }
    else if (a.type === 'acid') { noiseBurst(0.45, 0.3, 700); tone(300, 0.2, 'sine', 0.1, 80); }
    else sndZap();
  }
  a.reveal = 2.6;
  const col = a.type === 'fry' ? '#ff9a3a' : a.type === 'acid' ? '#b8e83a' : PAL.anomaly;
  spawnParticles(a.x, a.y, 12, col, a.type === 'fry' ? 260 : 200, 0.5, 3);
}

// ===== AI =====
function startAim(m, extra) {
  m.aimT = 0.3 + Math.random() * 0.2 + (extra || 0);
}
function canSeePlayer(x, y, facing, range, halfAngle) {
  if (!player.alive) return false;
  const eff = playerConcealed() ? Math.min(range, 70) : range;
  const d = dist(x, y, player.x, player.y);
  if (d > eff) return false;
  const ang = Math.atan2(player.y - y, player.x - x);
  let diff = ang - facing;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  if (Math.abs(diff) > halfAngle) return false;
  return hasLineOfSight(x, y, player.x, player.y, level.solids);
}
function nearestVisibleMutant(m) {
  let best = null, bestD = 260;
  for (const u of level.mutants) {
    if (!u.alive) continue;
    const d = dist(m.x, m.y, u.x, u.y);
    if (d < bestD && hasLineOfSight(m.x, m.y, u.x, u.y, level.solids)) { bestD = d; best = u; }
  }
  if (m.bittenBy && m.bittenBy.alive && dist(m.x, m.y, m.bittenBy.x, m.bittenBy.y) < 320) best = m.bittenBy;
  return best;
}
function marauderFire(m, tx, ty) {
  const dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  if (m.weapon === 'rifle') {
    if (m.fireCD <= 0 && m.burst <= 0) { m.burst = 3; m.burstT = 0; m.fireCD = 1.7 + Math.random() * 0.4; }
  } else if (m.weapon === 'sawnoff') {
    if (d < 260 && m.fireCD <= 0) { fireEnemyBullet(m, ang, d); m.fireCD = 1.5 + Math.random() * 0.4; }
  } else {
    if (m.fireCD <= 0) { fireEnemyBullet(m, ang, d); m.fireCD = 1.0 + Math.random() * 0.35; }
  }
}
function marauderMove(m, ang, mult, dt) {
  m.x += Math.cos(ang) * 90 * dt * mult;
  m.y += Math.sin(ang) * 90 * dt * mult;
  m.walkT += 90 * dt * mult;
  resolveWalls(m, level.solids); clampToWorld(m, level.world);
}
function updateMarauder(m, dt) {
  if (!m.alive) return;
  if (m.fireCD > 0) m.fireCD -= dt;
  if (m.staggerT > 0) { m.staggerT -= dt; return; }
  if (m.aimT > 0) m.aimT -= dt;
  // rifle burst continuation
  if (m.burst > 0) {
    m.burstT -= dt;
    if (m.burstT <= 0) {
      const tx = m.targetKind === 'mutant' && m.mutTarget && m.mutTarget.alive ? m.mutTarget.x : player.x;
      const ty = m.targetKind === 'mutant' && m.mutTarget && m.mutTarget.alive ? m.mutTarget.y : player.y;
      fireEnemyBullet(m, Math.atan2(ty - m.y, tx - m.x), dist(m.x, m.y, tx, ty));
      m.burst--; m.burstT = 0.09;
    }
  }

  // Threat priority 1: mutants nearby (faction war)
  const mut = nearestVisibleMutant(m);
  if (mut) {
    if (m.targetKind !== 'mutant') { startAim(m, 0); m.targetKind = 'mutant'; }
    m.mutTarget = mut;
    const dx = mut.x - m.x, dy = mut.y - m.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    m.facing = ang;
    if (d < 90) marauderMove(m, ang + Math.PI, 0.7, dt);
    if (m.aimT <= 0) marauderFire(m, mut.x, mut.y);
    return;
  }
  if (m.targetKind === 'mutant') m.targetKind = m.state === 'patrol' ? 'none' : 'player';

  if (m.state === 'patrol') {
    m.patrolT += dt;
    m.facing = m.baseFacing + Math.sin(m.patrolT * 0.5) * 0.8;
    if (canSeePlayer(m.x, m.y, m.facing, 300, 0.62)) {
      m.state = 'alert'; m.targetKind = 'player'; m.searchTimer = 4;
      startAim(m, 0.1);
      alertNearby(m.x, m.y, 320);
      sndAlert();
    }
    return;
  }
  // alert on player
  const dx = player.x - m.x, dy = player.y - m.y;
  const d = Math.hypot(dx, dy);
  const targetAngle = Math.atan2(dy, dx);
  const seeRange = playerConcealed() ? 70 : 420;
  const canSee = player.alive && d < seeRange && hasLineOfSight(m.x, m.y, player.x, player.y, level.solids);
  if (canSee) {
    if (m.targetKind !== 'player') { startAim(m, 0); m.targetKind = 'player'; }
    m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 4;
    m.facing = targetAngle;
    const desired = m.weapon === 'sawnoff' ? 150 : 220;
    if (d > desired) marauderMove(m, targetAngle, 0.6, dt);
    else if (d < desired * 0.55) marauderMove(m, targetAngle + Math.PI, 0.5, dt);
    if (m.aimT <= 0) marauderFire(m, player.x, player.y);
  } else {
    m.searchTimer -= dt;
    const ang = Math.atan2(m.lastKnownY - m.y, m.lastKnownX - m.x);
    const dd = dist(m.x, m.y, m.lastKnownX, m.lastKnownY);
    if (dd > 20) {
      m.facing = ang;
      marauderMove(m, ang, 0.5, dt);
    }
    if (m.searchTimer <= 0) { m.state = 'patrol'; m.targetKind = 'none'; m.patrolT = 0; m.baseFacing = m.facing; }
  }
}
function mutantCandidates(u) {
  const list = [];
  if (player.alive) list.push({ e: player, isPlayer: true });
  for (const m of level.marauders) if (m.alive) list.push({ e: m, isPlayer: false });
  return list;
}
function updateMutant(u, dt) {
  if (!u.alive) return;
  if (u.staggerT > 0) { u.staggerT -= dt; return; }
  u.meleeCD -= dt;
  if (u.state === 'wander') {
    u.wanderT -= dt;
    if (u.wanderT <= 0) {
      u.wanderT = 1.5 + Math.random() * 2;
      const distFromHome = dist(u.x, u.y, u.wanderCX, u.wanderCY);
      if (distFromHome > 150) {
        u.wanderAngle = Math.atan2(u.wanderCY - u.y, u.wanderCX - u.x) + (Math.random() - 0.5) * 0.6;
      } else {
        u.wanderAngle = Math.random() * Math.PI * 2;
      }
    }
    u.facing = u.wanderAngle;
    u.x += Math.cos(u.wanderAngle) * 40 * dt;
    u.y += Math.sin(u.wanderAngle) * 40 * dt;
    u.walkT += 40 * dt;
    resolveWalls(u, level.solids); clampToWorld(u, level.world);
    // aggro on the nearest human — player OR marauder
    for (const c of mutantCandidates(u)) {
      const detectR = c.isPlayer && playerConcealed() ? 80 : 210;
      if (dist(u.x, u.y, c.e.x, c.e.y) < detectR && hasLineOfSight(u.x, u.y, c.e.x, c.e.y, level.solids)) {
        u.state = 'chase';
        break;
      }
    }
  } else {
    // chase nearest human target
    let best = null, bestD = 460, bestIsPlayer = false;
    for (const c of mutantCandidates(u)) {
      const d = dist(u.x, u.y, c.e.x, c.e.y);
      if (d < bestD) { bestD = d; best = c.e; bestIsPlayer = c.isPlayer; }
    }
    if (!best) { u.state = 'wander'; return; }
    const dx = best.x - u.x, dy = best.y - u.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    u.facing = ang;
    if (d > u.r + best.r + 4) {
      u.x += Math.cos(ang) * 220 * dt;
      u.y += Math.sin(ang) * 220 * dt;
      u.walkT += 220 * dt;
      resolveWalls(u, level.solids); clampToWorld(u, level.world);
    }
    if (d < u.r + best.r + 8 && u.meleeCD <= 0) {
      u.meleeCD = 0.6;
      if (bestIsPlayer) {
        if (player.invuln <= 0) killPlayer('mutant');
      } else {
        best.hp -= 1;
        best.bittenBy = u;
        best.staggerT = 0.4;
        spawnBlood(best.x, best.y, false);
        sndMelee();
        if (best.hp <= 0) killMarauder(best, false);
      }
    }
  }
}

// ===== Bullets & bolts =====
function updateBullet(b, dt) {
  const steps = 2;
  for (let s = 0; s < steps && b.alive; s++) {
    b.x += b.vx * dt / steps;
    b.y += b.vy * dt / steps;
    for (const w of level.solids) {
      if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) { b.alive = false; spawnSpark(b.x, b.y); return; }
    }
    if (b.owner === 'enemy') {
      if (player.alive && player.invuln <= 0 && dist(b.x, b.y, player.x, player.y) < player.r + 3) {
        b.alive = false; killPlayer('shot'); return;
      }
      for (const u of level.mutants) {
        if (u.alive && dist(b.x, b.y, u.x, u.y) < u.r + 3) { b.alive = false; damageMutant(u, 1, b.x, b.y, false); return; }
      }
    } else {
      for (const m of level.marauders) {
        if (m.alive && dist(b.x, b.y, m.x, m.y) < m.r + 3) { b.alive = false; damageMarauder(m, 1, b.x, b.y, true); return; }
      }
      for (const u of level.mutants) {
        if (u.alive && dist(b.x, b.y, u.x, u.y) < u.r + 3) { b.alive = false; damageMutant(u, 1, b.x, b.y, true); return; }
      }
    }
  }
  b.life -= dt;
  if (b.life <= 0) b.alive = false;
}
function updateBullets(dt) {
  for (const b of bullets) if (b.alive) updateBullet(b, dt);
  bullets = bullets.filter(b => b.alive);
}
function updateBolts(dt) {
  for (const bo of boltsFlying) {
    bo.x += bo.vx * dt;
    bo.y += bo.vy * dt;
    bo.spin += 12 * dt;
    bo.life -= dt;
    for (const a of level.anomalies) {
      if (dist(bo.x, bo.y, a.x, a.y) < a.r + 6) {
        triggerAnomaly(a);
        bo.life = 0;
        break;
      }
    }
    if (bo.life <= 0) {
      sndBoltLand();
      spawnParticles(bo.x, bo.y, 2, '#c0c0b0', 60, 0.3, 2);
    }
  }
  boltsFlying = boltsFlying.filter(b => b.life > 0);
}

// ===== Particles & blood =====
function spawnParticles(x, y, count, color, speed, life, size) {
  if (particles.length > 350) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, maxLife: life, color, size });
  }
}
function spawnSpark(x, y) { spawnParticles(x, y, 4, '#ffe9a8', 180, 0.25, 2); }
function spawnMuzzleFlash(x, y, facing) {
  particles.push({ x: x + Math.cos(facing) * 18, y: y + Math.sin(facing) * 18, vx: 0, vy: 0, life: 0.06, maxLife: 0.06, color: '#fff6d0', size: 8 });
}
function spawnMeleeSlash(x, y, facing) { spawnParticles(x + Math.cos(facing) * 20, y + Math.sin(facing) * 20, 6, '#ffffff', 120, 0.15, 2); }
function spawnDashTrail(x, y) { spawnParticles(x, y, 8, getPlayerLook().jacket, 60, 0.3, 3); }
function spawnAnomalyDeath(x, y) { spawnParticles(x, y, 14, PAL.anomaly, 220, 0.5, 3); }
function spawnPickupParticles(x, y) { spawnParticles(x, y, 16, PAL.artifact, 150, 0.6, 3); }
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}
function spawnBlood(x, y, big) {
  const n = big ? 7 : 4;
  const splats = [];
  for (let i = 0; i < n; i++) {
    splats.push({ dx: (Math.random() - 0.5) * (big ? 36 : 20), dy: (Math.random() - 0.5) * (big ? 36 : 20), rr: (big ? 6 : 3) + Math.random() * (big ? 10 : 6) });
  }
  decals.push({ x, y, splats, color: Math.random() < 0.5 ? PAL.blood : PAL.bloodDark });
  if (decals.length > 250) decals.shift();
}

// ===== Gameplay checks =====
function updateAnomalies(dt) {
  for (const a of level.anomalies) {
    if (a.reveal > 0) a.reveal -= dt;
    a.spin += dt * (a.type === 'vortex' ? 2.2 : 0.4);
    // vortex drags anyone nearby toward the core — even while dormant
    if (a.type === 'vortex') {
      const pullR = a.r * 2.4;
      const pull = e => {
        const d = dist(e.x, e.y, a.x, a.y);
        if (d < pullR && d > 1) {
          const f = (1 - d / pullR) * 150 * dt;
          e.x += (a.x - e.x) / d * f;
          e.y += (a.y - e.y) / d * f;
        }
      };
      if (player.alive && player.invuln <= 0 && player.dashTime <= 0) pull(player);
      for (const m of level.marauders) if (m.alive) pull(m);
      for (const u of level.mutants) if (u.alive) pull(u);
    }
    // quiet idle voices, only audible up close
    const pd = dist(player.x, player.y, a.x, a.y);
    a.sndT -= dt;
    if (pd < 340 && a.sndT <= 0) {
      const prox = 1 - pd / 340;
      if (a.type === 'fry') { noiseBurst(0.04, 0.04 + 0.08 * prox, 1200); a.sndT = 0.5 + Math.random() * 1.6; }
      else if (a.type === 'arc') { tone(1800 + Math.random() * 900, 0.02, 'square', 0.02 + 0.05 * prox); a.sndT = 0.8 + Math.random() * 2; }
      else if (a.type === 'acid') { noiseBurst(0.1, 0.015 + 0.05 * prox, 500); a.sndT = 0.7 + Math.random() * 1.5; }
      else a.sndT = 1; // vortex speaks through the hum
    }
    a.pT -= dt;
    if (a.pT <= 0) {
      a.pT = a.reveal > 0 ? 0.1 : 1.2 + Math.random() * 1.6;
      if (particles.length < 350) {
        const ang = Math.random() * Math.PI * 2;
        const rr = Math.random() * a.r * 0.7;
        const col = a.type === 'fry' ? 'rgba(255,150,60,0.6)' : a.type === 'acid' ? 'rgba(184,232,58,0.5)' : 'rgba(180,255,140,0.5)';
        particles.push({ x: a.x + Math.cos(ang) * rr, y: a.y + Math.sin(ang) * rr, vx: 0, vy: a.type === 'fry' ? -30 : -14, life: 1.1, maxLife: 1.1, color: col, size: 2 });
      }
    }
  }
}
function checkAnomalyCollisions() {
  for (const a of level.anomalies) {
    if (player.alive && player.invuln <= 0 && dist(player.x, player.y, a.x, a.y) < a.r) {
      triggerAnomaly(a);
      killPlayer('anomaly');
      return;
    }
  }
  for (const m of level.marauders) {
    if (!m.alive) continue;
    for (const a of level.anomalies) {
      if (dist(m.x, m.y, a.x, a.y) < a.r) {
        m.alive = false; spawnAnomalyDeath(m.x, m.y); dropWeapon(m); triggerAnomaly(a); break;
      }
    }
  }
  for (const u of level.mutants) {
    if (!u.alive) continue;
    for (const a of level.anomalies) {
      if (dist(u.x, u.y, a.x, a.y) < a.r) {
        u.alive = false; spawnAnomalyDeath(u.x, u.y); triggerAnomaly(a); break;
      }
    }
  }
}
function checkArtifactPickup() {
  if (player.hasArtifact || level.artifact.taken) return;
  if (dist(player.x, player.y, level.artifact.x, level.artifact.y) < player.r + 18) {
    level.artifact.taken = true; player.hasArtifact = true; sndPickup();
    spawnPickupParticles(level.artifact.x, level.artifact.y);
  }
}
function checkWeaponPickups(dt) {
  for (const d of drops) {
    if (d.cd > 0) { d.cd -= dt; continue; }
    if (dist(player.x, player.y, d.x, d.y) < player.r + 12) {
      unlockWeapon(d.type); // touched it once — can start with it next raid
      if (d.type === player.weapon) {
        player.ammo += WEAPONS[d.type].pickupAmmo;
        d.dead = true;
      } else {
        const oldType = player.weapon, oldAmmo = player.ammo;
        player.weapon = d.type;
        player.ammo = d.ammo + WEAPONS[d.type].pickupAmmo;
        d.type = oldType; d.ammo = oldAmmo; d.cd = 1.6;
      }
      sndGunPickup();
    }
  }
  drops = drops.filter(d => !d.dead);
}
function checkExtraction() {
  if (!player.hasArtifact) return;
  const ex = level.extraction;
  if (player.x > ex.x && player.x < ex.x + ex.w && player.y > ex.y && player.y < ex.y + ex.h) {
    enterState('exit'); // step into the light — short walk-out animation, then next raid
    tone(500, 0.6, 'sine', 0.12, 950);
  }
}
function updateDetectorSound(dt) {
  if (!level || player.hasArtifact) return;
  detectorTimer -= dt;
  if (detectorTimer <= 0) {
    const d = dist(player.x, player.y, level.artifact.x, level.artifact.y);
    const t = clamp(1 - (d - 30) / 700, 0, 1);
    const interval = lerp(1.3, 0.12, t);
    const freq = lerp(480, 1500, t);
    sndBeep(freq);
    detectorTimer = interval;
  }
}

// ===== Camera =====
function screenToWorld(sx, sy) { return { x: sx + camera.x, y: sy + camera.y }; }
function clampCamera() {
  const w = level.world.w, h = level.world.h;
  if (w <= W) camera.x = (w - W) / 2; else camera.x = clamp(camera.x, 0, w - W);
  if (h <= H) camera.y = (h - H) / 2; else camera.y = clamp(camera.y, 0, h - H);
}
function updateCamera() { camera.x = player.x - W / 2; camera.y = player.y - H / 2; clampCamera(); }
function nearCamera(e, margin) {
  return e.x > camera.x - margin && e.x < camera.x + W + margin && e.y > camera.y - margin && e.y < camera.y + H + margin;
}

// ===== Player update =====
function updatePlayerMovement(dt) {
  let mx = 0, my = 0;
  if (usingTouch) {
    mx = joy.dx; my = joy.dy;
  } else {
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    const len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }
  }
  const moving = Math.hypot(mx, my) > 0.05;
  player.isMoving = moving;
  if (moving) {
    player.lastMoveAngle = Math.atan2(my, mx);
    player.walkT += player.speed * dt;
  }

  if (player.dashTime > 0) {
    player.dashTime -= dt;
    player.x += Math.cos(player.dashAngle) * player.dashSpeed * dt;
    player.y += Math.sin(player.dashAngle) * player.dashSpeed * dt;
  } else {
    player.x += mx * player.speed * dt;
    player.y += my * player.speed * dt;
  }
  resolveWalls(player, level.solids);
  clampToWorld(player, level.world);

  if (player.dashCD > 0) player.dashCD -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.fireCD > 0) player.fireCD -= dt;
  if (player.boltCD > 0) player.boltCD -= dt;

  if (usingTouch) {
    const target = nearestAliveEnemyWithin(player.x, player.y, AUTOAIM_RANGE);
    if (target) player.facing = Math.atan2(target.y - player.y, target.x - player.x);
    else if (moving) player.facing = player.lastMoveAngle;
  } else {
    const wp = screenToWorld(mouse.x, mouse.y);
    player.facing = Math.atan2(wp.y - player.y, wp.x - player.x);
  }
}
function updatePlayerActions() {
  if (inputLock > 0) return;
  const attackHeld = usingTouch ? btnAttack.active : mouse.down;
  if (attackHeld) tryAttack();
}

// ===== Main update =====
function updatePlaying(dt) {
  updatePlayerMovement(dt);
  if (!player.alive) return;
  updatePlayerActions();
  if (!player.alive) return;
  for (const m of level.marauders) {
    if (!m.alive) continue;
    if (nearCamera(m, 500)) updateMarauder(m, dt);
    else { if (m.fireCD > 0) m.fireCD -= dt; if (m.staggerT > 0) m.staggerT -= dt; }
  }
  if (!player.alive) return;
  for (const u of level.mutants) {
    if (!u.alive) continue;
    if (nearCamera(u, 500)) updateMutant(u, dt);
    else { if (u.staggerT > 0) u.staggerT -= dt; u.meleeCD -= dt; }
  }
  if (!player.alive) return;
  updateBullets(dt);
  if (!player.alive) return;
  updateBolts(dt);
  updateParticles(dt);
  updateAnomalies(dt);
  checkAnomalyCollisions();
  if (!player.alive) return;
  checkArtifactPickup();
  checkWeaponPickups(dt);
  checkExtraction();
  if (state !== 'playing') return;
  updateDetectorSound(dt);
  updateHum();
  updateCamera();
}
function update(dt) {
  if (state === 'intro') {
    stateTimer += dt;
    if (stateTimer > 1.8) enterState('playing');
  } else if (state === 'playing') {
    updatePlaying(dt);
  } else if (state === 'exit') {
    stateTimer += dt;
    const cx = level.extraction.x + level.extraction.w / 2;
    const cy = level.extraction.y + level.extraction.h / 2;
    player.x = lerp(player.x, cx, dt * 3);
    player.y = lerp(player.y, cy, dt * 3);
    player.facing = 0;
    player.walkT += 110 * dt;
    player.isMoving = true;
    updateParticles(dt);
    if (stateTimer >= 0.9) completeLevel();
  }
}

// ===== Sprites =====
function drawHuman(x, y, facing, r, frame, look, weaponType, aimFrac, maskKind) {
  const u = r / 6;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, u, r * 0.95, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(facing);
  // feet — 2-frame step animation
  const step = frame === 0 ? 1.5 * u : -1.5 * u;
  ctx.fillStyle = look.jacketDark;
  ctx.fillRect(-1 * u + step, -3.6 * u, 2.4 * u, 1.7 * u);
  ctx.fillRect(-1 * u - step, 1.9 * u, 2.4 * u, 1.7 * u);
  // torso
  ctx.fillStyle = look.jacketDark;
  ctx.fillRect(-3.4 * u, -3.2 * u, 6.2 * u, 6.4 * u);
  ctx.fillStyle = look.jacket;
  ctx.fillRect(-2.8 * u, -2.6 * u, 5 * u, 5.2 * u);
  // arms reaching forward to the gun
  ctx.fillStyle = look.jacket;
  ctx.fillRect(0.6 * u, -2.6 * u, 3.2 * u, 1.4 * u);
  ctx.fillRect(0.6 * u, 1.2 * u, 3.2 * u, 1.4 * u);
  // gun — barrel length shows the weapon; raises out as aimFrac -> 1
  const w = WEAPONS[weaponType];
  const gl = w.gunLen * (0.45 + 0.55 * aimFrac) * u;
  const gw = w.wide ? 1.9 * u : 1.3 * u;
  ctx.fillStyle = '#1d1d1d';
  ctx.fillRect(2.6 * u, -gw / 2, gl, gw);
  ctx.fillStyle = '#3d3d3d';
  ctx.fillRect(2.6 * u, -gw / 2, 1.6 * u, gw);
  // head — mask style changes the silhouette
  const mk = maskKind || 'gasmask';
  ctx.fillStyle = look.head;
  ctx.beginPath(); ctx.arc(0.2 * u, 0, 2.6 * u, 0, Math.PI * 2); ctx.fill();
  if (mk === 'balaclava') {
    ctx.fillStyle = '#1e1e1a';
    ctx.beginPath(); ctx.arc(0.3 * u, 0, 2.3 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = look.eyes;
    ctx.fillRect(1.4 * u, -1.3 * u, 0.9 * u, 2.6 * u); // eye slit
  } else if (mk === 'hood') {
    ctx.strokeStyle = look.jacketDark;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0.2 * u, 0, 2.4 * u, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#8a7a62'; // bare face in the hood shadow
    ctx.fillRect(1.5 * u, -1.1 * u, 1.4 * u, 2.2 * u);
    ctx.fillStyle = '#22201c';
    ctx.fillRect(1.9 * u, -1.2 * u, 0.7 * u, 0.8 * u);
    ctx.fillRect(1.9 * u, 0.4 * u, 0.7 * u, 0.8 * u);
  } else {
    // gas-mask snout + lenses
    ctx.fillStyle = look.mask;
    ctx.fillRect(1.6 * u, -1.2 * u, 2.1 * u, 2.4 * u);
    ctx.fillStyle = look.eyes;
    ctx.fillRect(1.1 * u, -1.7 * u, 1 * u, 1 * u);
    ctx.fillRect(1.1 * u, 0.7 * u, 1 * u, 1 * u);
  }
  ctx.restore();
}
function drawMutantSprite(x, y, facing, r, frame) {
  const u = r / 6;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';

  ctx.rotate(facing);

  ctx.fillRect(5.6 * u, 0.5 * u, 1.3 * u, 0.8 * u);

  ctx.fillRect(4 * u, -1.5 * u, 1 * u, 1 * u);

// ===== Rendering =====
function drawFloor() {
  const { w, h } = level.world;
  const th = level.theme;
  ctx.fillStyle = th.floor1;
  ctx.fillRect(0, 0, w, h);
  const tile = 64;
  ctx.fillStyle = th.floor2;
  for (let y = 0; y < h; y += tile) {
    for (let x = 0; x < w; x += tile) {
      if (((x / tile + y / tile) | 0) % 2 === 0) ctx.fillRect(x, y, tile, tile);
    }
  }
  ctx.fillStyle = th.decor;
  for (const r of level.decor) ctx.fillRect(r.x, r.y, r.w, r.h);
}
function drawWalls() {
  for (const w of level.walls) {
    ctx.fillStyle = PAL.wallDark;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(w.x, w.y, w.w, Math.min(6, w.h));
    ctx.strokeStyle = PAL.wallEdge;
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
  }
}
function drawProps() {
  // crates

function drawBushes() {

function drawAcidPuddle(a, bright) {

function drawAnomalies() {
  for (let i = 0; i < level.anomalies.length; i++) {
    const a = level.anomalies[i];

    if (a.type === 'acid') drawAcidPuddle(a, false);
    if (a.reveal > 0) {
      const k = clamp(a.reveal / 2.6, 0, 1);
      const pulse = 0.7 + 0.3 * Math.sin(animT * 14);
      if (a.type === 'fry') {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.4);
        grad.addColorStop(0, 'rgba(255,200,120,' + (0.6 * k * pulse) + ')');
        grad.addColorStop(0.5, 'rgba(255,120,40,' + (0.32 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(255,90,30,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,140,' + 0.7 * k + ')';
        for (let j = 0; j < 5; j++) {
          const fx = a.x + (hash1(i * 9 + j * 23 + tSeed) - 0.5) * a.r * 1.4;
          const fy = a.y + (hash1(i * 17 + j * 31 + tSeed) - 0.5) * a.r * 1.2 - hash1(j + tSeed) * 12;
          ctx.fillRect(fx, fy, 3, 5);
        }
      } else if (a.type === 'vortex') {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.6);

function loadoutRows() {

function cycleGear(row, dir) {
  if (row === 0) gear.jacket = (gear.jacket + dir + JACKETS.length) % JACKETS.length;
  else if (row === 1) gear.mask = (gear.mask + dir + MASKS.length) % MASKS.length;
  else if (row === 2) gear.weapon = (clamp(gear.weapon, 0, unlockedWeapons.length - 1) + dir + unlockedWeapons.length) % unlockedWeapons.length;
  else gear.bolts = clamp(gear.bolts + dir, 2, 10);

}
function loadoutLayout() {
  const rowY0 = H * 0.44, rowH = Math.min(56, H * 0.085);

  ctx.fillStyle = PAL.anomaly;
  ctx.font = 'bold ' + Math.round(clamp(W * 0.07, 30, 60)) + 'px monospace';
  ctx.fillText('ПЕРИМЕТР', W / 2, H * 0.24);
  ctx.fillStyle = PAL.artifact;
  ctx.font = 'bold ' + Math.round(clamp(W * 0.04, 18, 30)) + 'px monospace';
  ctx.fillText('В Ы Н О С', W / 2, H * 0.24 + 46);

  ctx.fillStyle = PAL.hudText;
  ctx.font = '14px monospace';
  ctx.fillText('5 вылазок за артефактами. Смерть с одного удара.', W / 2, H * 0.42);
  ctx.fillText('Стервятники и Хрипуны грызутся между собой — стравливайте их.', W / 2, H * 0.42 + 22);
  ctx.fillText('Аномалии невидимы. Кидайте болты. Идите на писк детектора.', W / 2, H * 0.42 + 44);

  const likelyTouch = usingTouch || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  ctx.fillStyle = PAL.hudDim;
  if (likelyTouch) {
    ctx.fillText('СТИК СЛЕВА — ДВИЖЕНИЕ', W / 2, H * 0.6);
    ctx.fillText('БОЙ / РЫВОК / БОЛТ СПРАВА', W / 2, H * 0.6 + 20);
  } else {
    ctx.fillText('WASD — ДВИЖЕНИЕ · МЫШЬ — ПРИЦЕЛ · ЛКМ — ВЫСТРЕЛ/УДАР', W / 2, H * 0.6);
    ctx.fillText('ПРОБЕЛ — РЫВОК · E/ПКМ — БОЛТ · R — РЕСТАРТ', W / 2, H * 0.6 + 20);
  }

  const pulse = 0.6 + 0.4 * Math.sin(animT * 3);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = PAL.extract;
  ctx.font = 'bold 20px monospace';
  ctx.fillText(likelyTouch ? 'КОСНИТЕСЬ, ЧТОБЫ НАЧАТЬ' : 'НАЖМИТЕ, ЧТОБЫ НАЧАТЬ', W / 2, H * 0.78);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}
function drawIntroOverlay() {
  const alpha = stateTimer < 1.4 ? 0.72 : Math.max(0, 0.72 * (1 - (stateTimer - 1.4) / 0.4));
  ctx.fillStyle = 'rgba(5,8,4,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
  if (alpha <= 0.02) return;
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.hudDim;
  ctx.font = '14px monospace';
  ctx.fillText('ГЛУБИНА ' + (levelIndex + 1) + ' / ' + LEVELS.length, W / 2, H / 2 - 50);
  ctx.fillStyle = PAL.hudText;
  ctx.font = 'bold 26px monospace';
  ctx.fillText(level.name.toUpperCase(), W / 2, H / 2 - 18);
  ctx.fillStyle = PAL.artifact;
  ctx.font = '16px monospace';
  ctx.fillText('ЦЕЛЬ: ' + level.artifactName.toUpperCase() + ' (' + level.artifactValue + ')', W / 2, H / 2 + 18);
  if (levelIndex === 0) {
    ctx.fillStyle = PAL.hudDim;
    ctx.font = '13px monospace';
    ctx.fillText('Артефакт невидим — ищите по писку детектора', W / 2, H / 2 + 46);
    ctx.fillText('Болт раскрывает скрытые аномалии', W / 2, H / 2 + 64);
  }
  ctx.textAlign = 'left';
}
function deathReasonText() {
  if (deathReason === 'anomaly') return 'ПОГЛОЩЁН МАРЕВОМ';
  if (deathReason === 'mutant') return 'РАСТЕРЗАН';
  return 'ВЫ МЕРТВЫ';
}
function drawDeadOverlay() {
  ctx.fillStyle = 'rgba(120,10,10,0.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(clamp(W * 0.05, 26, 46)) + 'px monospace';
  ctx.fillText(deathReasonText(), W / 2, H / 2 - 20);
  ctx.font = '18px monospace';
  ctx.fillStyle = PAL.hudText;
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ ЭКРАНА' : 'НАЖМИТЕ ЛЮБУЮ КЛАВИШУ', W / 2, H / 2 + 30);
  ctx.textAlign = 'left';
}
function drawCompleteOverlay() {
  ctx.fillStyle = 'rgba(10,20,10,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.extract;
  ctx.font = 'bold 28px monospace';
  ctx.fillText('ВЫЛАЗКА ЗАВЕРШЕНА', W / 2, H / 2 - 110);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '17px monospace';
  const s = lastCompleteStats;
  ctx.fillText(s.name, W / 2, H / 2 - 74);
  ctx.fillText('АРТЕФАКТ «' + s.artifactName.toUpperCase() + '»: +' + s.value, W / 2, H / 2 - 42);
  ctx.fillText('ВРЕМЯ: ' + formatTime(s.time), W / 2, H / 2 - 14);
  ctx.fillText('УБИЙСТВ: ' + s.kills + (s.kills > 0 ? '  (+' + s.kills * 25 + ')' : ''), W / 2, H / 2 + 14);
  ctx.fillStyle = s.stealth ? PAL.anomaly : PAL.hudDim;
  ctx.fillText(s.stealth ? 'БОНУС ЗА СКРЫТНОСТЬ: +300' : 'СКРЫТНОСТЬ НАРУШЕНА', W / 2, H / 2 + 42);
  ctx.fillStyle = PAL.artifact;
  ctx.font = 'bold 20px monospace';
  ctx.fillText('СЧЁТ: ' + s.score, W / 2, H / 2 + 78);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '16px monospace';
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ, ЧТОБЫ ПРОДОЛЖИТЬ' : 'НАЖМИТЕ, ЧТОБЫ ПРОДОЛЖИТЬ', W / 2, H / 2 + 118);
  ctx.textAlign = 'left';
}
function drawVictoryOverlay() {
  ctx.fillStyle = 'rgba(6,14,6,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.artifact;
  ctx.font = 'bold 30px monospace';
  ctx.fillText('ВЫНОС ЗАВЕРШЁН', W / 2, H / 2 - 110);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '17px monospace';
  const s = lastVictoryStats;
  ctx.fillText('ВЫЛАЗОК ПРОЙДЕНО: ' + s.levels + ' / ' + LEVELS.length, W / 2, H / 2 - 68);
  ctx.fillText('ВСЕГО УБИЙСТВ: ' + s.kills, W / 2, H / 2 - 38);
  ctx.fillText('ОБЩЕЕ ВРЕМЯ: ' + formatTime(s.timeTotal), W / 2, H / 2 - 8);
  ctx.fillStyle = PAL.anomaly;
  ctx.fillText('СКРЫТНЫХ ВЫЛАЗОК: ' + s.stealthCount + ' / ' + LEVELS.length, W / 2, H / 2 + 22);
  ctx.fillStyle = PAL.artifact;
  ctx.font = 'bold 22px monospace';
  ctx.fillText('ИТОГОВЫЙ СЧЁТ: ' + s.score, W / 2, H / 2 + 60);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '16px monospace';
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ, ЧТОБЫ НАЧАТЬ ЗАНОВО' : 'НАЖМИТЕ, ЧТОБЫ НАЧАТЬ ЗАНОВО', W / 2, H / 2 + 104);
  ctx.textAlign = 'left';
}

function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { renderMenu(); return; }
  if (state === 'loadout') { renderLoadout(); return; }
  if (!level) return;
  drawWorld();
  drawHUD();
  drawTouchControls();
  if (state === 'intro') drawIntroOverlay();
  if (state === 'exit') {
    const a = clamp(stateTimer / 0.9, 0, 1);
    ctx.fillStyle = 'rgba(215,245,235,' + (a * a) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (state === 'dead') drawDeadOverlay();
  if (state === 'levelcomplete') drawCompleteOverlay();
  if (state === 'victory') drawVictoryOverlay();
  drawGrain();
}

// ===== Input =====
function handleTapAdvance() {
  if (inputLock > 0) return;
  if (state === 'menu') {
    runStats = { kills: 0, levels: 0, stealthCount: 0, timeTotal: 0, score: 0 };
    pendingLevel = 0;
    enterState('loadout');
  } else if (state === 'intro') enterState('playing');
  else if (state === 'dead') restartLevel(); // instant, keeps current gear
  else if (state === 'levelcomplete') { pendingLevel = levelIndex + 1; enterState('loadout'); }
  else if (state === 'victory') {
    runStats = { kills: 0, levels: 0, stealthCount: 0, timeTotal: 0, score: 0 };
    pendingLevel = 0;
    enterState('loadout');
  }
}

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  ensureAudio();
  if (state === 'loadout') {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') gearRow = (gearRow + 3) % 4;
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') gearRow = (gearRow + 1) % 4;
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') cycleGear(gearRow, -1);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') cycleGear(gearRow, 1);
    else if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); if (inputLock <= 0) startRaid(); }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); if (state === 'playing') tryDash(); }
  if (e.code === 'KeyE') { if (state === 'playing') throwBolt(); }
  if (e.code === 'KeyR') { if (state === 'playing' || state === 'dead') restartLevel(); }
  if (state !== 'playing' && state !== 'exit') handleTapAdvance();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', e => {
  ensureAudio();
  if (state === 'loadout') { loadoutTap(e.clientX, e.clientY); return; }
  if (state === 'exit') return;
  if (state !== 'playing') { handleTapAdvance(); return; }
  if (e.button === 2) { throwBolt(); return; }
  mouse.down = true; tryAttack();
});
window.addEventListener('mouseup', e => { if (e.button !== 2) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function onTouchStart(e) {
  e.preventDefault();
  usingTouch = true;
  ensureAudio();
  if (state === 'loadout') {
    for (const t of e.changedTouches) loadoutTap(t.clientX, t.clientY);
    return;
  }
  if (state === 'exit') return;
  if (state !== 'playing') { handleTapAdvance(); return; }
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    const jb = getJoyBase();
    if (joy.id === null && dist(x, y, jb.x, jb.y) < 95) {
      joy.id = t.identifier; joy.dx = 0; joy.dy = 0;
      continue;
    }
    const ba = getBtnAttack();
    if (btnAttack.id === null && dist(x, y, ba.x, ba.y) < ba.r + 10) {
      btnAttack.id = t.identifier; btnAttack.active = true; tryAttack();
      continue;
    }
    const bd = getBtnDash();
    if (btnDash.id === null && dist(x, y, bd.x, bd.y) < bd.r + 8) {
      btnDash.id = t.identifier; btnDash.active = true; tryDash();
      continue;
    }
    const bb = getBtnBolt();
    if (btnBolt.id === null && dist(x, y, bb.x, bb.y) < bb.r + 8) {
      btnBolt.id = t.identifier; btnBolt.active = true; throwBolt();
      continue;
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      const jb = getJoyBase();
      const dx = t.clientX - jb.x, dy = t.clientY - jb.y;
      const d = Math.hypot(dx, dy);
      const m = Math.min(d, joy.maxR);
      const a = Math.atan2(dy, dx);
      joy.dx = d > 0 ? Math.cos(a) * (m / joy.maxR) : 0;
      joy.dy = d > 0 ? Math.sin(a) * (m / joy.maxR) : 0;
    }
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { joy.id = null; joy.dx = 0; joy.dy = 0; }
    if (t.identifier === btnAttack.id) { btnAttack.id = null; btnAttack.active = false; }
    if (t.identifier === btnDash.id) { btnDash.id = null; btnDash.active = false; }
    if (t.identifier === btnBolt.id) { btnBolt.id = null; btnBolt.active = false; }
  }
}
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

// ===== Main loop =====
let lastTs = performance.now();
function tick(ts) {
  requestAnimationFrame(tick);
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  animT += dt;
  if (inputLock > 0) inputLock = Math.max(0, inputLock - dt);
  musicTick();
  update(dt);
  render();
}
requestAnimationFrame(tick);
</script>
</body>
</html>
