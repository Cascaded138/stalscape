const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let W = 0, H = 0;
const fogCanvas = document.createElement('canvas');
const fctx = fogCanvas.getContext('2d');
const FOG_S = 0.5;
let vignetteCanvas = null;
function buildVignette() {
  vignetteCanvas = document.createElement('canvas');
  vignetteCanvas.width = Math.ceil(W / 2); vignetteCanvas.height = Math.ceil(H / 2);
  const v = vignetteCanvas.getContext('2d');
  const g = v.createRadialGradient(W / 4, H / 4, Math.min(W, H) * 0.22, W / 4, H / 4, Math.max(W, H) * 0.42);
  g.addColorStop(0, 'rgba(6,8,5,0)');
  g.addColorStop(1, 'rgba(6,8,5,0.55)');
  v.fillStyle = g;
  v.fillRect(0, 0, vignetteCanvas.width, vignetteCanvas.height);
}
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  fogCanvas.width = Math.ceil(W * FOG_S);
  fogCanvas.height = Math.ceil(H * FOG_S);
  buildVignette();
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();

// ===== Math helpers =====
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function hash1(n) { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function resolveWalls(e, walls) {
  let hit = false;
  for (const w of walls) {
    const nx = clamp(e.x, w.x, w.x + w.w);
    const ny = clamp(e.y, w.y, w.y + w.h);
    const dx = e.x - nx, dy = e.y - ny;
    const d = Math.hypot(dx, dy);
    if (d < e.r) {
      hit = true;
      if (d === 0) {
        const left = e.x - w.x, right = (w.x + w.w) - e.x, top = e.y - w.y, bottom = (w.y + w.h) - e.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) e.x = w.x - e.r;
        else if (m === right) e.x = w.x + w.w + e.r;
        else if (m === top) e.y = w.y - e.r;
        else e.y = w.y + w.h + e.r;
      } else {
        const push = (e.r - d) / d;
        e.x += dx * push;
        e.y += dy * push;
      }
    }
  }
  return hit;
}
function clampToWorld(e, world) {
  e.x = clamp(e.x, e.r, world.w - e.r);
  e.y = clamp(e.y, e.r, world.h - e.r);
}
function hasLineOfSight(x1, y1, x2, y2, solids) {
  const d = dist(x1, y1, x2, y2);
  const steps = Math.max(1, Math.ceil(d / 18));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = lerp(x1, x2, t), y = lerp(y1, y2, t);
    for (const w of solids) {
      if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return false;
    }
  }
  return true;
}
function overlapsAny(rect, list, pad) {
  for (const o of list) {
    if (rect.x - pad < o.x + o.w && rect.x + rect.w + pad > o.x &&
        rect.y - pad < o.y + o.h && rect.y + rect.h + pad > o.y) return true;
  }
  return false;
}

  journal: [],
  bestScore: 0,
});
let save = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      save = Object.assign(defaultSave(), s);
      save.ownedWeapons = Object.assign(defaultSave().ownedWeapons, s.ownedWeapons);
      save.ammoUp = Object.assign(defaultSave().ammoUp, s.ammoUp);
      save.items = Object.assign(defaultSave().items, s.items);
      save.gear = Object.assign(defaultSave().gear, s.gear);
      if (!Array.isArray(save.journal)) save.journal = [];
    } else {
      // migrate old v1 progress: keep money, day and diary
      const old = localStorage.getItem('perimeter_save_v1');
      if (old) {
        const s = JSON.parse(old);
        save.money = s.money || 0;
        save.day = s.day || 1;
        save.journal = Array.isArray(s.journal) ? s.journal : [];
        save.boltCap = s.boltCap || 6;
        if (s.owned) { save.ownedWeapons.sawnoff = !!s.owned.sawnoff; save.ownedWeapons.rifle = !!s.owned.rifle; }
      }
    }
  } catch (e) { save = defaultSave(); }
  if (!save.ownedWeapons[save.gear.weapon]) save.gear.weapon = 'pistol';
  if (!save.ownedBodies.includes(save.gear.body)) save.gear.body = 'jacket';
  if (!save.ownedHeads.includes(save.gear.head)) save.gear.head = 'hood';
  save.gear.bolts = clamp(save.gear.bolts, 2, save.boltCap);
}
function persistSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function addJournal(line) {
  save.journal.unshift(line);
  if (save.journal.length > 40) save.journal.length = 40;
  persistSave();
}

// ===== Audio core with recovery =====
// A single handler brings sound back after ANY interruption: tab switch,
// screen lock, output-device change (headphones), incoming call.
let actx = null;
let audioWanted = false;
function buildContext() {
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; return; }
  actx.onstatechange = () => {
    if (!actx) return;
    if (actx.state !== 'running' && audioWanted && document.visibilityState === 'visible') recoverAudio();
  };
}
function ensureAudio() {
  audioWanted = true;
  if (!actx) buildContext();
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
let recoverT = 0;
function recoverAudio() {
  if (!audioWanted) return;
  if (!actx) { buildContext(); restartAudioGraph(); return; }
  const st = actx.state;
  if (st === 'running') return;
  actx.resume().then(() => {
    if (actx.state !== 'running') recreateContext();
    else restartAudioGraph();
  }).catch(() => recreateContext());
}
function recreateContext() {
  // device switched / context died (iOS "interrupted") — rebuild from scratch
  try { if (actx) actx.close(); } catch (e) {}
  actx = null;
  buildContext();
  restartAudioGraph();
}
function restartAudioGraph() {
  if (!actx) return;
  music.nextT = 0; // scheduler re-syncs to the new clock
  if (level && (state === 'playing' || state === 'intro')) startHum();
  startWind();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') recoverAudio();
});
window.addEventListener('focus', () => recoverAudio());
window.addEventListener('pageshow', () => recoverAudio());
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', () => {
    // output jumped (headphones in/out) — give the route a moment, then recover
    setTimeout(recoverAudio, 300);
    setTimeout(recoverAudio, 1200);
  });
}

function tone(freq, dur, type, vol, slideTo, when) {
  if (!actx || actx.state !== 'running') return;
  const t0 = when || actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gain.gain.setValueAtTime(vol || 0.2, t0);

const music = { on: false, step: 0, nextT: 0, tempo: 0.44, base: 82.4, bass: [], lead: [] };
function genSong() {
  const rng = mulberry32((Math.random() * 1e9) | 0);
  const minor = [0, 2, 3, 5, 7, 8, 10];
  music.base = 73.4 * Math.pow(2, Math.floor(rng() * 4) / 12);
  music.tempo = 0.46 + rng() * 0.14;
  const prog = [0, 0, rng() < 0.5 ? 5 : 3, rng() < 0.5 ? 3 : 8];
  music.bass = []; music.lead = [];
  for (let i = 0; i < 16; i++) {
    const deg = prog[(i / 4) | 0];
    music.bass.push(i % 2 === 0 ? deg : (rng() < 0.3 ? deg + 7 : -1));
    music.lead.push(rng() < 0.2 ? minor[(minor.indexOf(deg % 12) + [0, 2, 4][Math.floor(rng() * 3)] + 7) % 7] + 12 : -1);
  }

}

  if (!actx || actx.state !== 'running' || !music.on) return;
  if (music.nextT < actx.currentTime) music.nextT = actx.currentTime + 0.05;
  while (music.nextT < actx.currentTime + 0.3) {
    const s = music.step, t = music.nextT;
    const b = music.bass[s];
    if (b >= 0) tone(noteFreq(b), music.tempo * 0.9, 'square', 0.024, undefined, t);
    const l = music.lead[s];
    if (l >= 0) tone(noteFreq(l) * 2, music.tempo * 1.7, 'triangle', 0.018, noteFreq(l) * 2 * 0.99, t);
    if (s % 8 === 0) tone(55, 0.12, 'sine', 0.05, 30, t);
    if (s % 4 === 2) noiseBurst(0.03, 0.014, 6000, t);
    music.step = (music.step + 1) % 16;
    music.nextT += music.tempo;
  }
}

    for (let t = 0; t < 90; t++) {

      const y = inner.y + 30 + rng() * (inner.h - 60);
      if (dist(x, y, start.x, start.y) < minStartDist) continue;
      if (overlapsAny({ x: x - pad, y: y - pad, w: pad * 2, h: pad * 2 }, solids, 0)) continue;
      if (!clearOfAnomalies(x, y, 30)) continue;
      if (extra && !extra(x, y)) continue;
      return { x, y };
    }
    return { x: world.w - 200, y: world.h / 2 };
  }
  const exPos = placePoint(world.w * 0.6, 55, x => x > world.w * 0.66);
  const extraction = {
    x: clamp(exPos.x - 50, 60, world.w - 160),
    y: clamp(exPos.y - 50, 60, world.h - 160),
    w: 100, h: 100,
  };
  // artifacts: typed, several per map
  const artCount = Math.round(def.counts.artifacts * (modifier === 'fresh' ? 2 : 1));
  const diag = Math.hypot(world.w, world.h);
  const artifacts = [];
  function spawnArtifact(x, y, tierIdx) {
    const t = ART_TYPES[tierIdx];
    artifacts.push({ x, y, type: t.id, name: t.name, value: t.value, radPerSec: t.rad, buff: t.buff, taken: false });
  }
  for (let i = 0; i < artCount; i++) {
    const p = placePoint(diag * (0.3 + 0.1 * i / Math.max(1, artCount - 1)), 25,
      (x, y) => dist(x, y, extraction.x + 50, extraction.y + 50) > 240 &&
                artifacts.every(a => dist(x, y, a.x, a.y) > 420));
    spawnArtifact(p.x, p.y, def.artTiers[Math.floor(rng() * def.artTiers.length)]);
  }
  // landmark bonus artifacts near church/nest/pylon
  for (const L of landmarks) {
    if (LANDMARKS[L.key].loot === 'artifact') {
      spawnArtifact(L.x + L.w / 2 + (rng() - 0.5) * 60, L.y + L.h / 2 + (rng() - 0.5) * 40,
        def.artTiers[Math.floor(rng() * def.artTiers.length)]);
    }
  }
  const hiddenFromStart = (x, y) => !hasLineOfSight(start.x, start.y, x, y, solids) || dist(x, y, start.x, start.y) > 700;
  // marauder squads
  const marauders = [];
  let squads = def.squads;
  if (modifier === 'pack') squads = squads.map(s => ({ size: Math.max(1, s.size - 1), weapons: s.weapons }));
  squads.forEach((sq, sqi) => {
    const anchor = placePoint(500, 30, hiddenFromStart);
    const waypoints = [];
    for (let wpi = 0; wpi < 3; wpi++) {
      for (let t = 0; t < 40; t++) {
        const a = rng() * Math.PI * 2, rr = 120 + rng() * 380;
        const wx = clamp(anchor.x + Math.cos(a) * rr, 90, world.w - 90);
        const wy = clamp(anchor.y + Math.sin(a) * rr, 90, world.h - 90);
        if (overlapsAny({ x: wx - 16, y: wy - 16, w: 32, h: 32 }, solids, 0)) continue;
        if (!clearOfAnomalies(wx, wy, 40)) continue;
        waypoints.push({ x: wx, y: wy });
        break;
      }
    }
    if (!waypoints.length) waypoints.push({ x: anchor.x, y: anchor.y });
    for (let i = 0; i < sq.size; i++) {
      const face = rng() * Math.PI * 2;
      const wp = sq.weapons[i % sq.weapons.length];
      marauders.push({
        x: clamp(anchor.x + (rng() - 0.5) * 90, 60, world.w - 60),
        y: clamp(anchor.y + (rng() - 0.5) * 90, 60, world.h - 60),
        r: 11, hp: 2, alive: true,
        facing: face, baseFacing: face, weapon: wp,
        mag: WEAPONS[wp].mag, reloadT: 0,
        squad: sqi, waypoints, wpIdx: Math.floor(rng() * waypoints.length),
        mode: sqi % 2 === 0 ? 'route' : 'post',
        state: 'patrol', patrolT: rng() * 10,
        suspicion: 0, susT: 0, goalX: 0, goalY: 0,
        fireCD: 0, aimT: 0, staggerT: 0, burst: 0, burstT: 0,
        targetKind: 'none', searchTimer: 0, lastKnownX: anchor.x, lastKnownY: anchor.y,
        walkT: 0, bittenBy: null, mutTarget: null, stepT: rng(),
      });
    }
  });
  // mutant packs
  const mutants = [];
  let packs = def.packs.slice();
  if (modifier === 'pack') packs = packs.concat([3]);
  const nestL = landmarks.find(l => l.key === 'nest');
  if (nestL) packs.push(2);
  packs.forEach((size, pi) => {
    let anchor;
    if (nestL && pi === packs.length - 1) anchor = { x: nestL.x + nestL.w / 2, y: nestL.y + nestL.h / 2 };
    else anchor = placePoint(550, 30, hiddenFromStart);
    for (let i = 0; i < size; i++) {
      mutants.push({
        x: clamp(anchor.x + (rng() - 0.5) * 110, 60, world.w - 60),
        y: clamp(anchor.y + (rng() - 0.5) * 110, 60, world.h - 60),
        r: 13, hp: 5, alive: true, facing: 0,
        pack: pi,
        state: 'wander', wanderT: rng() * 2, wanderAngle: rng() * Math.PI * 2,
        wanderCX: anchor.x, wanderCY: anchor.y,
        goalX: 0, goalY: 0,
        meleeCD: 0, staggerT: 0, walkT: 0, growlT: rng() * 4,
      });
    }
  });
  let boss = null;
  if (def.boss) {
    const p = placePoint(world.w * 0.45, 60, (x) => x > world.w * 0.4 && x < world.w * 0.75);
    boss = {
      x: p.x, y: p.y, r: 26, hp: 34, maxHp: 34, alive: true, facing: 0,
      state: 'idle', t: 0, chargeDir: 0, walkT: 0, aware: false,
    };
  }
  const corpses = [];
  for (let i = 0; i < def.counts.corpses; i++) {
    const p = placePoint(400, 18, null);
    const roll = rng();
    corpses.push({ x: p.x, y: p.y, looted: false, loot: roll < 0.4 ? 'ammo' : roll < 0.65 ? 'bolts' : roll < 0.85 ? 'money' : 'medkit' });
  }
  const caches = [];
  for (const b of buildings) {
    if (rng() < 0.8) caches.push({ x: b.x + 40 + rng() * (b.w - 80), y: b.y + 40 + rng() * (b.h - 80), looted: false, loot: rng() < 0.5 ? 'ammo' : rng() < 0.6 ? 'bolts' : 'medkit' });
  }
  for (const L of landmarks) {
    const lt = LANDMARKS[L.key].loot;
    if (lt !== 'artifact') caches.push({ x: L.x + L.w / 2 + 20, y: L.y + L.h / 2 + 16, looted: false, loot: lt });
  }
  let npc = null;
  if (!def.boss && rng() < 0.45) {
    const p = placePoint(600, 40, hiddenFromStart);
    npc = { x: p.x, y: p.y, r: 11, hp: 2, alive: true, facing: rng() * Math.PI * 2, traded: false, walkT: 0 };
    lights.push({ x: p.x + 26, y: p.y + 8, r: 64, warm: true, flicker: true });
  }
  let emisAt = -1;
  if (!def.boss && rng() < 0.25 && buildings.length) emisAt = 35 + rng() * 50;
  const decor = [];
  for (let i = 0; i < 40; i++) {
    decor.push({ x: rng() * world.w, y: rng() * world.h, w: 16 + rng() * 46, h: 6 + rng() * 14 });
  }
  return {
    name: def.name, theme: THEMES[def.theme], world, def,
    playerStart: start,
    walls, crates, cars, trees, solids, bushes, grass, buildings, landmarks, lights, decor,
    marauders, mutants, boss, corpses, caches, npc,
    anomalies, artifacts,
    extraction, stealthBroken: false,
    emisAt, emis: 'none', emisT: 0,
    explored: null, mmCanvas: null,
  };
}
function placeAnomalies(list, count, world, solids, start, rng) {
  for (let i = 0; i < count; i++) {
    const ar = 40 + rng() * 16;
    for (let t = 0; t < 80; t++) {
      const x = 70 + ar + rng() * (world.w - 140 - ar * 2);
      const y = 70 + ar + rng() * (world.h - 140 - ar * 2);
      if (dist(x, y, start.x, start.y) < 260) continue;
      const box = { x: x - ar - 45, y: y - ar - 45, w: (ar + 45) * 2, h: (ar + 45) * 2 };
      if (overlapsAny(box, solids, 0)) continue;
      if (list.some(a => dist(x, y, a.x, a.y) < a.r + ar + 60)) continue;
      list.push({
        x, y, r: ar, type: ANOM_TYPES[Math.floor(rng() * ANOM_TYPES.length)],
        reveal: 0, pT: rng() * 2, sndT: rng() * 2, spin: rng() * Math.PI * 2,
      });
      break;
    }
  }
}
function relocateAnomalies() {
  const count = level.anomalies.length;
  const rng = mulberry32((Math.random() * 1e9) | 0);
  level.anomalies.length = 0;
  placeAnomalies(level.anomalies, count, level.world, level.solids, { x: player.x, y: player.y }, rng);
  for (const a of level.anomalies) a.reveal = 3.5;
}

// ===== Raid lifecycle =====
function enterState(s) { state = s; stateTimer = 0; inputLock = 0.22; }
function rollModifier() {
  const r = Math.random();
  nextModifier = r < 0.55 ? 'none' : r < 0.7 ? 'night' : r < 0.85 ? 'pack' : 'fresh';
  const w = Math.random();
  nextWeather = w < 0.5 ? 'clear' : w < 0.75 ? 'fog' : 'rain';
}
function magReserve(type) {
  const w = WEAPONS[type];
  return w.mag * (w.mags + (save.ammoUp[type] || 0));
}
function loadLevel(idx) {
  levelIndex = idx;
  raidModifier = nextModifier;
  raidWeather = nextWeather;
  level = generateLevel(LEVELS[idx], raidModifier);
  player.x = level.playerStart.x;
  player.y = level.playerStart.y;
  player.r = 11;
  player.alive = true;
  player.maxHp = 2 + bodyDef().hp;
  player.hp = player.maxHp;
  player.rad = 0; player.radIn = 0;
  player.stamina = 100;
  player.healT = 0;
  player.facing = 0; player.dashCD = 0; player.dashTime = 0; player.invuln = 0; player.fireCD = 0;
  const wp = save.gear.weapon;
  player.slots = [{ type: wp, mag: WEAPONS[wp].mag, reserve: magReserve(wp) }, null];
  player.active = 0; player.switchCD = 0;
  player.reloadT = 0; player.reloading = false;
  player.bolts = save.gear.bolts; player.boltCD = 0; player.walkT = 0;
  player.flashOn = false;
  player.nvgOn = false;
  player.battery = save.items.battery > 0 ? 100 : 0;
  bullets = []; boltsFlying = []; drops = []; particles = []; decals = []; casings = []; ambientP = [];
  levelStats = { startTime: performance.now(), kills: 0, found: 0 };
  if (!runStats) runStats = { kills: 0, income: 0, levels: 0 };
  detectorTimer = 0.3;
  shake = 0;
  initExplored();
  camera.x = player.x - W / 2; camera.y = player.y - H / 2;
  clampCamera();
  startHum();
  startWind();
  setWindLevel(raidWeather === 'clear' ? 0.02 : 0.045);
  enterState('intro');
}
function restartLevel() {
  if (player.carry.length) player.carry = [];
  loadLevel(levelIndex);
}
function journalDeath(reason) {
  const L = level ? level.name : '';
  const causes = {
    shot: ['Пуля мародёра нашла меня', 'Стервятники сработали чисто', 'Не заметил стрелка за укрытием'],
    mutant: ['Хрипуны догнали', 'Стая взяла в кольцо', 'Услышал рык слишком поздно'],
    anomaly_fry: ['Жарка сожгла в двух шагах от тропы', 'Пожалел болт — сгорел'],
    anomaly_vortex: ['Воронка затянула', 'Шагнул не туда — воронка'],
    anomaly_arc: ['Разряд. Даже не понял, откуда', 'Статикой пахло не зря'],
    anomaly_acid: ['Кислота. Думал — лужа как лужа', 'Прошёл по «луже»'],
    emission: ['Не добежал до укрытия. Выброс', 'Выброс накрыл в чистом поле'],
    boss: ['Горбач размазал по бетону', 'Арена осталась за Горбачом'],
    radiation: ['Сгорел изнутри. Дозиметр молчал, потому что сломан', 'Набрал дозу. Антирада не хватило'],
  };
  const arr = causes[reason] || causes.shot;
  const lost = player.carry.reduce((s, a) => s + a.value, 0);
  let line = 'День ' + save.day + '. ' + L + '. ' + arr[Math.floor(Math.random() * arr.length)] + '.';
  if (lost > 0) line += ' Хабар на ' + lost + '₽ остался лежать.';
  addJournal(line);
}
function journalSuccess(income) {
  const bits = [];
  if (income > 0) bits.push('Вынес хабар на ' + income + '₽');
  else bits.push('Ушёл пустым, зато живым');
  if (levelStats.kills === 0 && !level.stealthBroken) bits.push('меня никто не видел');
  else if (levelStats.kills >= 4) bits.push('пришлось стрелять много');
  if (level.emis === 'done') bits.push('пересидел выброс');
  if (level.boss && !level.boss.alive) bits.push('Горбач больше не встанет');
  const lm = level.landmarks.find(l => l.noteRead);
  if (lm) bits.push('видел ' + LANDMARKS[lm.key].name);
  addJournal('День ' + save.day + '. ' + level.name + '. ' + bits.join(', ') + '.');
}
function diePlayer(reason) {
  player.alive = false;
  sndPlayerDeath();
  spawnBlood(player.x, player.y, true);
  stopHum();
  setWindLevel(0.015);
  deathReason = reason;
  journalDeath(reason);
  save.day++;
  persistSave();
  enterState('dead');
}
function damagePlayer(dmg, reason) {
  if (!player.alive || player.invuln > 0) return;
  player.hp -= dmg;
  player.invuln = 0.6;
  player.healT = 0; // a hit interrupts bandaging
  shake += 5;
  spawnBlood(player.x, player.y, false);
  if (player.hp <= 0) diePlayer(reason);
  else sndPlayerHurt();
}
function killPlayer(reason) { damagePlayer(99, reason); } // instant kills (vortex core, emission)
function completeRaid() {
  const income = player.carry.reduce((s, a) => s + a.value, 0);
  save.money += income;
  runStats.income += income;
  runStats.kills += levelStats.kills;
  runStats.levels++;
  if (level.boss && !level.boss.alive) { save.bossKills++; }
  journalSuccess(income);
  save.day++;
  if (save.money > save.bestScore) save.bestScore = save.money;
  persistSave();
  hubToast = income > 0 ? 'ХАБАР СДАН: +' + income + '₽' : 'ВЕРНУЛСЯ ПУСТЫМ';
  player.carry = [];
  stopHum();
  setWindLevel(0.015);
  sndCash();
  if (levelIndex + 1 >= LEVELS.length) {
    enterState('victory');
  } else {
    pendingLevel = levelIndex + 1;
    rollModifier();
    enterState('hub');
    hubTab = 0;
  }
}

// ===== Exploration + minimap =====
const MM_CELL = 64;
function initExplored() {
  const cols = Math.ceil(level.world.w / MM_CELL);
  const rows = Math.ceil(level.world.h / MM_CELL);
  level.explored = { cols, rows, data: new Uint8Array(cols * rows) };
  const mm = document.createElement('canvas');
  mm.width = cols; mm.height = rows;
  level.mmCanvas = mm;
  level.mmCtx = mm.getContext('2d');
}
function cellSolid(cx, cy) {
  const x = cx * MM_CELL + MM_CELL / 2, y = cy * MM_CELL + MM_CELL / 2;
  for (const w of level.walls) {
    if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return true;
  }
  return false;
}
function updateExplored() {
  const ex = level.explored;
  const R = 5;
  const pcx = Math.floor(player.x / MM_CELL), pcy = Math.floor(player.y / MM_CELL);
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      if (dx * dx + dy * dy > R * R) continue;
      const cx = pcx + dx, cy = pcy + dy;
      if (cx < 0 || cy < 0 || cx >= ex.cols || cy >= ex.rows) continue;
      const i = cy * ex.cols + cx;
      if (!ex.data[i]) {
        ex.data[i] = 1;
        level.mmCtx.fillStyle = cellSolid(cx, cy) ? '#4a4d40' : '#2c3322';
        level.mmCtx.fillRect(cx, cy, 1, 1);
      }
    }
  }
}
// noise events — rain muffles them (stealth weather)
function noiseEvent(x, y, radius) {
  radius *= WEATHERS[raidWeather].noise;
  for (const u of level.mutants) {
    if (!u.alive || u.state === 'chase') continue;
    if (dist(u.x, u.y, x, y) < radius) {
      u.state = 'investigate';
      u.goalX = x + (Math.random() - 0.5) * 80;
      u.goalY = y + (Math.random() - 0.5) * 80;
    }
  }
  for (const m of level.marauders) {
    if (!m.alive || m.state === 'alert') continue;
    const d = dist(m.x, m.y, x, y);
    if (d < 250) { m.state = 'alert'; m.targetKind = 'player'; m.lastKnownX = x; m.lastKnownY = y; m.searchTimer = 4; startAim(m, 0.1); }
    else if (d < radius * 0.7 && m.state === 'patrol') { m.state = 'investigate'; m.goalX = x; m.goalY = y; m.susT = 4; }
  }
  if (level.boss && level.boss.alive && dist(level.boss.x, level.boss.y, x, y) < radius) {
    level.boss.aware = true;
  }
}

// ===== Combat =====
function playerConcealed() {
  for (const b of level.bushes) {
    if (dist(player.x, player.y, b.x, b.y) < b.r) return true;
  }
  return false;
}
function playerInBuilding() {
  for (const b of level.buildings) {
    if (player.x > b.x && player.x < b.x + b.w && player.y > b.y && player.y < b.y + b.h) return b;
  }
  for (const L of level.landmarks) {
    if (L.isShelter && player.x > L.x && player.x < L.x + L.w && player.y > L.y && player.y < L.y + L.h) return L;
  }
  return null;
}
function nearestAliveEnemyWithin(x, y, radius) {
  let best = null, bestD = radius;
  for (const m of level.marauders) {
    if (m.alive) { const d = dist(x, y, m.x, m.y); if (d < bestD) { bestD = d; best = m; } }
  }
  for (const u of level.mutants) {
    if (u.alive) { const d = dist(x, y, u.x, u.y); if (d < bestD) { bestD = d; best = u; } }
  }
  if (level.boss && level.boss.alive) {
    const d = dist(x, y, level.boss.x, level.boss.y);
    if (d < bestD) { bestD = d; best = level.boss; }
  }
  return best;
}
function alertNearby(x, y, radius) {
  if (!level) return;
  level.stealthBroken = true;
  for (const m of level.marauders) {
    if (m.alive && dist(m.x, m.y, x, y) < radius) {
      if (m.state === 'patrol') startAim(m, 0.15);
      m.state = 'alert'; m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 3.5;
    }
  }
  for (const u of level.mutants) {
    if (u.alive && dist(u.x, u.y, x, y) < radius) u.state = 'chase';
  }
}
function squadShare(m) {
  for (const o of level.marauders) {
    if (o !== m && o.alive && o.squad === m.squad && dist(o.x, o.y, m.x, m.y) < 700) {
      if (o.state !== 'alert') { startAim(o, 0.25); o.state = 'alert'; }
      o.lastKnownX = m.lastKnownX; o.lastKnownY = m.lastKnownY; o.searchTimer = Math.max(o.searchTimer, 3);
    }
  }
}
function dropWeapon(m) {
  drops.push({ x: m.x + (Math.random() - 0.5) * 10, y: m.y + (Math.random() - 0.5) * 10, type: m.weapon, ammo: 2 + Math.floor(Math.random() * 3), cd: 0 });
}
function killMarauder(m, byPlayer) {
  m.alive = false;
  if (byPlayer) levelStats.kills++;
  spawnBlood(m.x, m.y, false);
  dropWeapon(m);
  sndEnemyDeath();
}
function killMutant(u, byPlayer) {
  u.alive = false;
  if (byPlayer) levelStats.kills++;
  spawnBlood(u.x, u.y, true);
  sndEnemyDeath();
}
function damageMarauder(m, dmg, hx, hy, byPlayer) {
  m.hp -= dmg;
  spawnSpark(hx, hy);
  spawnBlood(m.x, m.y, false);
  if (m.hp <= 0) { killMarauder(m, byPlayer); return; }
  m.staggerT = 0.45;
  m.aimT = Math.max(m.aimT, 0.35);
  m.burst = 0;
  if (byPlayer) {
    m.state = 'alert'; m.targetKind = 'player';
    m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 4;
    squadShare(m);
  }
}
function damageMutant(u, dmg, hx, hy, byPlayer) {
  u.hp -= dmg;
  spawnSpark(hx, hy);
  spawnBlood(u.x, u.y, false);
  if (u.hp <= 0) { killMutant(u, byPlayer); return; }
  u.staggerT = 0.25;
  u.state = 'chase';
  sndMutantHurt();
}
function damageBoss(b, dmg, hx, hy) {
  b.hp -= dmg;
  spawnSpark(hx, hy);
  spawnBlood(b.x, b.y, false);
  sndMutantHurt();
  if (b.hp <= 0 && b.alive) {
    b.alive = false;
    levelStats.kills++;
    spawnBlood(b.x, b.y, true);
    spawnBlood(b.x + 20, b.y - 10, true);
    sndRoar(0);
    shake += 10;
    const t = ART_TYPES[5];
    level.artifacts.push({ x: b.x, y: b.y, type: t.id, name: t.name, value: t.value, radPerSec: t.rad, buff: t.buff, taken: false });
  }
}
function meleeKill(target) {
  if (target === level.boss) { damageBoss(target, 2, target.x, target.y); sndMelee(); return; }
  if (target === level.npc) { hitNpc(); return; }
  target.alive = false;
  levelStats.kills++;
  spawnBlood(target.x, target.y, target.r > 11);
  if (target.weapon) dropWeapon(target);
  sndMelee();
}
function firePlayerBullets() {
  const w = WEAPONS[activeWeapon()];
  for (let i = 0; i < w.pellets; i++) {
    const a = player.facing + (Math.random() - 0.5) * 2 * w.spread + (w.pellets > 1 ? (i - (w.pellets - 1) / 2) * (w.spread / w.pellets) : 0);
    bullets.push({
      x: player.x + Math.cos(player.facing) * 16, y: player.y + Math.sin(player.facing) * 16,
      vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
      owner: 'player', life: w.life, alive: true,
    });
  }
  const wt = activeWeapon();
  if (wt === 'sawnoff' || wt === 'shotgun') { sndShotgun(); shake += 5; }
  else if (wt === 'smg') { sndSmg(); shake += 1.6; }
  else { sndShot(); shake += 2.4; }
  alertNearby(player.x, player.y, 460);
  noiseEvent(player.x, player.y, 950);
  spawnMuzzleFlash(player.x, player.y, player.facing);
  spawnCasing(player.x, player.y, player.facing);
}
function fireEnemyBullet(m, angle, d) {
  const spread = 0.03 + clamp(d / 460, 0, 1) * 0.22;
  const w = m.weapon;
  const pellets = w === 'sawnoff' ? 3 : 1;
  const life = w === 'sawnoff' ? 0.45 : 1.0;
  for (let i = 0; i < pellets; i++) {
    const a = angle + (Math.random() - 0.5) * 2 * spread + (pellets > 1 ? (i - 1) * 0.14 : 0);
    bullets.push({
      x: m.x + Math.cos(a) * 14, y: m.y + Math.sin(a) * 14,
      vx: Math.cos(a) * 520, vy: Math.sin(a) * 520,
      owner: 'enemy', life, alive: true,
    });
  }
  m.mag--;
  sndEnemyShot(dist(m.x, m.y, player.x, player.y));
  noiseEvent(m.x, m.y, 950);
  spawnCasing(m.x, m.y, angle);
  if (dist(m.x, m.y, player.x, player.y) < 400) shake += 1;
}
function startReload() {
  const s = activeSlot();
  const w = WEAPONS[s.type];
  if (player.reloading || s.mag >= w.mag || s.reserve <= 0) return;
  player.reloading = true;
  player.reloadT = w.reload;
  sndReload();
}
function updateReload(dt) {
  if (!player.reloading) return;
  player.reloadT -= dt;
  if (player.reloadT <= 0) {
    const s = activeSlot();
    const w = WEAPONS[s.type];
    if (w.perShell) {
      // shotgun: shell by shell — fire to interrupt
      const take = Math.min(1, s.reserve);
      s.mag += take; s.reserve -= take;
      sndReload();
      if (s.mag < w.mag && s.reserve > 0) { player.reloadT = w.reload; return; }
    } else {
      const need = w.mag - s.mag;
      const take = Math.min(need, s.reserve);
      s.mag += take; s.reserve -= take;
    }
    player.reloading = false;
    sndReloadDone();
  }
}
function tryAttack() {
  if (!player.alive || player.fireCD > 0 || player.switchCD > 0) return;
  const target = nearestAliveEnemyWithin(player.x, player.y, MELEE_RANGE);
  if (target) {
    meleeKill(target);
    player.fireCD = 0.32;
    spawnMeleeSlash(player.x, player.y, player.facing);
    return;
  }
  const s = activeSlot();
  if (player.reloading) {
    if (WEAPONS[s.type].perShell && s.mag > 0) { player.reloading = false; } // interrupt shell loading to fire
    else return;
  }
  if (s.mag <= 0) {
    sndDryFire(); player.fireCD = 0.3;
    if (s.reserve > 0) startReload();
    return;
  }
  s.mag--;
  firePlayerBullets();
  player.fireCD = WEAPONS[s.type].cd;
}
function tryDash() {
  if (!player.alive || player.dashCD > 0 || player.stamina < 25) return;
  player.stamina -= 25;
  player.dashAngle = player.isMoving ? player.lastMoveAngle : player.facing;
  player.dashTime = 0.16;
  player.dashCD = 1.1;
  player.invuln = 0.22;
  sndDash();
  spawnDashTrail(player.x, player.y);
}
function throwBolt() {
  if (!player.alive || player.bolts <= 0 || player.boltCD > 0) return;
  player.bolts--;
  player.boltCD = 0.4;
  boltsFlying.push({
    x: player.x + Math.cos(player.facing) * 14, y: player.y + Math.sin(player.facing) * 14,
    vx: Math.cos(player.facing) * 520, vy: Math.sin(player.facing) * 520,
    life: 0.48, spin: Math.random() * Math.PI,
  });

}
function switchWeapon() {
  if (!player.alive || !player.slots[1] || player.switchCD > 0) return;
  player.active = 1 - player.active;
  player.switchCD = 0.5;
  player.reloading = false;

}
function toggleLamp() {
  if (headDef().nvg && player.battery > 0) {

// smart med button: antirad when glowing, medkit when bleeding
function useMed() {

  if (player.rad > 45 && save.items.antirad > 0) {

function triggerAnomaly(a) {

// ===== Loot & pickups =====
let hudMsg = '', hudMsgT = 0;
function hudFlash(s, long) { hudMsg = s; hudMsgT = long ? 3.4 : 1.6; }

function checkArtifactPickups() {
  for (const a of level.artifacts) {
    if (a.taken) continue;
    if (dist(player.x, player.y, a.x, a.y) < player.r + 18) {
      a.taken = true;

function checkLootPickups() {

  }
  for (const L of level.landmarks) {
    if (!L.noteRead && dist(player.x, player.y, L.x + L.w / 2, L.y + L.h / 2) < Math.max(L.w, L.h) * 0.7) {
      L.noteRead = true;
      hudFlash(LANDMARKS[L.key].note, true);
    }

}
function checkWeaponPickups(dt) {
  for (const d of drops) {
    if (d.cd > 0) { d.cd -= dt; continue; }
    if (dist(player.x, player.y, d.x, d.y) < player.r + 12) {
      const w = WEAPONS[d.type];
      const sameSlot = player.slots.findIndex(s => s && s.type === d.type);
      if (sameSlot >= 0) {
        player.slots[sameSlot].reserve += d.ammo + Math.floor(w.mag / 2);
        d.dead = true;
      } else if (!player.slots[1]) {
        player.slots[1] = { type: d.type, mag: Math.min(w.mag, d.ammo), reserve: w.mag };
        d.dead = true;
      } else {
        const old = player.slots[player.active];
        player.slots[player.active] = { type: d.type, mag: Math.min(w.mag, d.ammo), reserve: w.mag };
        d.type = old.type; d.ammo = old.mag; d.cd = 1.6;
      }
      player.switchCD = 0.5;
      player.reloading = false;
      sndGunPickup();

function npcTradeAvailable() {
  return level.npc && level.npc.alive && !level.npc.traded && player.carry.length > 0 &&
    dist(player.x, player.y, level.npc.x, level.npc.y) < 70;
}
function doNpcTrade() {
  if (!npcTradeAvailable()) return;
  let mi = 0;
  for (let i = 1; i < player.carry.length; i++) if (player.carry[i].value < player.carry[mi].value) mi = i;
  const art = player.carry.splice(mi, 1)[0];

  player.bolts = Math.min(save.boltCap + 2, player.bolts + 3);

}
function hitNpc() {
  const n = level.npc;
  n.hp--;
  spawnBlood(n.x, n.y, false);
  if (n.hp <= 0 && n.alive) {
    n.alive = false;
    levelStats.kills++;
    drops.push({ x: n.x, y: n.y, type: 'pistol', ammo: 4, cd: 0 });
    addJournal('День ' + save.day + '. Убил нейтрала у костра. Зона запомнит.');
    sndEnemyDeath();

}
function checkExtraction() {
  const ex = level.extraction;
  if (player.x > ex.x && player.x < ex.x + ex.w && player.y > ex.y && player.y < ex.y + ex.h) {
    enterState('exit');
    tone(500, 0.6, 'sine', 0.12, 950);

// detector tiers: 1 beeps, 2 adds direction, 3 adds radar + tone per type
const ART_TONE = { ember: 900, tear: 1250, blob: 700, needle: 1500, frost: 1800, heart: 550 };
function nearestArtifact() {
  let best = null, bestD = Infinity;
  for (const a of level.artifacts) {
    if (a.taken) continue;
    const d = dist(player.x, player.y, a.x, a.y);
    if (d < bestD) { bestD = d; best = a; }
  }
  return { a: best, d: bestD };
}
function detectorRange() {
  let r = DETECTOR_RANGE;
  if (player.carry.some(c => c.buff === 'detector')) r *= 1.2;
  return r;
}
function updateDetectorSound(dt) {
  if (!level) return;
  const { a, d } = nearestArtifact();
  if (!a) return;
  detectorTimer -= dt;
  if (detectorTimer <= 0) {
    const t = clamp(1 - (d - 30) / detectorRange(), 0, 1);
    if (t <= 0) { detectorTimer = 1.4; return; }
    const baseFreq = save.detectorT >= 3 ? ART_TONE[a.type] || 900 : lerp(480, 1500, t);
    sndBeep(save.detectorT >= 3 ? baseFreq * (0.7 + 0.5 * t) : baseFreq);
    detectorTimer = lerp(1.4, 0.12, t);
  }
}

// ===== Camera =====
function screenToWorld(sx, sy) { return { x: sx + camera.x, y: sy + camera.y }; }
function clampCamera() {
  const w = level.world.w, h = level.world.h;
  if (w <= W) camera.x = (w - W) / 2; else camera.x = clamp(camera.x, 0, w - W);
  if (h <= H) camera.y = (h - H) / 2; else camera.y = clamp(camera.y, 0, h - H);
}
function updateCamera(dt) {
  const lead = 85;
  const tx = player.x + Math.cos(player.facing) * lead - W / 2;
  const ty = player.y + Math.sin(player.facing) * lead - H / 2;
  const k = 1 - Math.exp(-5 * dt);
  camera.x += (tx - camera.x) * k;
  camera.y += (ty - camera.y) * k;
  clampCamera();
}
function nearCamera(e, margin) {
  return e.x > camera.x - margin && e.x < camera.x + W + margin && e.y > camera.y - margin && e.y < camera.y + H + margin;
}
function aiMargin() { return Math.max(W, H) * 0.75; }

// ===== Player update: movement, sprint, stamina, radiation =====
function playerSpeedMult() {
  let m = bodyDef().speed;
  if (player.carry.some(c => c.buff === 'speed')) m *= 1.06;
  return m;
}
function updatePlayerMovement(dt) {
  let mx = 0, my = 0;
  if (usingTouch) {
    mx = joy.dx; my = joy.dy;
  } else {
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    const len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }
  }
  const deflect = Math.hypot(mx, my);
  const moving = deflect > 0.05;
  // sprint: Shift on desktop, full-stick deflection on touch
  const wantSprint = moving && (usingTouch ? deflect > 0.93 : (keys['ShiftLeft'] || keys['ShiftRight']));
  player.isSprinting = wantSprint && player.stamina > 8 && !player.reloading;
  const spd = (player.isSprinting ? player.sprintSpeed : player.walkSpeed) * playerSpeedMult();
  player.isMoving = moving;
  if (moving) {
    player.lastMoveAngle = Math.atan2(my, mx);
    player.walkT += spd * dt;
  }
  if (player.dashTime > 0) {
    player.dashTime -= dt;
    player.x += Math.cos(player.dashAngle) * player.dashSpeed * dt;
    player.y += Math.sin(player.dashAngle) * player.dashSpeed * dt;
  } else {
    player.x += mx * spd * dt;
    player.y += my * spd * dt;
  }
  resolveWalls(player, level.solids);
  clampToWorld(player, level.world);
  // stamina
  let regen = 14;
  if (player.carry.some(c => c.buff === 'stamina')) regen += 5;
  if (player.isSprinting) player.stamina -= 18 * dt;
  else player.stamina = Math.min(100, player.stamina + regen * dt);
  player.stamina = Math.max(0, player.stamina);
  // radiation: anomaly proximity + carried artifacts, filtered by mask & container
  let radIn = 0;
  for (const a of level.anomalies) {
    const d = dist(player.x, player.y, a.x, a.y) - a.r;
    if (d < 120) radIn += clamp(1 - d / 120, 0, 1) * 6;
  }
  const contMult = CONTAINERS[save.containerT].radMult;
  for (const c of player.carry) radIn += c.radPerSec * contMult;
  for (const L of level.landmarks) {
    if (L.radZone && dist(player.x, player.y, L.radZone.x, L.radZone.y) < L.radZone.r) radIn += 8;
  }
  radIn *= headDef().rad;
  player.radIn = radIn;
  if (radIn > 0) player.rad = Math.min(100, player.rad + radIn * dt);
  else player.rad = Math.max(0, player.rad - 1.2 * dt); // clean air slowly clears it
  if (player.rad >= 100) {
    player.radT = (player.radT || 0) + dt;
    if (player.radT > 2) { player.radT = 0; player.hp--; sndPlayerHurt(); shake += 3; if (player.hp <= 0) diePlayer('radiation'); }
  }
  // bandaging over time
  if (player.healT > 0) {
    player.healT -= dt;
    if (player.healT <= 0 && player.hp < player.maxHp) { player.hp = Math.min(player.maxHp, player.hp + 2); sndHeal(); hudFlash('ПЕРЕВЯЗАН'); }
  }
  // NVG battery
  if (player.nvgOn) {
    player.battery -= 3.2 * dt;
    if (player.battery <= 0) { player.battery = 0; player.nvgOn = false; hudFlash('ПНВ: БАТАРЕЯ СЕЛА'); }
  }
  if (player.dashCD > 0) player.dashCD -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.fireCD > 0) player.fireCD -= dt;
  if (player.boltCD > 0) player.boltCD -= dt;
  if (player.switchCD > 0) player.switchCD -= dt;
  updateReload(dt);
  if (usingTouch) {
    const target = nearestAliveEnemyWithin(player.x, player.y, AUTOAIM_RANGE);
    if (target) player.facing = Math.atan2(target.y - player.y, target.x - player.x);
    else if (moving) player.facing = player.lastMoveAngle;
  } else {
    const wp = screenToWorld(mouse.x, mouse.y);
    player.facing = Math.atan2(wp.y - player.y, wp.x - player.x);
  }
}
function updatePlayerActions() {
  if (inputLock > 0) return;
  const attackHeld = usingTouch ? btnAttack.active : mouse.down;
  if (attackHeld) tryAttack();
}

// ===== Marauder AI: patrol → suspicious → investigate → alert =====
function startAim(m, extra) { m.aimT = 0.3 + Math.random() * 0.2 + (extra || 0); }
function visionRange() {
  let r = raidModifier === 'night' ? 220 : 300;
  r *= WEATHERS[raidWeather].vis;
  return r;
}
function playerVisibilityFactor(d) {
  // how fast a watcher fills his detect meter looking at the player
  let f = d < 120 ? 2.4 : d < 220 ? 1.1 : 0.55;
  if (playerConcealed()) f *= 0.35;
  if (raidModifier === 'night') f *= player.flashOn || player.nvgOn ? 1.5 : 0.55;
  if (raidWeather === 'fog') f *= 0.7;
  if (player.isSprinting) f *= 1.4;
  return f;
}
function canSeePlayer(x, y, facing, range, halfAngle) {
  if (!player.alive) return false;
  let eff = playerConcealed() ? Math.min(range, 70) : range;
  if ((player.flashOn || player.nvgOn) && raidModifier === 'night') eff *= 1.35; // your light betrays you
  const d = dist(x, y, player.x, player.y);
  if (d > eff) return false;
  const ang = Math.atan2(player.y - y, player.x - x);
  let diff = ang - facing;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  if (Math.abs(diff) > halfAngle) return false;
  return hasLineOfSight(x, y, player.x, player.y, level.solids);
}
function nearestVisibleMutant(m) {
  let best = null, bestD = 300;
  for (const u of level.mutants) {
    if (!u.alive) continue;
    const d = dist(m.x, m.y, u.x, u.y);
    if (d < bestD && hasLineOfSight(m.x, m.y, u.x, u.y, level.solids)) { bestD = d; best = u; }
  }
  if (level.boss && level.boss.alive) {
    const d = dist(m.x, m.y, level.boss.x, level.boss.y);
    if (d < bestD && hasLineOfSight(m.x, m.y, level.boss.x, level.boss.y, level.solids)) { best = level.boss; }
  }
  if (m.bittenBy && m.bittenBy.alive && dist(m.x, m.y, m.bittenBy.x, m.bittenBy.y) < 340) best = m.bittenBy;
  return best;
}
function marauderFire(m, tx, ty, target) {
  if (m.mag <= 0) {
    if (m.reloadT <= 0) { m.reloadT = 1.6 + Math.random() * 0.6; sndReload(); }
    return;
  }
  const dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  if (m.weapon === 'rifle') {
    if (m.fireCD <= 0 && m.burst <= 0) { m.burst = Math.min(3, m.mag); m.burstT = 0; m.burstTarget = target || null; m.fireCD = 1.9 + Math.random() * 0.4; }
  } else if (m.weapon === 'smg') {
    if (m.fireCD <= 0 && m.burst <= 0) { m.burst = Math.min(4, m.mag); m.burstT = 0; m.burstTarget = target || null; m.fireCD = 1.6 + Math.random() * 0.5; }
  } else if (m.weapon === 'sawnoff') {
    if (d < 280 && m.fireCD <= 0) { fireEnemyBullet(m, ang, d); m.fireCD = 1.7 + Math.random() * 0.4; }
  } else {
    if (m.fireCD <= 0) { fireEnemyBullet(m, ang, d); m.fireCD = 1.2 + Math.random() * 0.4; }
  }
}
function marauderMove(m, ang, mult, dt) {
  m.x += Math.cos(ang) * 70 * dt * mult;
  m.y += Math.sin(ang) * 70 * dt * mult;
  m.walkT += 70 * dt * mult;
  m.moved = true;
  resolveWalls(m, level.solids); clampToWorld(m, level.world);
}
function goAlert(m) {
  m.state = 'alert'; m.targetKind = 'player'; m.searchTimer = 4;
  m.lastKnownX = player.x; m.lastKnownY = player.y;
  startAim(m, 0.1);
  alertNearby(m.x, m.y, 340);
  squadShare(m);
  sndAlert();
}
function updateMarauder(m, dt) {
  if (!m.alive) return;
  m.moved = false;
  if (m.fireCD > 0) m.fireCD -= dt;
  if (m.reloadT > 0) {
    m.reloadT -= dt;
    if (m.reloadT <= 0) { m.mag = WEAPONS[m.weapon].mag; }
  }
  if (m.staggerT > 0) { m.staggerT -= dt; return; }
  if (m.aimT > 0) m.aimT -= dt;
  if (m.burst > 0 && m.reloadT <= 0) {
    m.burstT -= dt;
    if (m.burstT <= 0) {
      if (m.mag <= 0) { m.burst = 0; }
      else {
        const t = (m.burstTarget && m.burstTarget.alive) ? m.burstTarget : player;
        fireEnemyBullet(m, Math.atan2(t.y - m.y, t.x - m.x), dist(m.x, m.y, t.x, t.y));
        m.burst--; m.burstT = 0.09;
      }
    }
  }
  // mutants override everything — fast reaction, back away, shoot
  const mut = nearestVisibleMutant(m);
  if (mut) {
    if (m.targetKind !== 'mutant') { m.aimT = 0.12 + Math.random() * 0.1; m.targetKind = 'mutant'; }
    m.mutTarget = mut;
    const dx = mut.x - m.x, dy = mut.y - m.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    m.facing = ang;
    if (d < 140) marauderMove(m, ang + Math.PI, 0.85, dt);
    if (m.aimT <= 0) marauderFire(m, mut.x, mut.y, mut);
    return;
  }
  if (m.targetKind === 'mutant') m.targetKind = m.state === 'patrol' ? 'none' : 'player';

  if (m.state === 'patrol') {
    m.patrolT += dt;
    if (m.mode === 'route' && m.waypoints.length > 1) {
      const wp = m.waypoints[m.wpIdx];
      const d = dist(m.x, m.y, wp.x, wp.y);
      if (d < 34) m.wpIdx = (m.wpIdx + 1) % m.waypoints.length;
      else {
        const ang = Math.atan2(wp.y - m.y, wp.x - m.x);
        m.facing = ang + Math.sin(m.patrolT * 1.7) * 0.25;
        marauderMove(m, ang, 0.45, dt);
      }
    } else {
      m.facing = m.baseFacing + Math.sin(m.patrolT * 0.5) * 0.8;
    }
    // gradual detection: seeing the player builds suspicion before alarm
    if (canSeePlayer(m.x, m.y, m.facing, visionRange(), 0.62)) {
      const d = dist(m.x, m.y, player.x, player.y);
      m.suspicion += dt * playerVisibilityFactor(d);
      if (d < 90) m.suspicion = 1; // point blank — no grace
      if (m.suspicion >= 1) { m.suspicion = 0; goAlert(m); return; }
      if (m.suspicion >= 0.4 && m.state === 'patrol') {
        m.state = 'suspicious'; m.susT = 1.4;
        m.goalX = player.x; m.goalY = player.y;
        sndSuspicion();
      }
    } else {
      m.suspicion = Math.max(0, m.suspicion - dt * 0.35);
    }
    return;
  }
  if (m.state === 'suspicious') {
    // stop, stare at what moved
    m.facing = Math.atan2(m.goalY - m.y, m.goalX - m.x);
    m.susT -= dt;
    if (canSeePlayer(m.x, m.y, m.facing, visionRange(), 0.7)) {
      const d = dist(m.x, m.y, player.x, player.y);
      m.suspicion += dt * playerVisibilityFactor(d) * 1.3;
      m.goalX = player.x; m.goalY = player.y;
      if (m.suspicion >= 1) { m.suspicion = 0; goAlert(m); return; }
    }
    if (m.susT <= 0) { m.state = 'investigate'; m.susT = 5; }
    return;
  }
  if (m.state === 'investigate') {
    // walk to the noise / glimpse point, look around, go back to rounds
    m.susT -= dt;
    const d = dist(m.x, m.y, m.goalX, m.goalY);
    if (d > 40) {
      const ang = Math.atan2(m.goalY - m.y, m.goalX - m.x);
      m.facing = ang;
      marauderMove(m, ang, 0.55, dt);
    } else {
      m.facing += dt * 1.4; // scanning
    }
    if (canSeePlayer(m.x, m.y, m.facing, visionRange(), 0.62)) {
      const dd = dist(m.x, m.y, player.x, player.y);
      m.suspicion += dt * playerVisibilityFactor(dd) * 1.5;
      if (m.suspicion >= 0.6) { m.suspicion = 0; goAlert(m); return; }
    }
    if (m.susT <= 0) { m.state = 'patrol'; m.suspicion = 0; m.patrolT = 0; m.baseFacing = m.facing; }
    return;
  }
  // alert
  const dx = player.x - m.x, dy = player.y - m.y;
  const d = Math.hypot(dx, dy);
  const targetAngle = Math.atan2(dy, dx);
  const seeRange = playerConcealed() ? 70 : visionRange() + 160;
  const canSee = player.alive && d < seeRange && hasLineOfSight(m.x, m.y, player.x, player.y, level.solids);
  if (canSee) {
    if (m.targetKind !== 'player') { startAim(m, 0); m.targetKind = 'player'; }
    m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 4;
    m.facing = targetAngle;
    const desired = m.weapon === 'sawnoff' ? 150 : 230;
    if (d > desired) marauderMove(m, targetAngle, 0.6, dt);
    else if (d < desired * 0.55) marauderMove(m, targetAngle + Math.PI, 0.5, dt);
    if (m.aimT <= 0) marauderFire(m, player.x, player.y, null);
  } else {
    m.searchTimer -= dt;
    const ang = Math.atan2(m.lastKnownY - m.y, m.lastKnownX - m.x);
    const dd = dist(m.x, m.y, m.lastKnownX, m.lastKnownY);
    if (dd > 20) {
      m.facing = ang;
      marauderMove(m, ang, 0.5, dt);
    }
    if (m.searchTimer <= 0) { m.state = 'patrol'; m.targetKind = 'none'; m.suspicion = 0; m.patrolT = 0; m.baseFacing = m.facing; }
  }
}

// ===== Mutant AI =====
function mutantCandidates() {
  const list = [];
  if (player.alive) list.push({ e: player, isPlayer: true });
  for (const m of level.marauders) if (m.alive) list.push({ e: m, isPlayer: false });
  if (level.npc && level.npc.alive) list.push({ e: level.npc, isPlayer: false, isNpc: true });
  return list;
}
function packAggro(u) {
  for (const o of level.mutants) {
    if (o !== u && o.alive && o.pack === u.pack && dist(o.x, o.y, u.x, u.y) < 380 && o.state !== 'chase') o.state = 'chase';
  }
}
function updateMutant(u, dt) {
  if (!u.alive) return;
  if (u.staggerT > 0) { u.staggerT -= dt; return; }
  u.meleeCD -= dt;
  u.growlT -= dt;
  if (u.growlT <= 0) {
    u.growlT = 3 + Math.random() * 4;
    const d = dist(u.x, u.y, player.x, player.y);
    if (d < 700) sndGrowl(d);
  }
  if (u.state === 'investigate') {
    const d = dist(u.x, u.y, u.goalX, u.goalY);
    const ang = Math.atan2(u.goalY - u.y, u.goalX - u.x);
    u.facing = ang;
    u.x += Math.cos(ang) * 120 * dt;
    u.y += Math.sin(ang) * 120 * dt;
    u.walkT += 120 * dt;
    resolveWalls(u, level.solids); clampToWorld(u, level.world);
    if (d < 50) { u.state = 'wander'; u.wanderCX = u.x; u.wanderCY = u.y; }
  }
  if (u.state === 'wander') {
    u.wanderT -= dt;
    if (u.wanderT <= 0) {
      u.wanderT = 1.5 + Math.random() * 2;
      const distFromHome = dist(u.x, u.y, u.wanderCX, u.wanderCY);
      if (distFromHome > 170) u.wanderAngle = Math.atan2(u.wanderCY - u.y, u.wanderCX - u.x) + (Math.random() - 0.5) * 0.6;
      else u.wanderAngle = Math.random() * Math.PI * 2;
    }
    u.facing = u.wanderAngle;
    u.x += Math.cos(u.wanderAngle) * 32 * dt;
    u.y += Math.sin(u.wanderAngle) * 32 * dt;
    u.walkT += 32 * dt;
    resolveWalls(u, level.solids); clampToWorld(u, level.world);
    for (const c of mutantCandidates()) {
      const detectR = c.isPlayer && playerConcealed() ? 80 : 230;
      if (dist(u.x, u.y, c.e.x, c.e.y) < detectR && hasLineOfSight(u.x, u.y, c.e.x, c.e.y, level.solids)) {
        u.state = 'chase';
        packAggro(u);
        break;
      }
    }
  } else if (u.state === 'chase') {
    let best = null, bestD = 520, bestC = null;
    for (const c of mutantCandidates()) {
      const d = dist(u.x, u.y, c.e.x, c.e.y);
      if (d < bestD) { bestD = d; best = c.e; bestC = c; }
    }
    if (!best) { u.state = 'wander'; u.wanderCX = u.x; u.wanderCY = u.y; return; }
    const dx = best.x - u.x, dy = best.y - u.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    u.facing = ang;
    if (d > u.r + best.r + 4) {
      u.x += Math.cos(ang) * 155 * dt;
      u.y += Math.sin(ang) * 155 * dt;
      u.walkT += 155 * dt;
      resolveWalls(u, level.solids); clampToWorld(u, level.world);
    }
    if (d < u.r + best.r + 8 && u.meleeCD <= 0) {
      u.meleeCD = 0.7;
      if (bestC.isPlayer) {
        damagePlayer(1, 'mutant');
      } else if (bestC.isNpc) {
        hitNpc();
      } else {
        best.hp -= 1;
        best.bittenBy = u;
        best.staggerT = 0.4;
        spawnBlood(best.x, best.y, false);
        sndMelee();
        if (best.hp <= 0) killMarauder(best, false);
      }
    }
  }
}

// ===== Boss =====
function updateBoss(b, dt) {
  if (!b.alive) return;
  b.t -= dt;
  const dx = player.x - b.x, dy = player.y - b.y;
  const d = Math.hypot(dx, dy);
  if (b.state === 'idle') {
    b.facing = Math.atan2(dy, dx);
    if (player.alive && (d < 620 || b.aware) && hasLineOfSight(b.x, b.y, player.x, player.y, level.solids)) {
      b.state = 'telegraph'; b.t = 0.8;
      sndRoar(d); shake += 4;
    } else if (b.aware && d < 1100) {
      b.x += Math.cos(Math.atan2(dy, dx)) * 70 * dt;
      b.y += Math.sin(Math.atan2(dy, dx)) * 70 * dt;
      b.walkT += 70 * dt;
      resolveWalls(b, level.solids); clampToWorld(b, level.world);
    }
  } else if (b.state === 'telegraph') {
    b.facing = Math.atan2(dy, dx);
    if (b.t <= 0) { b.state = 'charge'; b.chargeDir = b.facing; b.t = 1.6; }
  } else if (b.state === 'charge') {
    const ox = b.x, oy = b.y;
    b.x += Math.cos(b.chargeDir) * 520 * dt;
    b.y += Math.sin(b.chargeDir) * 520 * dt;
    b.walkT += 520 * dt;
    const hitWall = resolveWalls(b, level.solids);
    clampToWorld(b, level.world);
    if (player.alive && player.invuln <= 0 && dist(b.x, b.y, player.x, player.y) < b.r + player.r + 2) {
      damagePlayer(2, 'boss');
    }
    if (hitWall || (Math.hypot(b.x - ox, b.y - oy) < 100 * dt) || b.t <= 0) {
      b.state = 'stunned'; b.t = 1.5;
      shake += 8;
      noiseBurst(0.3, 0.4, 900);
    }
  } else if (b.state === 'stunned') {
    if (b.t <= 0) b.state = 'idle';
  }
}

// ===== Bullets & bolts =====
function updateBullet(b, dt) {
  const steps = 2;
  for (let s = 0; s < steps && b.alive; s++) {
    b.x += b.vx * dt / steps;
    b.y += b.vy * dt / steps;
    for (const w of level.solids) {
      if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) { b.alive = false; spawnSpark(b.x, b.y); return; }
    }
    if (b.owner === 'enemy') {
      if (player.alive && player.invuln <= 0 && dist(b.x, b.y, player.x, player.y) < player.r + 3) {
        b.alive = false; damagePlayer(1, 'shot'); return;
      }
      for (const u of level.mutants) {
        if (u.alive && dist(b.x, b.y, u.x, u.y) < u.r + 3) { b.alive = false; damageMutant(u, 1, b.x, b.y, false); return; }
      }
      if (level.boss && level.boss.alive && dist(b.x, b.y, level.boss.x, level.boss.y) < level.boss.r + 3) {
        b.alive = false; level.boss.hp -= 1; spawnSpark(b.x, b.y); if (level.boss.hp <= 0) damageBoss(level.boss, 0, b.x, b.y); return;
      }
    } else {
      for (const m of level.marauders) {
        if (m.alive && dist(b.x, b.y, m.x, m.y) < m.r + 3) { b.alive = false; damageMarauder(m, 1, b.x, b.y, true); return; }
      }
      for (const u of level.mutants) {
        if (u.alive && dist(b.x, b.y, u.x, u.y) < u.r + 3) { b.alive = false; damageMutant(u, 1, b.x, b.y, true); return; }
      }
      if (level.boss && level.boss.alive && dist(b.x, b.y, level.boss.x, level.boss.y) < level.boss.r + 3) {
        b.alive = false; damageBoss(level.boss, 1, b.x, b.y); return;
      }
      if (level.npc && level.npc.alive && dist(b.x, b.y, level.npc.x, level.npc.y) < level.npc.r + 3) {
        b.alive = false; hitNpc(); return;
      }
    }
  }
  b.life -= dt;
  if (b.life <= 0) b.alive = false;
}
function updateBullets(dt) {
  for (const b of bullets) if (b.alive) updateBullet(b, dt);
  bullets = bullets.filter(b => b.alive);
}
function updateBolts(dt) {
  for (const bo of boltsFlying) {
    bo.x += bo.vx * dt;
    bo.y += bo.vy * dt;
    bo.spin += 12 * dt;
    bo.life -= dt;
    for (const a of level.anomalies) {
      if (dist(bo.x, bo.y, a.x, a.y) < a.r + 6) { triggerAnomaly(a); bo.life = 0; break; }
    }
    if (bo.life <= 0) { sndBoltLand(); spawnParticles(bo.x, bo.y, 2, '#c0c0b0', 60, 0.3, 2); }
  }
  boltsFlying = boltsFlying.filter(b => b.life > 0);
}

// ===== Anomalies =====
function updateAnomalies(dt) {
  for (const a of level.anomalies) {
    if (a.reveal > 0) a.reveal -= dt;
    a.spin += dt * (a.type === 'vortex' ? 2.2 : 0.4);
    if (a.type === 'vortex') {
      const pullR = a.r * 2.4;
      const pull = e => {
        const d = dist(e.x, e.y, a.x, a.y);
        if (d < pullR && d > 1) {
          const f = (1 - d / pullR) * 150 * dt;
          e.x += (a.x - e.x) / d * f;
          e.y += (a.y - e.y) / d * f;
        }
      };
      if (player.alive && player.invuln <= 0 && player.dashTime <= 0) pull(player);
      for (const m of level.marauders) if (m.alive && nearCamera(m, 600)) pull(m);
      for (const u of level.mutants) if (u.alive && nearCamera(u, 600)) pull(u);
    }
    const pd = dist(player.x, player.y, a.x, a.y);
    a.sndT -= dt;
    if (pd < 340 && a.sndT <= 0) {
      const prox = 1 - pd / 340;
      if (a.type === 'fry') { noiseBurst(0.04, 0.04 + 0.08 * prox, 1200); a.sndT = 0.5 + Math.random() * 1.6; }
      else if (a.type === 'arc') { tone(1800 + Math.random() * 900, 0.02, 'square', 0.02 + 0.05 * prox); a.sndT = 0.8 + Math.random() * 2; }
      else if (a.type === 'acid') { noiseBurst(0.1, 0.015 + 0.05 * prox, 500); a.sndT = 0.7 + Math.random() * 1.5; }
      else a.sndT = 1;
    }
    a.pT -= dt;
    if (a.pT <= 0 && nearCamera(a, 300)) {
      a.pT = a.reveal > 0 ? 0.1 : 1.2 + Math.random() * 1.6;
      if (particles.length < 350) {
        const ang = Math.random() * Math.PI * 2;
        const rr = Math.random() * a.r * 0.7;
        const col = a.type === 'fry' ? 'rgba(255,150,60,0.6)' : a.type === 'acid' ? 'rgba(184,232,58,0.5)' : 'rgba(180,255,140,0.5)';
        particles.push({ x: a.x + Math.cos(ang) * rr, y: a.y + Math.sin(ang) * rr, vx: 0, vy: a.type === 'fry' ? -30 : -14, life: 1.1, maxLife: 1.1, color: col, size: 2 });
      }
    }
  }
}
function anomalyHitPlayer(a) {
  triggerAnomaly(a);
  if (a.type === 'vortex') {
    // the core shreds; the rim you can still fight out of
    if (dist(player.x, player.y, a.x, a.y) < a.r * 0.45) { killPlayer('anomaly_vortex'); return; }
    damagePlayer(1, 'anomaly_vortex');
  } else {
    damagePlayer(2, 'anomaly_' + a.type);
  }
  if (!player.alive) return;
  player.rad = Math.min(100, player.rad + 20);
  // knockback out of the field
  const ang = Math.atan2(player.y - a.y, player.x - a.x);
  player.x = a.x + Math.cos(ang) * (a.r + player.r + 12);
  player.y = a.y + Math.sin(ang) * (a.r + player.r + 12);
  player.invuln = Math.max(player.invuln, 0.8);
}
function checkAnomalyCollisions() {
  for (const a of level.anomalies) {
    if (player.alive && player.invuln <= 0 && dist(player.x, player.y, a.x, a.y) < a.r) {
      anomalyHitPlayer(a);
      if (!player.alive) return;
    }
  }
  for (const m of level.marauders) {
    if (!m.alive || !nearCamera(m, 600)) continue;
    for (const a of level.anomalies) {
      if (dist(m.x, m.y, a.x, a.y) < a.r) { m.alive = false; spawnAnomalyDeath(m.x, m.y); dropWeapon(m); triggerAnomaly(a); break; }
    }
  }
  for (const u of level.mutants) {
    if (!u.alive || !nearCamera(u, 600)) continue;
    for (const a of level.anomalies) {
      if (dist(u.x, u.y, a.x, a.y) < a.r) { u.alive = false; spawnAnomalyDeath(u.x, u.y); triggerAnomaly(a); break; }
    }
  }
  if (level.boss && level.boss.alive) {
    const b = level.boss;
    for (const a of level.anomalies) {
      if (dist(b.x, b.y, a.x, a.y) < a.r + b.r * 0.4) {
        triggerAnomaly(a);
        damageBoss(b, 6, b.x, b.y);
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        b.x = a.x + Math.cos(ang) * (a.r + b.r + 14);
        b.y = a.y + Math.sin(ang) * (a.r + b.r + 14);
        b.state = 'stunned'; b.t = 1.8;
        shake += 8;
        break;
      }
    }
  }
}

// ===== Emission =====
function updateEmission(dt) {
  if (level.emisAt < 0 || level.emis === 'done') return;
  const elapsed = (performance.now() - levelStats.startTime) / 1000;
  if (level.emis === 'none') {
    if (elapsed >= level.emisAt) {
      level.emis = 'warning';
      level.emisT = 25;
      level.sirenT = 0;
      sndSiren();
      hudFlash('ВЫБРОС! В УКРЫТИЕ!');
    }
    return;
  }
  if (level.emis === 'warning') {
    level.emisT -= dt;
    level.sirenT -= dt;
    if (level.sirenT <= 0) { level.sirenT = 2.2; sndSiren(); }
    if (level.emisT <= 5 && level.emisT + dt > 5) tone(900, 0.3, 'square', 0.15);
    if (level.emisT <= 0) {
      level.emis = 'done';
      sndBlast();
      shake += 14;
      if (!playerInBuilding()) {
        killPlayer('emission');
      } else {
        relocateAnomalies();
        hudFlash('ВЫБРОС ПРОШЁЛ. АНОМАЛИИ СМЕСТИЛИСЬ');
      }
    }
  }
}

// ===== Steps audible beyond sight =====
let ambT = 0;
function updateAmbientSound(dt) {
  ambT -= dt;
  if (ambT > 0) return;
  ambT = 0.34;
  for (const m of level.marauders) {
    if (m.alive && m.moved) {
      const d = dist(m.x, m.y, player.x, player.y);
      if (d < 420 && Math.random() < 0.6) { sndStep(d); break; }
    }

}

// ===== Particles, casings, blood, ambient drift =====
function spawnParticles(x, y, count, color, speed, life, size) {
  if (particles.length > 350) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, maxLife: life, color, size });
  }
}
function spawnSpark(x, y) { spawnParticles(x, y, 4, '#ffe9a8', 180, 0.25, 2); }
function spawnMuzzleFlash(x, y, facing) {
  particles.push({ x: x + Math.cos(facing) * 18, y: y + Math.sin(facing) * 18, vx: 0, vy: 0, life: 0.06, maxLife: 0.06, color: '#fff6d0', size: 9 });
}
function spawnMeleeSlash(x, y, facing) { spawnParticles(x + Math.cos(facing) * 20, y + Math.sin(facing) * 20, 6, '#ffffff', 120, 0.15, 2); }
function spawnDashTrail(x, y) { spawnParticles(x, y, 8, getPlayerLook().jacket, 60, 0.3, 3); }
function spawnAnomalyDeath(x, y) { spawnParticles(x, y, 14, PAL.anomaly, 220, 0.5, 3); }
function spawnPickupParticles(x, y) { spawnParticles(x, y, 16, PAL.artifact, 150, 0.6, 3); }
function spawnCasing(x, y, facing) {
  const side = facing + Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  casings.push({
    x, y,
    vx: Math.cos(side) * (60 + Math.random() * 60),
    vy: Math.sin(side) * (60 + Math.random() * 60),
    spin: Math.random() * Math.PI, vspin: 8 + Math.random() * 8,
    life: 0.45,
  });
}
function updateCasings(dt) {
  for (const c of casings) {
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.vx *= 0.86; c.vy *= 0.86;
    c.spin += c.vspin * dt;
    c.life -= dt;
    if (c.life <= 0) {
      decals.push({ x: c.x, y: c.y, casing: true, spin: c.spin });
      if (decals.length > 300) decals.shift();
    }
  }
  casings = casings.filter(c => c.life > 0);
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}
// ash / spores / rain drifting across the visible screen — the world breathes
function updateAmbientParticles(dt) {
  const target = raidWeather === 'rain' ? 70 : 26;
  while (ambientP.length < target) {
    ambientP.push({
      x: camera.x + Math.random() * W,
      y: camera.y + Math.random() * H,
      drift: 6 + Math.random() * 16,
      ph: Math.random() * Math.PI * 2,
    });
  }
  if (ambientP.length > target) ambientP.length = target;
  for (const p of ambientP) {
    if (raidWeather === 'rain') {
      p.x += 60 * dt; p.y += 340 * dt;
    } else {
      p.ph += dt;
      p.x += Math.sin(p.ph * 0.6) * 10 * dt + 6 * dt;
      p.y += p.drift * dt;
    }
    if (p.x > camera.x + W + 8) p.x = camera.x - 8;
    if (p.x < camera.x - 8) p.x = camera.x + W + 8;
    if (p.y > camera.y + H + 8) { p.y = camera.y - 8; p.x = camera.x + Math.random() * W; }
  }
}
function spawnBlood(x, y, big) {
  const n = big ? 7 : 4;
  const splats = [];
  for (let i = 0; i < n; i++) {
    splats.push({ dx: (Math.random() - 0.5) * (big ? 36 : 20), dy: (Math.random() - 0.5) * (big ? 36 : 20), rr: (big ? 6 : 3) + Math.random() * (big ? 10 : 6) });
  }
  decals.push({ x, y, splats, color: Math.random() < 0.5 ? PAL.blood : PAL.bloodDark });
  if (decals.length > 300) decals.shift();
}

// ===== Main update =====
function updatePlaying(dt) {
  updatePlayerMovement(dt);
  if (!player.alive) return;
  updatePlayerActions();
  if (!player.alive) return;
  const margin = aiMargin();
  for (const m of level.marauders) {
    if (!m.alive) continue;
    if (nearCamera(m, margin)) updateMarauder(m, dt);
    else { if (m.fireCD > 0) m.fireCD -= dt; if (m.staggerT > 0) m.staggerT -= dt; if (m.reloadT > 0) { m.reloadT -= dt; if (m.reloadT <= 0) m.mag = WEAPONS[m.weapon].mag; } }
  }
  if (!player.alive) return;
  for (const u of level.mutants) {
    if (!u.alive) continue;
    if (nearCamera(u, margin) || u.state === 'investigate') updateMutant(u, dt);
    else { if (u.staggerT > 0) u.staggerT -= dt; u.meleeCD -= dt; }
  }
  if (!player.alive) return;
  if (level.boss) updateBoss(level.boss, dt);
  if (!player.alive) return;
  updateBullets(dt);
  if (!player.alive) return;
  updateBolts(dt);
  updateParticles(dt);
  updateCasings(dt);
  updateAmbientParticles(dt);
  updateAnomalies(dt);
  checkAnomalyCollisions();
  if (!player.alive) return;
  updateEmission(dt);
  if (!player.alive) return;
  checkArtifactPickups();
  checkLootPickups();
  checkWeaponPickups(dt);
  checkExtraction();
  if (state !== 'playing') return;
  updateDetectorSound(dt);
  updateAmbientSound(dt);
  ambientSoundscape(dt);
  updateHum();
  updateExplored();
  updateCamera(dt);
}
function update(dt) {
  shake *= Math.exp(-6 * dt);
  if (hudMsgT > 0) hudMsgT -= dt;
  if (state === 'intro') {
    stateTimer += dt;
    if (stateTimer > 1.8) enterState('playing');
  } else if (state === 'playing') {
    updatePlaying(dt);
  } else if (state === 'exit') {
    stateTimer += dt;
    const cx = level.extraction.x + level.extraction.w / 2;
    const cy = level.extraction.y + level.extraction.h / 2;
    player.x = lerp(player.x, cx, dt * 3);
    player.y = lerp(player.y, cy, dt * 3);
    player.facing = 0;
    player.walkT += 110 * dt;
    player.isMoving = true;
    updateParticles(dt);
    if (stateTimer >= 0.9) completeRaid();
  }
}

// ===== Artifact sprites — every type is its own creature =====
function drawArtifactSprite(type, x, y, t, alpha, scale) {
  const s = scale || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  if (type === 'ember') {
    // ember stone: dark rock, breathing orange cracks
    const br = 0.5 + 0.5 * Math.sin(t * 2.4);
    ctx.fillStyle = '#2c2420';
    ctx.beginPath(); ctx.arc(0, 0, 9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,50,' + (0.5 + 0.5 * br) + ')';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(-6 * s, -2 * s); ctx.lineTo(0, 1 * s); ctx.lineTo(5 * s, -3 * s);
    ctx.moveTo(-3 * s, 5 * s); ctx.lineTo(1 * s, 2 * s);
    ctx.stroke();
  } else if (type === 'tear') {
    // droplet crystal, cold cyan
    const bob = Math.sin(t * 3) * 2;
    ctx.translate(0, bob);
    ctx.fillStyle = P.cyan;
    ctx.beginPath();
    ctx.moveTo(0, -10 * s);
    ctx.quadraticCurveTo(7 * s, 2 * s, 0, 9 * s);
    ctx.quadraticCurveTo(-7 * s, 2 * s, 0, -10 * s);
    ctx.fill();
    ctx.fillStyle = '#e8fff8';
    ctx.fillRect(-1 * s, -4 * s, 2 * s, 5 * s);
  } else if (type === 'blob') {
    // plasma jelly, wobbling
    const w1 = 1 + 0.15 * Math.sin(t * 5), w2 = 1 + 0.15 * Math.cos(t * 4.2);
    ctx.fillStyle = 'rgba(143,239,122,0.75)';
    ctx.beginPath(); ctx.ellipse(0, 0, 9 * s * w1, 8 * s * w2, t * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(230,255,210,0.8)';
    ctx.beginPath(); ctx.arc(-2 * s, -2 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'needle') {
    // levitating shard cluster
    ctx.rotate(t * 1.4);
    ctx.fillStyle = '#d0d8e0';
    for (let i = 0; i < 3; i++) {
      ctx.rotate(Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.moveTo(0, -11 * s); ctx.lineTo(2.4 * s, -2 * s); ctx.lineTo(-2.4 * s, -2 * s);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = P.cyan;
    ctx.beginPath(); ctx.arc(0, 0, 2.6 * s, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'frost') {
    // frost crystal: pale six-ray star
    ctx.rotate(t * 0.5);
    ctx.strokeStyle = '#cfe8ff';
    ctx.lineWidth = 2 * s;
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -9 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -6 * s); ctx.lineTo(2.4 * s, -8 * s); ctx.stroke();
    }
    ctx.fillStyle = '#eef8ff';
    ctx.beginPath(); ctx.arc(0, 0, 2.4 * s, 0, Math.PI * 2); ctx.fill();
  } else {
    // heart of the Perimeter: pulsing dark orb with veins
    const pump = 1 + 0.12 * Math.pow(Math.max(0, Math.sin(t * 3.4)), 3);
    ctx.fillStyle = '#3d1420';
    ctx.beginPath(); ctx.arc(0, 0, 10 * s * pump, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,84,58,0.9)';
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    ctx.moveTo(-7 * s, 0); ctx.quadraticCurveTo(0, -6 * s, 7 * s, -1 * s);
    ctx.moveTo(-5 * s, 5 * s); ctx.quadraticCurveTo(2 * s, 2 * s, 6 * s, 5 * s);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,90,' + (0.3 + 0.4 * (pump - 1) * 8) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 4 * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ===== World =====
function drawFloor() {
  const th = level.theme;
  const tile = 64;
  const x0 = Math.floor(camera.x / tile) * tile, y0 = Math.floor(camera.y / tile) * tile;
  ctx.fillStyle = th.floor1;
  ctx.fillRect(camera.x, camera.y, W, H);
  ctx.fillStyle = th.floor2;
  for (let y = y0; y < camera.y + H; y += tile) {
    for (let x = x0; x < camera.x + W; x += tile) {
      if (((x / tile + y / tile) | 0) % 2 === 0) ctx.fillRect(x, y, tile, tile);
    }
  }
  ctx.fillStyle = th.decor;
  for (const r of level.decor) {
    if (r.x > camera.x - 80 && r.x < camera.x + W + 80 && r.y > camera.y - 40 && r.y < camera.y + H + 40) ctx.fillRect(r.x, r.y, r.w, r.h);
  }
}
function drawGrass() {
  ctx.strokeStyle = level.theme.grass;
  ctx.lineWidth = 1.6;
  for (const g of level.grass) {
    if (!nearCamera(g, 60)) continue;
    const sway = Math.sin(animT * 1.6 + g.seed) * 2.4;
    ctx.beginPath();
    for (let i = 0; i < g.n; i++) {
      const bx = g.x + (hash1(g.seed + i * 7) - 0.5) * 22;
      const by = g.y + (hash1(g.seed + i * 13) - 0.5) * 14;
      const h = 6 + hash1(g.seed + i) * 6;
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + sway * 0.5, by - h * 0.6, bx + sway, by - h);
    }
    ctx.stroke();
  }
}

  for (const w of level.walls) {
    if (w.x + w.w < camera.x - 40 || w.x > camera.x + W + 40 || w.y + w.h < camera.y - 40 || w.y > camera.y + H + 40) continue;

function drawLandmarks() {

  }

function drawAcidPuddle(a, bright) {
  ctx.fillStyle = bright ? 'rgba(150,200,40,0.5)' : 'rgba(50,62,30,0.55)';
  ctx.beginPath();
  ctx.ellipse(a.x, a.y, a.r * 0.95, a.r * 0.7, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(a.x - a.r * 0.4, a.y + a.r * 0.3, a.r * 0.45, a.r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

function drawAnomalies() {
  for (let i = 0; i < level.anomalies.length; i++) {
    const a = level.anomalies[i];
    if (!nearCamera(a, 200)) continue;
    const tSeed = Math.floor(animT * 7);
    if (a.type === 'acid') drawAcidPuddle(a, false);
    if (a.reveal > 0) {
      const k = clamp(a.reveal / 2.6, 0, 1);
      const pulse = 0.7 + 0.3 * Math.sin(animT * 14);
      if (a.type === 'fry') {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.4);
        grad.addColorStop(0, 'rgba(255,200,120,' + (0.6 * k * pulse) + ')');
        grad.addColorStop(0.5, 'rgba(255,120,40,' + (0.32 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(255,90,30,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,140,' + 0.7 * k + ')';
        for (let j = 0; j < 5; j++) {
          const fx = a.x + (hash1(i * 9 + j * 23 + tSeed) - 0.5) * a.r * 1.4;
          const fy = a.y + (hash1(i * 17 + j * 31 + tSeed) - 0.5) * a.r * 1.2 - hash1(j + tSeed) * 12;
          ctx.fillRect(fx, fy, 3, 5);
        }
      } else if (a.type === 'vortex') {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.6);
        grad.addColorStop(0, 'rgba(20,30,24,' + 0.7 * k + ')');
        grad.addColorStop(0.6, 'rgba(143,239,122,' + (0.2 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(143,239,122,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(200,255,190,' + 0.8 * k + ')';
        ctx.lineWidth = 2;
        for (let j = 0; j < 3; j++) {
          const a0 = a.spin * 3 + j * (Math.PI * 2 / 3);
          ctx.beginPath();
          ctx.arc(a.x, a.y, a.r * (0.35 + j * 0.28), a0, a0 + 2.2);
          ctx.stroke();
        }
      } else if (a.type === 'acid') {
        drawAcidPuddle(a, true);
        ctx.strokeStyle = 'rgba(220,255,120,' + 0.8 * k + ')';
        for (let j = 0; j < 4; j++) {
          const bx = a.x + (hash1(i * 11 + j * 37 + tSeed) - 0.5) * a.r * 1.2;
          const by = a.y + (hash1(i * 29 + j * 13 + tSeed) - 0.5) * a.r * 0.9;
          ctx.beginPath(); ctx.arc(bx, by, 2 + hash1(j * 7 + tSeed) * 3, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.5);
        grad.addColorStop(0, 'rgba(216,255,192,' + (0.5 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(143,239,122,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = PAL.anomalyCore;
        ctx.globalAlpha = k * 0.9;
        ctx.lineWidth = 2;
        for (let j = 0; j < 3; j++) {
          const a0 = hash1(i * 7 + j * 13 + Math.floor(animT * 10)) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          for (let s = 1; s <= 3; s++) {
            const rr = (a.r * s) / 3;
            const wob = (hash1(i * 31 + j * 17 + s + Math.floor(animT * 12)) - 0.5) * 22;
            ctx.lineTo(a.x + Math.cos(a0) * rr + wob, a.y + Math.sin(a0) * rr + wob * 0.6);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    } else {
      const ringCol = a.type === 'fry' ? 'rgba(255,180,120,0.06)' : 'rgba(200,255,190,0.055)';
      ctx.strokeStyle = ringCol;
      ctx.lineWidth = 1.5;
      const wob = Math.sin(animT * 2.2 + i * 2) * 2;
      if (a.type === 'vortex') {
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 0.6 + wob, a.spin, a.spin + 2); ctx.stroke();
      } else if (a.type !== 'acid') {
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 0.8 + wob, 0.4 + i, 2.2 + i); ctx.stroke();
      }
      for (let k = 0; k < 3; k++) {
        if (hash1(i * 51 + k * 29 + tSeed) > (a.type === 'arc' ? 0.15 : 0.35)) continue;
        const px = a.x + (hash1(i * 77 + k * 41 + tSeed) - 0.5) * a.r * 1.4;
        const py = a.y + (hash1(i * 13 + k * 61 + tSeed) - 0.5) * a.r * 1.4;
        ctx.fillStyle = a.type === 'fry' ? 'rgba(255,170,90,0.35)' : a.type === 'arc' ? 'rgba(240,255,240,0.5)' : 'rgba(200,255,190,0.3)';
        ctx.fillRect(px, py, 2, 2);
      }
    }
  }
}
function drawArtifacts() {
  for (const a of level.artifacts) {

    const vis = clamp(1 - (d - 26) / (ART_REVEAL_DIST - 26), 0, 1);

function drawPlayer() {

function drawBullets() {

// ===== Dusk + warm/cold light layer — the mood of the whole game =====
function drawLightsAndDusk() {
  // additive warm glows for fires and lamps, cold for anomalies
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of level.lights) {
    if (!nearCamera(l, l.r + 60)) continue;
    const fl = l.flicker ? 0.75 + 0.25 * Math.sin(animT * 9 + l.x) * Math.sin(animT * 4.7 + l.y) : 1;
    const g = ctx.createRadialGradient(l.x, l.y, 2, l.x, l.y, l.r * fl);
    g.addColorStop(0, 'rgba(232,164,64,0.32)');
    g.addColorStop(1, 'rgba(232,140,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r * fl, 0, Math.PI * 2); ctx.fill();
  }
  for (const a of level.anomalies) {
    if (!nearCamera(a, 200) || (a.reveal <= 0 && a.type !== 'vortex')) continue;
    const k = a.reveal > 0 ? clamp(a.reveal / 2.6, 0, 1) : 0.12;
    const g = ctx.createRadialGradient(a.x, a.y, 2, a.x, a.y, a.r * 1.3);
    g.addColorStop(0, 'rgba(120,220,190,' + 0.2 * k + ')');
    g.addColorStop(1, 'rgba(120,220,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
// ===== Fog of war (+dusk tint) =====
function drawFog() {
  const S = FOG_S;
  const th = raidModifier === 'night';
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
  fctx.fillStyle = th ? 'rgba(3,5,4,0.94)' : raidWeather === 'fog' ? 'rgba(14,17,12,0.9)' : 'rgba(6,9,5,0.87)';
  fctx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
  fctx.globalCompositeOperation = 'destination-out';
  const px = (player.x - camera.x) * S, py = (player.y - camera.y) * S;
  const vis = WEATHERS[raidWeather].vis;
  let near = (th ? 105 : 150) * vis * S;
  let len = (th ? 340 : 560) * vis * S;
  const fov = headDef().fov;
  let half = 0.6 * fov;
  if (player.nvgOn) { near *= 1.5; len = Math.max(len, 500 * S); half = 0.66; }
  else if (player.flashOn && th) { len *= 1.5; half *= 0.8; }
  let g = fctx.createRadialGradient(px, py, 0, px, py, near);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.75, 'rgba(0,0,0,0.9)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.arc(px, py, near, 0, Math.PI * 2); fctx.fill();
  g = fctx.createRadialGradient(px, py, near * 0.5, px, py, len);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.85)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = g;
  fctx.beginPath();
  fctx.moveTo(px, py);
  fctx.arc(px, py, len, player.facing - half, player.facing + half);
  fctx.closePath();
  fctx.fill();
  // warm campfire light punches through the dark
  fctx.globalCompositeOperation = 'destination-out';
  for (const l of level.lights) {
    if (!nearCamera(l, l.r + 60)) continue;
    const lx = (l.x - camera.x) * S, ly = (l.y - camera.y) * S;
    const gg = fctx.createRadialGradient(lx, ly, 1, lx, ly, l.r * 0.9 * S);
    gg.addColorStop(0, 'rgba(0,0,0,0.85)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    fctx.fillStyle = gg;
    fctx.beginPath(); fctx.arc(lx, ly, l.r * 0.9 * S, 0, Math.PI * 2); fctx.fill();
  }
  ctx.drawImage(fogCanvas, 0, 0, W, H);
  // NVG green wash
  if (player.nvgOn) {
    ctx.fillStyle = 'rgba(80,200,90,0.12)';
    ctx.fillRect(0, 0, W, H);
  }
}
// ===== Minimap =====
function drawMinimap() {
  const mmW = Math.min(150, W * 0.24);
  const scale = mmW / level.explored.cols;
  const mmH = level.explored.rows * scale;
  const mx = W - mmW - 12 - (usingTouch && W > H ? 152 : 0), my = usingTouch && W > H ? 12 : 52;
  ctx.save();
  ctx.globalAlpha = 0.85;
  drawPanel(mx - 4, my - 4, mmW + 8, mmH + 8);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(level.mmCanvas, mx, my, mmW, mmH);
  const exx = mx + (level.extraction.x + 50) / level.world.w * mmW;
  const exy = my + (level.extraction.y + 50) / level.world.h * mmH;
  ctx.fillStyle = PAL.extract;
  ctx.fillRect(exx - 2, exy - 2, 4, 4);
  const pxm = mx + player.x / level.world.w * mmW;
  const pym = my + player.y / level.world.h * mmH;
  ctx.fillStyle = '#e8f8d0';
  ctx.beginPath(); ctx.arc(pxm, pym, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// military-instrument style panel: dark fill, double border, notched corners
function drawPanel(x, y, w, h) {

  ctx.fillStyle = '#5c6444';
  ctx.fillRect(x, y, 3, 3); ctx.fillRect(x + w - 3, y, 3, 3);

function drawWorld() {
  ctx.save();

// ===== HUD =====
function formatTime(s) {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
}
function drawBar(x, y, w, h, t, col) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x, y, w, h);

  ctx.fillRect(x + 1, y + 1, (w - 2) * clamp(t, 0, 1), h - 2);
  ctx.strokeStyle = '#4a5138';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

    if (y > L.go.y - 28 && y < L.go.y - 2) {
