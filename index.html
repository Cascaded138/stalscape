      sndBeep(600);
    }
  }
}
function startRaid() {
  ensureAudio();
  if (!music.on) { genSong(); music.on = true; }
  else if (pendingLevel === 0) genSong();
  hubToast = '';
  loadLevel(pendingLevel);
}
// ===== Overlays =====
function drawIntroOverlay() {
  const alpha = stateTimer < 1.4 ? 0.72 : Math.max(0, 0.72 * (1 - (stateTimer - 1.4) / 0.4));
  ctx.fillStyle = 'rgba(5,8,4,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
  if (alpha <= 0.02) return;
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.hudDim;
  ctx.font = '13px monospace';
  ctx.fillText('ГЛУБИНА ' + (levelIndex + 1) + ' / ' + LEVELS.length + ' · ДЕНЬ ' + save.day + ' · ' + WEATHERS[raidWeather].name, W / 2, H / 2 - 50);
  ctx.fillStyle = PAL.hudText;
  ctx.font = 'bold 24px monospace';
  ctx.fillText(level.name.toUpperCase(), W / 2, H / 2 - 18);
  if (raidModifier !== 'none') {
    ctx.fillStyle = PAL.danger;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(MODIFIERS[raidModifier].name + ' — ' + MODIFIERS[raidModifier].desc, W / 2, H / 2 + 12);
  }
  if (levelIndex === 4) {
    ctx.fillStyle = PAL.danger;
    ctx.font = '12px monospace';
    ctx.fillText('Здесь живёт Горбач. Аномалии — твоё оружие.', W / 2, H / 2 + 38);
  }
  ctx.textAlign = 'left';
}
function deathReasonText() {
  if (deathReason.startsWith('anomaly')) {
    const t = deathReason.split('_')[1];
    return t === 'fry' ? 'СОЖЖЁН ЖАРКОЙ' : t === 'vortex' ? 'ЗАТЯНУТ ВОРОНКОЙ' : t === 'acid' ? 'РАСТВОРЁН' : 'УБИТ РАЗРЯДОМ';
  }
  if (deathReason === 'mutant') return 'РАСТЕРЗАН';
  if (deathReason === 'emission') return 'НАКРЫЛО ВЫБРОСОМ';
  if (deathReason === 'boss') return 'ГОРБАЧ БЫЛ БЫСТРЕЕ';
  if (deathReason === 'radiation') return 'СГОРЕЛ ОТ ЛУЧЕВОЙ';
  return 'ВЫ МЕРТВЫ';
}
function drawDeadOverlay() {
  ctx.fillStyle = 'rgba(90,10,10,0.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(clamp(W * 0.05, 26, 44)) + 'px monospace';
  ctx.fillText(deathReasonText(), W / 2, H / 2 - 30);
  const lost = player.carry.reduce((s, a) => s + a.value, 0);
  if (lost > 0) {
    ctx.fillStyle = PAL.artifact;
    ctx.font = '14px monospace';
    ctx.fillText('ХАБАР НА ' + lost + '₽ ПОТЕРЯН', W / 2, H / 2 + 2);
  }
  ctx.font = '16px monospace';
  ctx.fillStyle = PAL.hudText;
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ ЭКРАНА' : 'НАЖМИТЕ ЛЮБУЮ КЛАВИШУ', W / 2, H / 2 + 36);
  ctx.textAlign = 'left';
}
function drawVictoryOverlay() {
  ctx.fillStyle = 'rgba(6,14,6,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.artifact;
  ctx.font = 'bold 26px monospace';
  ctx.fillText('ЯДРО ПРОЙДЕНО', W / 2, H / 2 - 76);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '14px monospace';
  ctx.fillText('ЗАРАБОТАНО ЗА ЦИКЛ: ' + runStats.income + '₽', W / 2, H / 2 - 40);
  ctx.fillText('НА СЧЕТУ: ' + save.money + '₽', W / 2, H / 2 - 16);
  ctx.fillStyle = PAL.hudDim;
  ctx.font = '12px monospace';
  ctx.fillText('Зона перезарядится — цикл начнётся заново, всё купленное останется', W / 2, H / 2 + 14);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '15px monospace';
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ, ЧТОБЫ ВЕРНУТЬСЯ В ЛАГЕРЬ' : 'НАЖМИТЕ, ЧТОБЫ ВЕРНУТЬСЯ В ЛАГЕРЬ', W / 2, H / 2 + 50);
  ctx.textAlign = 'left';
}
function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { renderMenu(); drawVignette(); drawGrain(); return; }
  if (state === 'hub') { renderHub(); drawVignette(); drawGrain(); return; }
  if (!level) return;
  drawWorld();
  if (state === 'playing' || state === 'exit' || state === 'intro') drawFog();
  drawVignette();
  drawHUD();
  drawTouchControls();
  if (state === 'intro') drawIntroOverlay();
  if (state === 'exit') {
    const a = clamp(stateTimer / 0.9, 0, 1);
    ctx.fillStyle = 'rgba(200,235,225,' + (a * a) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (state === 'dead') drawDeadOverlay();
  if (state === 'victory') drawVictoryOverlay();
  drawGrain();
}
// ===== Input =====
function handleTapAdvance() {
  if (inputLock > 0) return;
  if (state === 'menu' || state === 'victory') {
    runStats = { kills: 0, income: 0, levels: 0 };
    pendingLevel = 0;
    rollModifier();
    hubTab = 0;
    enterState('hub');
  } else if (state === 'intro') enterState('playing');
  else if (state === 'dead') restartLevel();
}
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  ensureAudio();
  if (state === 'hub') {
    if (hubTab === 0) {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') gearRow = (gearRow + 6) % 7;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') gearRow = (gearRow + 1) % 7;
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') cycleGear(gearRow, -1);
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') cycleGear(gearRow, 1);
    }
    if (e.code === 'Tab') { e.preventDefault(); hubTab = (hubTab + 1) % 3; }
    if (e.code === 'Enter') { e.preventDefault(); if (inputLock <= 0) startRaid(); }
    return;
  }
  if (state === 'playing') {
    if (e.code === 'Space') { e.preventDefault(); tryDash(); }
    else if (e.code === 'KeyR') startReload();
    else if (e.code === 'KeyE') throwBolt();
    else if (e.code === 'KeyF') doNpcTrade();
    else if (e.code === 'KeyQ') switchWeapon();
    else if (e.code === 'KeyC') useMed();
    else if (e.code === 'KeyL') toggleLamp();
    else if (e.code === 'Digit1' || e.code === 'Digit2') {
      const i = e.code === 'Digit1' ? 0 : 1;
      if (player.slots[i] && i !== player.active) switchWeapon();
    }
    else if (e.code === 'Backspace') restartLevel();
    return;
  }
  if (state !== 'exit') handleTapAdvance();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('wheel', e => { if (state === 'playing') switchWeapon(); }, { passive: true });
window.addEventListener('mousedown', e => {
  ensureAudio();
  if (state === 'hub') { hubTap(e.clientX, e.clientY); return; }
  if (state === 'exit') return;
  if (state !== 'playing') { handleTapAdvance(); return; }
  if (e.button === 2) { throwBolt(); return; }
  mouse.down = true; tryAttack();
});
window.addEventListener('mouseup', e => { if (e.button !== 2) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function onTouchStart(e) {
  e.preventDefault();
  usingTouch = true;
  ensureAudio();
  if (state === 'hub') {
    for (const t of e.changedTouches) hubTap(t.clientX, t.clientY);
    return;
  }
  if (state === 'exit') return;
  if (state !== 'playing') { handleTapAdvance(); return; }
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    const jb = getJoyBase();
    if (joy.id === null && dist(x, y, jb.x, jb.y) < 95) {
      joy.id = t.identifier; joy.dx = 0; joy.dy = 0;
      continue;
    }
    const bt = getBtnTrade();
    if (npcTradeAvailable() && btnTrade.id === null && dist(x, y, bt.x, bt.y) < bt.r + 10) {
      btnTrade.id = t.identifier; btnTrade.active = true; doNpcTrade();
      continue;
    }
    const ba = getBtnAttack();
    if (btnAttack.id === null && dist(x, y, ba.x, ba.y) < ba.r + 10) {
      btnAttack.id = t.identifier; btnAttack.active = true; tryAttack();
      continue;
    }
    const bd = getBtnDash();
    if (btnDash.id === null && dist(x, y, bd.x, bd.y) < bd.r + 8) {
      btnDash.id = t.identifier; btnDash.active = true; tryDash();
      continue;
    }
    const bb = getBtnBolt();
    if (btnBolt.id === null && dist(x, y, bb.x, bb.y) < bb.r + 8) {
      btnBolt.id = t.identifier; btnBolt.active = true; throwBolt();
      continue;
    }
    const br = getBtnReload();
    if (btnReload.id === null && dist(x, y, br.x, br.y) < br.r + 8) {
      btnReload.id = t.identifier; btnReload.active = true; startReload();
      continue;
    }
    const bs = getBtnSwap();
    if (player.slots[1] && btnSwap.id === null && dist(x, y, bs.x, bs.y) < bs.r + 8) {
      btnSwap.id = t.identifier; btnSwap.active = true; switchWeapon();
      continue;
    }
    const bl = getBtnLamp();
    if (btnLamp.id === null && dist(x, y, bl.x, bl.y) < bl.r + 6) {
      btnLamp.id = t.identifier; btnLamp.active = true; toggleLamp();
      continue;
    }
    const bm = getBtnMed();
    if (btnMed.id === null && dist(x, y, bm.x, bm.y) < bm.r + 8) {
      btnMed.id = t.identifier; btnMed.active = true; useMed();
      continue;
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      const jb = getJoyBase();
      const dx = t.clientX - jb.x, dy = t.clientY - jb.y;
      const d = Math.hypot(dx, dy);
      const m = Math.min(d, joy.maxR);
      const a = Math.atan2(dy, dx);
      joy.dx = d > 0 ? Math.cos(a) * (m / joy.maxR) : 0;
      joy.dy = d > 0 ? Math.sin(a) * (m / joy.maxR) : 0;
    }
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { joy.id = null; joy.dx = 0; joy.dy = 0; }
    for (const b of [btnAttack, btnDash, btnBolt, btnSwap, btnTrade, btnReload, btnMed, btnLamp]) {
      if (t.identifier === b.id) { b.id = null; b.active = false; }
    }
  }
}
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
// ===== Main loop =====
let lastTs = performance.now();
function tick(ts) {
  requestAnimationFrame(tick);
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  animT += dt;
  if (inputLock > 0) inputLock = Math.max(0, inputLock - dt);
  musicTick();
  update(dt);
  render();
}
requestAnimationFrame(tick);
</script>
</body>
