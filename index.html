// ===== Math helpers =====
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function hash1(n) { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function resolveWalls(e, walls) {
  let hit = false;
  for (const w of walls) {
    const nx = clamp(e.x, w.x, w.x + w.w);
    const ny = clamp(e.y, w.y, w.y + w.h);
    const dx = e.x - nx, dy = e.y - ny;
    const d = Math.hypot(dx, dy);
    if (d < e.r) {
      hit = true;
      if (d === 0) {
        const left = e.x - w.x, right = (w.x + w.w) - e.x, top = e.y - w.y, bottom = (w.y + w.h) - e.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) e.x = w.x - e.r;
        else if (m === right) e.x = w.x + w.w + e.r;
        else if (m === top) e.y = w.y - e.r;
        else e.y = w.y + w.h + e.r;
      } else {
        const push = (e.r - d) / d;
        e.x += dx * push;
        e.y += dy * push;
      }
    }
  }
  return hit;
}
function clampToWorld(e, world) {
  e.x = clamp(e.x, e.r, world.w - e.r);
  e.y = clamp(e.y, e.r, world.h - e.r);
}
function hasLineOfSight(x1, y1, x2, y2, solids) {
  const d = dist(x1, y1, x2, y2);
  const steps = Math.max(1, Math.ceil(d / 18));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = lerp(x1, x2, t), y = lerp(y1, y2, t);
    for (const w of solids) {
      if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return false;
    }
  }
  return true;
}
function overlapsAny(rect, list, pad) {
  for (const o of list) {
    if (rect.x - pad < o.x + o.w && rect.x + rect.w + pad > o.x &&
        rect.y - pad < o.y + o.h && rect.y + rect.h + pad > o.y) return true;
  }
  return false;
}

// ===== Audio =====
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slideTo, when) {
  if (!actx) return;
  const t0 = when || actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gain.gain.setValueAtTime(vol || 0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function noiseBurst(dur, vol, filterFreq, when) {
  if (!actx) return;
  const t0 = when || actx.currentTime;
  const bufferSize = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const src = actx.createBufferSource();
  src.buffer = buffer;
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq || 4000;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(filter).connect(gain).connect(actx.destination);
  src.start(t0);
}

let humOsc = null, humGain = null;
function startHum() {
  stopHum();
  if (!actx) return;
  humOsc = actx.createOscillator();
  humOsc.type = 'sawtooth';
  humOsc.frequency.value = 55;
  humGain = actx.createGain();
  humGain.gain.value = 0;
  humOsc.connect(humGain).connect(actx.destination);
  humOsc.start();
}
function stopHum() {
  if (humOsc) { try { humOsc.stop(); } catch (e) {} try { humOsc.disconnect(); } catch (e) {} humOsc = null; humGain = null; }
}
function updateHum() {
  if (!humGain || !level) return;
  let minD = Infinity;
  for (const a of level.anomalies) {
    if (a.type === 'vortex') minD = Math.min(minD, dist(player.x, player.y, a.x, a.y) - a.r);
  }
  const g = minD === Infinity ? 0 : clamp(1 - minD / 350, 0, 1) * 0.09;
  humGain.gain.setTargetAtTime(g, actx.currentTime, 0.15);
}

// ===== Procedural chiptune soundtrack =====
const music = { on: false, step: 0, nextT: 0, tempo: 0.44, base: 82.4, bass: [], lead: [] };
function genSong() {
  const rng = mulberry32((Math.random() * 1e9) | 0);
  const minor = [0, 2, 3, 5, 7, 8, 10];
  music.base = 73.4 * Math.pow(2, Math.floor(rng() * 4) / 12);
  music.tempo = 0.42 + rng() * 0.14;
  const prog = [0, 0, rng() < 0.5 ? 5 : 3, rng() < 0.5 ? 3 : 8];
  music.bass = []; music.lead = [];
  for (let i = 0; i < 16; i++) {
    const deg = prog[(i / 4) | 0];
    music.bass.push(i % 2 === 0 ? deg : (rng() < 0.3 ? deg + 7 : -1));
    music.lead.push(rng() < 0.22 ? minor[(minor.indexOf(deg % 12) + [0, 2, 4][Math.floor(rng() * 3)] + 7) % 7] + 12 : -1);
  }
  music.step = 0; music.nextT = 0;
}
function noteFreq(semi) { return music.base * Math.pow(2, semi / 12); }
function musicTick() {
  if (!actx || !music.on) return;
  if (music.nextT < actx.currentTime) music.nextT = actx.currentTime + 0.05;
  while (music.nextT < actx.currentTime + 0.3) {
    const s = music.step, t = music.nextT;
    const b = music.bass[s];
    if (b >= 0) tone(noteFreq(b), music.tempo * 0.9, 'square', 0.026, undefined, t);
    const l = music.lead[s];
    if (l >= 0) tone(noteFreq(l) * 2, music.tempo * 1.7, 'triangle', 0.02, noteFreq(l) * 2 * 0.99, t);
    if (s % 8 === 0) tone(55, 0.12, 'sine', 0.05, 30, t);
    if (s % 4 === 2) noiseBurst(0.03, 0.016, 6000, t);
    music.step = (music.step + 1) % 16;
    music.nextT += music.tempo;
  }
}

function generateLevel(def, modifier) {
  const rng = mulberry32((Math.random() * 1e9) | 0);
  const world = { w: def.world.w, h: def.world.h };
  const start = { x: 140, y: world.h / 2 };
  const walls = borderWalls(world.w, world.h, 40);
  // random inner walls give each map its corridors and clearings
  for (let i = 0; i < def.innerWalls; i++) {
    for (let t = 0; t < 40; t++) {
      const horiz = rng() < 0.5;
      const len = 220 + rng() * 420;
      const r = horiz
        ? { x: 200 + rng() * (world.w - 400 - len), y: 160 + rng() * (world.h - 320), w: len, h: 50 }
        : { x: 200 + rng() * (world.w - 400), y: 160 + rng() * (world.h - 320 - len), w: 60, h: len };
      if (dist(r.x + r.w / 2, r.y + r.h / 2, start.x, start.y) < 350) continue;
      if (overlapsAny(r, walls, 130)) continue; // wide gaps: corridors never seal
      walls.push(r);
      break;
    }
  }
  const solids = walls.slice();
  const inner = { x: 70, y: 70, w: world.w - 140, h: world.h - 140 };
  function placeRect(w, h, ok, pad) {
    for (let i = 0; i < 60; i++) {
      const r = { x: inner.x + rng() * (inner.w - w), y: inner.y + rng() * (inner.h - h), w, h };
      if (overlapsAny(r, solids, pad === undefined ? 16 : pad)) continue;
      if (ok && !ok(r)) continue;
      return r;
    }
    return null;
  }
  // buildings: 4 walls with a doorway, roof hides when you step in; emission shelter
  const buildings = [];
  for (let i = 0; i < def.counts.buildings; i++) {
    const bw = 240 + rng() * 100, bh = 190 + rng() * 80;
    const r = placeRect(bw, bh, r => dist(r.x, r.y, start.x, start.y) > 400, 90);
    if (!r) continue;
    const T = 14, door = 74;
    const doorSide = Math.floor(rng() * 4); // 0 S, 1 N, 2 W, 3 E
    const segs = [];
    const dPos = 0.25 + rng() * 0.5;
    if (doorSide === 0) {
      const gx = r.x + (r.w - door) * dPos;
      segs.push({ x: r.x, y: r.y + r.h - T, w: gx - r.x, h: T });
      segs.push({ x: gx + door, y: r.y + r.h - T, w: r.x + r.w - gx - door, h: T });
    } else segs.push({ x: r.x, y: r.y + r.h - T, w: r.w, h: T });
    if (doorSide === 1) {
      const gx = r.x + (r.w - door) * dPos;
      segs.push({ x: r.x, y: r.y, w: gx - r.x, h: T });
      segs.push({ x: gx + door, y: r.y, w: r.x + r.w - gx - door, h: T });
    } else segs.push({ x: r.x, y: r.y, w: r.w, h: T });
    if (doorSide === 2) {
      const gy = r.y + (r.h - door) * dPos;
      segs.push({ x: r.x, y: r.y, w: T, h: gy - r.y });
      segs.push({ x: r.x, y: gy + door, w: T, h: r.y + r.h - gy - door });
    } else segs.push({ x: r.x, y: r.y, w: T, h: r.h });
    if (doorSide === 3) {
      const gy = r.y + (r.h - door) * dPos;
      segs.push({ x: r.x + r.w - T, y: r.y, w: T, h: gy - r.y });
      segs.push({ x: r.x + r.w - T, y: gy + door, w: T, h: r.y + r.h - gy - door });
    } else segs.push({ x: r.x + r.w - T, y: r.y, w: T, h: r.h });
    for (const s of segs) { if (s.w > 0 && s.h > 0) { walls.push(s); solids.push(s); } }
    buildings.push({ x: r.x, y: r.y, w: bw, h: bh });
  }
  // props
  const crates = [], cars = [], trees = [], bushes = [];
  for (let i = 0; i < def.counts.crates; i++) {
    const r = placeRect(CRATE_S, CRATE_S, r => dist(r.x, r.y, start.x, start.y) > 140);
    if (r) { crates.push(r); solids.push(r); }
  }
  for (let i = 0; i < def.counts.cars; i++) {
    const horiz = rng() < 0.5;
    const r = placeRect(horiz ? 76 : 38, horiz ? 38 : 76, r => dist(r.x, r.y, start.x, start.y) > 170);
    if (r) { r.horiz = horiz; cars.push(r); solids.push(r); }
  }
  for (let i = 0; i < def.counts.trees; i++) {
    const r = placeRect(16, 16, r => dist(r.x, r.y, start.x, start.y) > 140);
    if (r) { trees.push(r); solids.push(r); }
  }
  for (let i = 0; i < def.counts.bushes; i++) {
    const r = placeRect(52, 52, null);
    if (r) bushes.push({ x: r.x + 26, y: r.y + 26, r: 24 + rng() * 8 });
  }
  // anomalies (clearance from all solids so corridors stay passable)
  const anomCount = Math.round(def.counts.anomalies * (modifier === 'fresh' ? 2 : 1));
  const anomalies = [];
  placeAnomalies(anomalies, anomCount, world, solids, start, rng);
  const clearOfAnomalies = (x, y, pad) => anomalies.every(a => dist(x, y, a.x, a.y) > a.r + pad);
  function placePoint(minStartDist, pad, extra) {
    for (let t = 0; t < 90; t++) {
      const x = inner.x + 30 + rng() * (inner.w - 60);
      const y = inner.y + 30 + rng() * (inner.h - 60);
      if (dist(x, y, start.x, start.y) < minStartDist) continue;
      if (overlapsAny({ x: x - pad, y: y - pad, w: pad * 2, h: pad * 2 }, solids, 0)) continue;
      if (!clearOfAnomalies(x, y, 30)) continue;
      if (extra && !extra(x, y)) continue;
      return { x, y };
    }
    return { x: world.w - 200, y: world.h / 2 };
  }
  // extraction gate: far side, always deeper in
  const exPos = placePoint(world.w * 0.6, 55, x => x > world.w * 0.66);
  const extraction = {
    x: clamp(exPos.x - 50, 60, world.w - 160),
    y: clamp(exPos.y - 50, 60, world.h - 160),
    w: 100, h: 100,
  };
  // artifacts: several per map — leave with one or push for more
  const artCount = Math.round(def.counts.artifacts * (modifier === 'fresh' ? 2 : 1));
  const diag = Math.hypot(world.w, world.h);
  const artifacts = [];
  for (let i = 0; i < artCount; i++) {
    const p = placePoint(diag * (0.3 + 0.12 * i / Math.max(1, artCount - 1)), 25,
      (x, y) => dist(x, y, extraction.x + 50, extraction.y + 50) > 240 &&
                artifacts.every(a => dist(x, y, a.x, a.y) > 420));
    const tier = ARTIFACTS[def.artTiers[Math.floor(rng() * def.artTiers.length)]];
    artifacts.push({ x: p.x, y: p.y, name: tier.name, value: tier.value, taken: false });
  }
  const hiddenFromStart = (x, y) => !hasLineOfSight(start.x, start.y, x, y, solids) || dist(x, y, start.x, start.y) > 700;
  // marauder squads: shared anchor, patrol waypoints, they cover each other
  const marauders = [];
  let squads = def.squads;
  if (modifier === 'pack') squads = squads.map(s => ({ size: Math.max(1, s.size - 1), weapons: s.weapons }));
  squads.forEach((sq, sqi) => {
    const anchor = placePoint(500, 30, hiddenFromStart);
    const waypoints = [];
    for (let wpi = 0; wpi < 3; wpi++) {
      for (let t = 0; t < 40; t++) {
        const a = rng() * Math.PI * 2, rr = 120 + rng() * 380;
        const wx = clamp(anchor.x + Math.cos(a) * rr, 90, world.w - 90);
        const wy = clamp(anchor.y + Math.sin(a) * rr, 90, world.h - 90);
        if (overlapsAny({ x: wx - 16, y: wy - 16, w: 32, h: 32 }, solids, 0)) continue;
        if (!clearOfAnomalies(wx, wy, 40)) continue;
        waypoints.push({ x: wx, y: wy });
        break;
      }
    }
    if (!waypoints.length) waypoints.push({ x: anchor.x, y: anchor.y });
    for (let i = 0; i < sq.size; i++) {
      const face = rng() * Math.PI * 2;
      marauders.push({
        x: clamp(anchor.x + (rng() - 0.5) * 90, 60, world.w - 60),
        y: clamp(anchor.y + (rng() - 0.5) * 90, 60, world.h - 60),
        r: 11, hp: 2, alive: true,
        facing: face, baseFacing: face, weapon: sq.weapons[i % sq.weapons.length],
        squad: sqi, waypoints, wpIdx: Math.floor(rng() * waypoints.length),
        mode: sqi % 2 === 0 ? 'route' : 'post',
        state: 'patrol', patrolT: rng() * 10,
        fireCD: 0, aimT: 0, staggerT: 0, burst: 0, burstT: 0,
        targetKind: 'none', searchTimer: 0, lastKnownX: anchor.x, lastKnownY: anchor.y,
        walkT: 0, bittenBy: null, mutTarget: null, stepT: rng(),
      });
    }
  });
  // mutant packs: few but tough, roam together, drawn to gunfire
  const mutants = [];
  let packs = def.packs.slice();
  if (modifier === 'pack') packs = packs.concat([3]);
  packs.forEach((size, pi) => {
    const anchor = placePoint(550, 30, hiddenFromStart);
    for (let i = 0; i < size; i++) {
      mutants.push({
        x: clamp(anchor.x + (rng() - 0.5) * 110, 60, world.w - 60),
        y: clamp(anchor.y + (rng() - 0.5) * 110, 60, world.h - 60),
        r: 13, hp: 5, alive: true, facing: 0,
        pack: pi,
        state: 'wander', wanderT: rng() * 2, wanderAngle: rng() * Math.PI * 2,
        wanderCX: anchor.x, wanderCY: anchor.y,
        goalX: 0, goalY: 0,
        meleeCD: 0, staggerT: 0, walkT: 0, growlT: rng() * 4,
      });
    }
  });
  // boss arena
  let boss = null;
  if (def.boss) {
    const p = placePoint(world.w * 0.45, 60, (x) => x > world.w * 0.4 && x < world.w * 0.75);
    boss = {
      x: p.x, y: p.y, r: 26, hp: 34, maxHp: 34, alive: true, facing: 0,
      state: 'idle', t: 0, chargeDir: 0, walkT: 0, roarT: 0,
    };
  }
  // points of interest: dead stalkers with loot
  const corpses = [];
  for (let i = 0; i < def.counts.corpses; i++) {
    const p = placePoint(400, 18, null);
    const roll = rng();
    corpses.push({ x: p.x, y: p.y, looted: false, loot: roll < 0.45 ? 'ammo' : roll < 0.75 ? 'bolts' : 'money' });
  }
  // caches inside buildings
  const caches = [];
  for (const b of buildings) {
    if (rng() < 0.8) caches.push({ x: b.x + 40 + rng() * (b.w - 80), y: b.y + 40 + rng() * (b.h - 80), looted: false, loot: rng() < 0.55 ? 'ammo' : 'bolts' });
  }
  // a neutral stalker at his campfire — trade an artifact for supplies
  let npc = null;
  if (!def.boss && rng() < 0.45) {
    const p = placePoint(600, 40, hiddenFromStart);
    npc = { x: p.x, y: p.y, r: 11, hp: 2, alive: true, facing: rng() * Math.PI * 2, traded: false, walkT: 0 };
  }
  // emission schedule (never on the boss floor)
  let emisAt = -1;
  if (!def.boss && rng() < 0.25 && buildings.length) emisAt = 35 + rng() * 50;
  const decor = [];
  for (let i = 0; i < 40; i++) {
    decor.push({ x: rng() * world.w, y: rng() * world.h, w: 16 + rng() * 46, h: 6 + rng() * 14 });
  }
  return {
    name: def.name, theme: THEMES[def.theme], world, def,
    playerStart: start,
    walls, crates, cars, trees, solids, bushes, buildings, decor,
    marauders, mutants, boss, corpses, caches, npc,
    anomalies, artifacts,
    extraction, stealthBroken: false,
    emisAt, emis: 'none', emisT: 0,
    explored: null, mmCanvas: null,
  };
}
function placeAnomalies(list, count, world, solids, start, rng) {
  for (let i = 0; i < count; i++) {
    const ar = 40 + rng() * 16;
    for (let t = 0; t < 80; t++) {
      const x = 70 + ar + rng() * (world.w - 140 - ar * 2);
      const y = 70 + ar + rng() * (world.h - 140 - ar * 2);
      if (dist(x, y, start.x, start.y) < 260) continue;
      const box = { x: x - ar - 45, y: y - ar - 45, w: (ar + 45) * 2, h: (ar + 45) * 2 };
      if (overlapsAny(box, solids, 0)) continue;
      if (list.some(a => dist(x, y, a.x, a.y) < a.r + ar + 60)) continue;
      list.push({
        x, y, r: ar, type: ANOM_TYPES[Math.floor(rng() * ANOM_TYPES.length)],
        reveal: 0, pT: rng() * 2, sndT: rng() * 2, spin: rng() * Math.PI * 2,
      });
      break;
    }
  }
}
function relocateAnomalies() {
  // the emission reshuffles every anomaly on the map
  const count = level.anomalies.length;
  const rng = mulberry32((Math.random() * 1e9) | 0);
  level.anomalies.length = 0;
  placeAnomalies(level.anomalies, count, level.world, level.solids, { x: player.x, y: player.y }, rng);
  for (const a of level.anomalies) a.reveal = 3.5; // they crackle visibly right after
}

// ===== Raid lifecycle =====
function enterState(s) { state = s; stateTimer = 0; inputLock = 0.22; }
function rollModifier() {
  const r = Math.random();
  nextModifier = r < 0.55 ? 'none' : r < 0.7 ? 'night' : r < 0.85 ? 'pack' : 'fresh';
}
function loadLevel(idx) {
  levelIndex = idx;
  raidModifier = nextModifier;
  level = generateLevel(LEVELS[idx], raidModifier);
  player.x = level.playerStart.x;
  player.y = level.playerStart.y;
  player.r = 11;
  player.alive = true;
  player.facing = 0; player.dashCD = 0; player.dashTime = 0; player.invuln = 0; player.fireCD = 0;
  player.slots = [{ type: save.gear.weapon, ammo: WEAPONS[save.gear.weapon].startAmmo }, null];
  player.active = 0; player.switchCD = 0;
  player.bolts = save.gear.bolts; player.boltCD = 0; player.walkT = 0;
  player.armor = save.armor;
  bullets = []; boltsFlying = []; drops = []; particles = []; decals = []; casings = [];
  levelStats = { startTime: performance.now(), kills: 0, found: 0 };
  if (!runStats) runStats = { kills: 0, income: 0, levels: 0 };
  detectorTimer = 0.3;
  shake = 0;
  initExplored();
  camera.x = player.x - W / 2; camera.y = player.y - H / 2;
  clampCamera();
  startHum();
  enterState('intro');
}
function restartLevel() {
  // instant Hotline-style restart: unbanked loot is gone, the Zone reshuffles
  if (player.carry.length) player.carry = [];
  loadLevel(levelIndex);
}
function journalDeath(reason) {
  const L = level ? level.name : '';
  const causes = {
    shot: ['Пуля мародёра нашла меня', 'Стервятники сработали чисто', 'Не заметил стрелка за укрытием'],
    mutant: ['Хрипуны догнали', 'Стая взяла в кольцо', 'Услышал рык слишком поздно'],
    anomaly_fry: ['Жарка сожгла в двух шагах от тропы', 'Пожалел болт — сгорел'],
    anomaly_vortex: ['Воронка затянула', 'Шагнул не туда — воронка'],
    anomaly_arc: ['Разряд. Даже не понял, откуда', 'Статикой пахло не зря'],
    anomaly_acid: ['Кислота. Думал — лужа как лужа', 'Прошёл по «луже»'],
    emission: ['Не добежал до укрытия. Выброс', 'Выброс накрыл в чистом поле'],
    boss: ['Горбач размазал по бетону', 'Арена осталась за Горбачом'],
  };
  const arr = causes[reason] || causes.shot;
  const lost = player.carry.reduce((s, a) => s + a.value, 0);
  let line = 'День ' + save.day + '. ' + L + '. ' + arr[Math.floor(Math.random() * arr.length)] + '.';
  if (lost > 0) line += ' Хабар на ' + lost + '₽ остался лежать.';
  addJournal(line);
}
function journalSuccess(income) {
  const bits = [];
  if (income > 0) bits.push('Вынес хабар на ' + income + '₽');
  else bits.push('Ушёл пустым, зато живым');
  if (levelStats.kills === 0 && !level.stealthBroken) bits.push('меня никто не видел');
  else if (levelStats.kills >= 4) bits.push('пришлось стрелять много');
  if (level.emis === 'done') bits.push('пересидел выброс');
  if (level.boss && !level.boss.alive) bits.push('Горбач больше не встанет');
  addJournal('День ' + save.day + '. ' + level.name + '. ' + bits.join(', ') + '.');
}
function killPlayer(reason) {
  if (!player.alive) return;
  // armor vest takes exactly one hit for you
  if (player.armor > 0 && reason !== 'emission') {
    player.armor = 0;
    save.armor = 0; persistSave();
    player.invuln = 0.7;
    shake += 7;
    sndArmorClank();
    spawnParticles(player.x, player.y, 8, '#c9c9a0', 160, 0.3, 2);
    return;
  }
  player.alive = false;
  sndPlayerDeath();
  spawnBlood(player.x, player.y, true);
  stopHum();
  deathReason = reason;
  journalDeath(reason);
  save.day++;
  persistSave();
  enterState('dead');
}
function completeRaid() {
  const income = player.carry.reduce((s, a) => s + a.value, 0);
  save.money += income;
  runStats.income += income;
  runStats.kills += levelStats.kills;
  runStats.levels++;
  journalSuccess(income);
  save.day++;
  if (save.money > save.bestScore) save.bestScore = save.money;
  persistSave();
  hubToast = income > 0 ? 'ХАБАР СДАН: +' + income + '₽' : 'ВЕРНУЛСЯ ПУСТЫМ';
  player.carry = [];
  stopHum();
  sndCash();
  if (levelIndex + 1 >= LEVELS.length) {
    enterState('victory');
  } else {
    pendingLevel = levelIndex + 1;
    rollModifier();
    enterState('hub');
    hubTab = 0;
  }
}

// ===== Fog-of-war exploration + minimap =====
const MM_CELL = 64;
function initExplored() {
  const cols = Math.ceil(level.world.w / MM_CELL);
  const rows = Math.ceil(level.world.h / MM_CELL);
  level.explored = { cols, rows, data: new Uint8Array(cols * rows) };
  const mm = document.createElement('canvas');
  mm.width = cols; mm.height = rows;
  level.mmCanvas = mm;
  level.mmCtx = mm.getContext('2d');
}
function cellSolid(cx, cy) {
  const x = cx * MM_CELL + MM_CELL / 2, y = cy * MM_CELL + MM_CELL / 2;
  for (const w of level.walls) {
    if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return true;
  }
  return false;
}
function updateExplored() {
  const ex = level.explored;
  const R = 5; // ~320px discovery radius
  const pcx = Math.floor(player.x / MM_CELL), pcy = Math.floor(player.y / MM_CELL);
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      if (dx * dx + dy * dy > R * R) continue;
      const cx = pcx + dx, cy = pcy + dy;
      if (cx < 0 || cy < 0 || cx >= ex.cols || cy >= ex.rows) continue;
      const i = cy * ex.cols + cx;
      if (!ex.data[i]) {
        ex.data[i] = 1;
        level.mmCtx.fillStyle = cellSolid(cx, cy) ? '#4a4d40' : '#2c3322';
        level.mmCtx.fillRect(cx, cy, 1, 1);
      }
    }
  }
}

// ===== Sound events: gunfire draws mutants from far away =====
function noiseEvent(x, y, radius) {
  for (const u of level.mutants) {
    if (!u.alive || u.state === 'chase') continue;
    if (dist(u.x, u.y, x, y) < radius) {
      u.state = 'investigate';
      u.goalX = x + (Math.random() - 0.5) * 80;
      u.goalY = y + (Math.random() - 0.5) * 80;
    }
  }
  if (level.boss && level.boss.alive && level.boss.state === 'idle' && dist(level.boss.x, level.boss.y, x, y) < radius) {
    level.boss.aware = true;
  }
}

// ===== Combat =====
function playerConcealed() {
  for (const b of level.bushes) {
    if (dist(player.x, player.y, b.x, b.y) < b.r) return true;
  }
  return false;
}
function playerInBuilding() {
  for (const b of level.buildings) {
    if (player.x > b.x && player.x < b.x + b.w && player.y > b.y && player.y < b.y + b.h) return b;
  }
  return null;
}
function nearestAliveEnemyWithin(x, y, radius) {
  let best = null, bestD = radius;
  for (const m of level.marauders) {
    if (m.alive) { const d = dist(x, y, m.x, m.y); if (d < bestD) { bestD = d; best = m; } }
  }
  for (const u of level.mutants) {
    if (u.alive) { const d = dist(x, y, u.x, u.y); if (d < bestD) { bestD = d; best = u; } }
  }
  if (level.boss && level.boss.alive) {
    const d = dist(x, y, level.boss.x, level.boss.y);
    if (d < bestD) { bestD = d; best = level.boss; }
  }
  return best;
}
function alertNearby(x, y, radius) {
  if (!level) return;
  level.stealthBroken = true;
  for (const m of level.marauders) {
    if (m.alive && dist(m.x, m.y, x, y) < radius) {
      if (m.state === 'patrol') startAim(m, 0.15);
      m.state = 'alert'; m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 3.5;
    }
  }
  for (const u of level.mutants) {
    if (u.alive && dist(u.x, u.y, x, y) < radius) u.state = 'chase';
  }
}
function squadShare(m) {
  // squadmates cover each other: one sees you — the squad knows
  for (const o of level.marauders) {
    if (o !== m && o.alive && o.squad === m.squad && dist(o.x, o.y, m.x, m.y) < 700) {
      if (o.state === 'patrol') { startAim(o, 0.25); o.state = 'alert'; }
      o.lastKnownX = m.lastKnownX; o.lastKnownY = m.lastKnownY; o.searchTimer = Math.max(o.searchTimer, 3);
    }
  }
}
function dropWeapon(m) {
  drops.push({ x: m.x + (Math.random() - 0.5) * 10, y: m.y + (Math.random() - 0.5) * 10, type: m.weapon, ammo: 3 + Math.floor(Math.random() * 4), cd: 0 });
}
function killMarauder(m, byPlayer) {
  m.alive = false;
  if (byPlayer) levelStats.kills++;
  spawnBlood(m.x, m.y, false);
  dropWeapon(m);
  sndEnemyDeath();
}
function killMutant(u, byPlayer) {
  u.alive = false;
  if (byPlayer) levelStats.kills++;
  spawnBlood(u.x, u.y, true);
  sndEnemyDeath();
}
function damageMarauder(m, dmg, hx, hy, byPlayer) {
  m.hp -= dmg;
  spawnSpark(hx, hy);
  spawnBlood(m.x, m.y, false);
  if (m.hp <= 0) { killMarauder(m, byPlayer); return; }
  m.staggerT = 0.45;
  m.aimT = Math.max(m.aimT, 0.35);
  m.burst = 0;
  if (byPlayer) {
    m.state = 'alert'; m.targetKind = 'player';
    m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 4;
    squadShare(m);

}
function damageMutant(u, dmg, hx, hy, byPlayer) {

function meleeKill(target) {

function firePlayerBullets() {
  const w = WEAPONS[activeWeapon()];
  for (let i = 0; i < w.pellets; i++) {
    const a = player.facing + (Math.random() - 0.5) * 2 * w.spread + (w.pellets > 1 ? (i - (w.pellets - 1) / 2) * (w.spread / w.pellets) : 0);
    bullets.push({
      x: player.x + Math.cos(player.facing) * 16, y: player.y + Math.sin(player.facing) * 16,
      vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
      owner: 'player', life: w.life, alive: true,
    });
  }
  if (activeWeapon() === 'sawnoff') { sndShotgun(); shake += 5; } else { sndShot(); shake += 2.2; }
  alertNearby(player.x, player.y, 460);

  spawnMuzzleFlash(player.x, player.y, player.facing);
  spawnCasing(player.x, player.y, player.facing);
}
function fireEnemyBullet(m, angle, d) {
  const spread = 0.03 + clamp(d / 460, 0, 1) * 0.22;
  const w = m.weapon;
  const pellets = w === 'sawnoff' ? 3 : 1;
  const life = w === 'sawnoff' ? 0.45 : 1.0;
  for (let i = 0; i < pellets; i++) {
    const a = angle + (Math.random() - 0.5) * 2 * spread + (pellets > 1 ? (i - 1) * 0.14 : 0);
    bullets.push({
      x: m.x + Math.cos(a) * 14, y: m.y + Math.sin(a) * 14,
      vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
      owner: 'enemy', life, alive: true,
    });

  sndEnemyShot(dist(m.x, m.y, player.x, player.y));
  noiseEvent(m.x, m.y, 950);

}
function tryAttack() {
  if (!player.alive || player.fireCD > 0 || player.switchCD > 0) return;
  const target = nearestAliveEnemyWithin(player.x, player.y, MELEE_RANGE);

    meleeKill(target);
    player.fireCD = 0.28;
    spawnMeleeSlash(player.x, player.y, player.facing);

function tryDash() {

function throwBolt() {

    x: player.x + Math.cos(player.facing) * 14, y: player.y + Math.sin(player.facing) * 14,

function triggerAnomaly(a) {

  } else if (kind === 'bolts') {

  } else {

}
let hudMsg = '', hudMsgT = 0;
function hudFlash(s) { hudMsg = s; hudMsgT = 1.6; }
function checkArtifactPickups() {
  for (const a of level.artifacts) {
    if (a.taken) continue;
    if (dist(player.x, player.y, a.x, a.y) < player.r + 18) {
      a.taken = true;
      player.carry.push({ name: a.name, value: a.value });

      spawnPickupParticles(a.x, a.y);
      hudFlash('«' + a.name.toUpperCase() + '» +' + a.value + '₽');

}
function checkLootPickups() {
  for (const c of level.corpses) {
    if (!c.looted && dist(player.x, player.y, c.x, c.y) < player.r + 16) { c.looted = true; giveLoot(c.loot); }
  }
  for (const c of level.caches) {

function checkWeaponPickups(dt) {
  for (const d of drops) {

    if (dist(player.x, player.y, d.x, d.y) < player.r + 12) {
      const sameSlot = player.slots.findIndex(s => s && s.type === d.type);
      if (sameSlot >= 0) {
        player.slots[sameSlot].ammo += WEAPONS[d.type].pickupAmmo;
        d.dead = true;
      } else if (!player.slots[1]) {
        player.slots[1] = { type: d.type, ammo: d.ammo + WEAPONS[d.type].pickupAmmo };
        d.dead = true;
      } else {
        // both slots busy: swap out the active gun
        const old = player.slots[player.active];
        player.slots[player.active] = { type: d.type, ammo: d.ammo + WEAPONS[d.type].pickupAmmo };
        d.type = old.type; d.ammo = old.ammo; d.cd = 1.6;
      }
      player.switchCD = 0.5;
      sndGunPickup();
    }
  }
  drops = drops.filter(d => !d.dead);
}
// mid-raid barter with the neutral stalker
function npcTradeAvailable() {

function checkExtraction() {

function updateDetectorSound(dt) {

  let minD = Infinity;
  for (const a of level.artifacts) if (!a.taken) minD = Math.min(minD, dist(player.x, player.y, a.x, a.y));
  if (minD === Infinity) return;

  if (detectorTimer <= 0) {
    const t = clamp(1 - (minD - 30) / DETECTOR_RANGE, 0, 1);

// ===== Camera (smooth follow with lead) =====
function screenToWorld(sx, sy) { return { x: sx + camera.x, y: sy + camera.y }; }
function clampCamera() {
  const w = level.world.w, h = level.world.h;
  if (w <= W) camera.x = (w - W) / 2; else camera.x = clamp(camera.x, 0, w - W);
  if (h <= H) camera.y = (h - H) / 2; else camera.y = clamp(camera.y, 0, h - H);
}
function updateCamera(dt) {
  const lead = 85;
  const tx = player.x + Math.cos(player.facing) * lead - W / 2;
  const ty = player.y + Math.sin(player.facing) * lead - H / 2;
  const k = 1 - Math.exp(-5 * dt);
  camera.x += (tx - camera.x) * k;
  camera.y += (ty - camera.y) * k;
  clampCamera();
}
function nearCamera(e, margin) {
  return e.x > camera.x - margin && e.x < camera.x + W + margin && e.y > camera.y - margin && e.y < camera.y + H + margin;
}
function aiMargin() { return Math.max(W, H) * 0.75; } // ~1.5 screens

// ===== Player update =====
function updatePlayerMovement(dt) {
  let mx = 0, my = 0;
  if (usingTouch) {
    mx = joy.dx; my = joy.dy;
  } else {
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    const len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }
  }
  const moving = Math.hypot(mx, my) > 0.05;
  player.isMoving = moving;
  if (moving) {
    player.lastMoveAngle = Math.atan2(my, mx);
    player.walkT += player.speed * dt;
  }
  if (player.dashTime > 0) {
    player.dashTime -= dt;
    player.x += Math.cos(player.dashAngle) * player.dashSpeed * dt;
    player.y += Math.sin(player.dashAngle) * player.dashSpeed * dt;
  } else {
    player.x += mx * player.speed * dt;
    player.y += my * player.speed * dt;
  }
  resolveWalls(player, level.solids);
  clampToWorld(player, level.world);
  if (player.dashCD > 0) player.dashCD -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.fireCD > 0) player.fireCD -= dt;
  if (player.boltCD > 0) player.boltCD -= dt;
  if (player.switchCD > 0) player.switchCD -= dt;
  if (usingTouch) {
    const target = nearestAliveEnemyWithin(player.x, player.y, AUTOAIM_RANGE);
    if (target) player.facing = Math.atan2(target.y - player.y, target.x - player.x);
    else if (moving) player.facing = player.lastMoveAngle;
  } else {
    const wp = screenToWorld(mouse.x, mouse.y);
    player.facing = Math.atan2(wp.y - player.y, wp.x - player.x);
  }
}
function updatePlayerActions() {
  if (inputLock > 0) return;
  const attackHeld = usingTouch ? btnAttack.active : mouse.down;
  if (attackHeld) tryAttack();
}

// ===== Marauder AI =====
function startAim(m, extra) { m.aimT = 0.3 + Math.random() * 0.2 + (extra || 0); }
function visionRange() { return raidModifier === 'night' ? 240 : 320; }
function canSeePlayer(x, y, facing, range, halfAngle) {
  if (!player.alive) return false;
  const eff = playerConcealed() ? Math.min(range, 70) : range;
  const d = dist(x, y, player.x, player.y);
  if (d > eff) return false;
  const ang = Math.atan2(player.y - y, player.x - x);
  let diff = ang - facing;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  if (Math.abs(diff) > halfAngle) return false;
  return hasLineOfSight(x, y, player.x, player.y, level.solids);
}
function nearestVisibleMutant(m) {
  let best = null, bestD = 300;
  for (const u of level.mutants) {
    if (!u.alive) continue;
    const d = dist(m.x, m.y, u.x, u.y);
    if (d < bestD && hasLineOfSight(m.x, m.y, u.x, u.y, level.solids)) { bestD = d; best = u; }
  }
  if (level.boss && level.boss.alive) {
    const d = dist(m.x, m.y, level.boss.x, level.boss.y);
    if (d < bestD && hasLineOfSight(m.x, m.y, level.boss.x, level.boss.y, level.solids)) { best = level.boss; }
  }
  if (m.bittenBy && m.bittenBy.alive && dist(m.x, m.y, m.bittenBy.x, m.bittenBy.y) < 340) best = m.bittenBy;
  return best;
}
function marauderFire(m, tx, ty, target) {
  const dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  if (m.weapon === 'rifle') {
    if (m.fireCD <= 0 && m.burst <= 0) { m.burst = 3; m.burstT = 0; m.burstTarget = target || null; m.fireCD = 1.7 + Math.random() * 0.4; }
  } else if (m.weapon === 'sawnoff') {
    if (d < 280 && m.fireCD <= 0) { fireEnemyBullet(m, ang, d); m.fireCD = 1.5 + Math.random() * 0.4; }
  } else {
    if (m.fireCD <= 0) { fireEnemyBullet(m, ang, d); m.fireCD = 1.0 + Math.random() * 0.35; }
  }
}
function marauderMove(m, ang, mult, dt) {
  m.x += Math.cos(ang) * 90 * dt * mult;
  m.y += Math.sin(ang) * 90 * dt * mult;
  m.walkT += 90 * dt * mult;
  m.moved = true;
  resolveWalls(m, level.solids); clampToWorld(m, level.world);
}
function updateMarauder(m, dt) {
  if (!m.alive) return;
  m.moved = false;
  if (m.fireCD > 0) m.fireCD -= dt;
  if (m.staggerT > 0) { m.staggerT -= dt; return; }
  if (m.aimT > 0) m.aimT -= dt;
  if (m.burst > 0) {
    m.burstT -= dt;
    if (m.burstT <= 0) {
      const t = (m.burstTarget && m.burstTarget.alive) ? m.burstTarget : player;
      fireEnemyBullet(m, Math.atan2(t.y - m.y, t.x - m.x), dist(m.x, m.y, t.x, t.y));
      m.burst--; m.burstT = 0.09;
    }
  }
  // faction war: mutants are the immediate threat; react fast, keep distance
  const mut = nearestVisibleMutant(m);
  if (mut) {
    if (m.targetKind !== 'mutant') { m.aimT = 0.12 + Math.random() * 0.1; m.targetKind = 'mutant'; }
    m.mutTarget = mut;
    const dx = mut.x - m.x, dy = mut.y - m.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    m.facing = ang;
    if (d < 140) marauderMove(m, ang + Math.PI, 0.85, dt); // back away from claws
    if (m.aimT <= 0) marauderFire(m, mut.x, mut.y, mut);
    return;
  }
  if (m.targetKind === 'mutant') m.targetKind = m.state === 'patrol' ? 'none' : 'player';

  if (m.state === 'patrol') {
    m.patrolT += dt;
    if (m.mode === 'route' && m.waypoints.length > 1) {
      const wp = m.waypoints[m.wpIdx];
      const d = dist(m.x, m.y, wp.x, wp.y);
      if (d < 34) m.wpIdx = (m.wpIdx + 1) % m.waypoints.length;
      else {
        const ang = Math.atan2(wp.y - m.y, wp.x - m.x);
        m.facing = ang + Math.sin(m.patrolT * 1.7) * 0.25;
        marauderMove(m, ang, 0.45, dt);
      }
    } else {
      m.facing = m.baseFacing + Math.sin(m.patrolT * 0.5) * 0.8; // standing post, scanning
    }
    if (canSeePlayer(m.x, m.y, m.facing, visionRange(), 0.62)) {
      m.state = 'alert'; m.targetKind = 'player'; m.searchTimer = 4;
      m.lastKnownX = player.x; m.lastKnownY = player.y;
      startAim(m, 0.1);
      alertNearby(m.x, m.y, 340);
      squadShare(m);
      sndAlert();
    }
    return;
  }
  const dx = player.x - m.x, dy = player.y - m.y;
  const d = Math.hypot(dx, dy);
  const targetAngle = Math.atan2(dy, dx);
  const seeRange = playerConcealed() ? 70 : visionRange() + 140;
  const canSee = player.alive && d < seeRange && hasLineOfSight(m.x, m.y, player.x, player.y, level.solids);
  if (canSee) {
    if (m.targetKind !== 'player') { startAim(m, 0); m.targetKind = 'player'; }
    m.lastKnownX = player.x; m.lastKnownY = player.y; m.searchTimer = 4;
    m.facing = targetAngle;
    const desired = m.weapon === 'sawnoff' ? 150 : 230;
    if (d > desired) marauderMove(m, targetAngle, 0.6, dt);
    else if (d < desired * 0.55) marauderMove(m, targetAngle + Math.PI, 0.5, dt);
    if (m.aimT <= 0) marauderFire(m, player.x, player.y, null);
  } else {
    m.searchTimer -= dt;
    const ang = Math.atan2(m.lastKnownY - m.y, m.lastKnownX - m.x);
    const dd = dist(m.x, m.y, m.lastKnownX, m.lastKnownY);
    if (dd > 20) {
      m.facing = ang;
      marauderMove(m, ang, 0.5, dt);
    }
    if (m.searchTimer <= 0) { m.state = 'patrol'; m.targetKind = 'none'; m.patrolT = 0; m.baseFacing = m.facing; }
  }
}

// ===== Mutant AI (packs) =====
function mutantCandidates() {
  const list = [];
  if (player.alive) list.push({ e: player, isPlayer: true });
  for (const m of level.marauders) if (m.alive) list.push({ e: m, isPlayer: false });
  if (level.npc && level.npc.alive) list.push({ e: level.npc, isPlayer: false, isNpc: true });
  return list;
}
function packAggro(u) {
  for (const o of level.mutants) {
    if (o !== u && o.alive && o.pack === u.pack && dist(o.x, o.y, u.x, u.y) < 380 && o.state !== 'chase') o.state = 'chase';
  }
}
function updateMutant(u, dt) {
  if (!u.alive) return;
  if (u.staggerT > 0) { u.staggerT -= dt; return; }
  u.meleeCD -= dt;
  u.growlT -= dt;
  if (u.growlT <= 0) {
    u.growlT = 3 + Math.random() * 4;
    const d = dist(u.x, u.y, player.x, player.y);
    if (d < 700) sndGrowl(d); // heard well before seen
  }
  if (u.state === 'investigate') {
    const d = dist(u.x, u.y, u.goalX, u.goalY);
    const ang = Math.atan2(u.goalY - u.y, u.goalX - u.x);
    u.facing = ang;
    u.x += Math.cos(ang) * 150 * dt;
    u.y += Math.sin(ang) * 150 * dt;
    u.walkT += 150 * dt;
    resolveWalls(u, level.solids); clampToWorld(u, level.world);
    if (d < 50) { u.state = 'wander'; u.wanderCX = u.x; u.wanderCY = u.y; }
  }
  if (u.state === 'wander') {
    u.wanderT -= dt;
    if (u.wanderT <= 0) {
      u.wanderT = 1.5 + Math.random() * 2;
      const distFromHome = dist(u.x, u.y, u.wanderCX, u.wanderCY);
      if (distFromHome > 170) u.wanderAngle = Math.atan2(u.wanderCY - u.y, u.wanderCX - u.x) + (Math.random() - 0.5) * 0.6;
      else u.wanderAngle = Math.random() * Math.PI * 2;
    }
    u.facing = u.wanderAngle;
    u.x += Math.cos(u.wanderAngle) * 40 * dt;
    u.y += Math.sin(u.wanderAngle) * 40 * dt;
    u.walkT += 40 * dt;
    resolveWalls(u, level.solids); clampToWorld(u, level.world);
    for (const c of mutantCandidates()) {
      const detectR = c.isPlayer && playerConcealed() ? 80 : 240;
      if (dist(u.x, u.y, c.e.x, c.e.y) < detectR && hasLineOfSight(u.x, u.y, c.e.x, c.e.y, level.solids)) {
        u.state = 'chase';
        packAggro(u);
        break;
      }
    }
  } else if (u.state === 'chase') {
    let best = null, bestD = 520, bestC = null;
    for (const c of mutantCandidates()) {
      const d = dist(u.x, u.y, c.e.x, c.e.y);
      if (d < bestD) { bestD = d; best = c.e; bestC = c; }
    }
    if (!best) { u.state = 'wander'; u.wanderCX = u.x; u.wanderCY = u.y; return; }
    const dx = best.x - u.x, dy = best.y - u.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    u.facing = ang;
    if (d > u.r + best.r + 4) {
      u.x += Math.cos(ang) * 205 * dt;
      u.y += Math.sin(ang) * 205 * dt;
      u.walkT += 205 * dt;
      resolveWalls(u, level.solids); clampToWorld(u, level.world);
    }
    if (d < u.r + best.r + 8 && u.meleeCD <= 0) {
      u.meleeCD = 0.7;
      if (bestC.isPlayer) {
        if (player.invuln <= 0) killPlayer('mutant');
      } else if (bestC.isNpc) {
        hitNpc();
      } else {
        best.hp -= 1;
        best.bittenBy = u;
        best.staggerT = 0.4;
        spawnBlood(best.x, best.y, false);
        sndMelee();
        if (best.hp <= 0) killMarauder(best, false);
      }
    }
  }
}

// ===== Boss: Горбач — telegraphed charges, lure him into anomalies =====
function updateBoss(b, dt) {
  if (!b.alive) return;
  b.t -= dt;
  const dx = player.x - b.x, dy = player.y - b.y;
  const d = Math.hypot(dx, dy);
  if (b.state === 'idle') {
    b.facing = Math.atan2(dy, dx);
    if (player.alive && (d < 620 || b.aware) && hasLineOfSight(b.x, b.y, player.x, player.y, level.solids)) {
      b.state = 'telegraph'; b.t = 0.8;
      sndRoar(d); shake += 4;
    } else if (b.aware && d < 1100) {
      b.x += Math.cos(Math.atan2(dy, dx)) * 70 * dt;
      b.y += Math.sin(Math.atan2(dy, dx)) * 70 * dt;
      b.walkT += 70 * dt;
      resolveWalls(b, level.solids); clampToWorld(b, level.world);
    }
  } else if (b.state === 'telegraph') {
    b.facing = Math.atan2(dy, dx); // locks on while winding up — dodge sideways
    if (b.t <= 0) { b.state = 'charge'; b.chargeDir = b.facing; b.t = 1.6; }
  } else if (b.state === 'charge') {
    const ox = b.x, oy = b.y;
    b.x += Math.cos(b.chargeDir) * 520 * dt;
    b.y += Math.sin(b.chargeDir) * 520 * dt;
    b.walkT += 520 * dt;
    const hitWall = resolveWalls(b, level.solids);
    clampToWorld(b, level.world);
    if (player.alive && player.invuln <= 0 && dist(b.x, b.y, player.x, player.y) < b.r + player.r + 2) {
      killPlayer('boss');
    }
    if (hitWall || (Math.hypot(b.x - ox, b.y - oy) < 100 * dt) || b.t <= 0) {
      b.state = 'stunned'; b.t = 1.5;
      shake += 8;
      noiseBurst(0.3, 0.4, 900);
    }
  } else if (b.state === 'stunned') {
    if (b.t <= 0) b.state = 'idle';
  }
}

// ===== Bullets & bolts =====
function updateBullet(b, dt) {
  const steps = 2;
  for (let s = 0; s < steps && b.alive; s++) {
    b.x += b.vx * dt / steps;
    b.y += b.vy * dt / steps;
    for (const w of level.solids) {
      if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) { b.alive = false; spawnSpark(b.x, b.y); return; }
    }
    if (b.owner === 'enemy') {
      if (player.alive && player.invuln <= 0 && dist(b.x, b.y, player.x, player.y) < player.r + 3) {
        b.alive = false; killPlayer('shot'); return;
      }
      for (const u of level.mutants) {
        if (u.alive && dist(b.x, b.y, u.x, u.y) < u.r + 3) { b.alive = false; damageMutant(u, 1, b.x, b.y, false); return; }
      }
      if (level.boss && level.boss.alive && dist(b.x, b.y, level.boss.x, level.boss.y) < level.boss.r + 3) {
        b.alive = false; level.boss.hp -= 1; spawnSpark(b.x, b.y); if (level.boss.hp <= 0) damageBoss(level.boss, 0, b.x, b.y); return;
      }
    } else {
      for (const m of level.marauders) {
        if (m.alive && dist(b.x, b.y, m.x, m.y) < m.r + 3) { b.alive = false; damageMarauder(m, 1, b.x, b.y, true); return; }
      }
      for (const u of level.mutants) {
        if (u.alive && dist(b.x, b.y, u.x, u.y) < u.r + 3) { b.alive = false; damageMutant(u, 1, b.x, b.y, true); return; }
      }
      if (level.boss && level.boss.alive && dist(b.x, b.y, level.boss.x, level.boss.y) < level.boss.r + 3) {
        b.alive = false; damageBoss(level.boss, 1, b.x, b.y); return;
      }
      if (level.npc && level.npc.alive && dist(b.x, b.y, level.npc.x, level.npc.y) < level.npc.r + 3) {
        b.alive = false; hitNpc(); return;
      }
    }
  }
  b.life -= dt;
  if (b.life <= 0) b.alive = false;
}
function updateBullets(dt) {
  for (const b of bullets) if (b.alive) updateBullet(b, dt);
  bullets = bullets.filter(b => b.alive);
}
function updateBolts(dt) {
  for (const bo of boltsFlying) {
    bo.x += bo.vx * dt;
    bo.y += bo.vy * dt;
    bo.spin += 12 * dt;
    bo.life -= dt;
    for (const a of level.anomalies) {
      if (dist(bo.x, bo.y, a.x, a.y) < a.r + 6) { triggerAnomaly(a); bo.life = 0; break; }
    }
    if (bo.life <= 0) { sndBoltLand(); spawnParticles(bo.x, bo.y, 2, '#c0c0b0', 60, 0.3, 2); }
  }
  boltsFlying = boltsFlying.filter(b => b.life > 0);
}

// ===== Anomalies =====
function updateAnomalies(dt) {
  for (const a of level.anomalies) {
    if (a.reveal > 0) a.reveal -= dt;
    a.spin += dt * (a.type === 'vortex' ? 2.2 : 0.4);
    if (a.type === 'vortex') {
      const pullR = a.r * 2.4;
      const pull = e => {
        const d = dist(e.x, e.y, a.x, a.y);
        if (d < pullR && d > 1) {
          const f = (1 - d / pullR) * 150 * dt;
          e.x += (a.x - e.x) / d * f;
          e.y += (a.y - e.y) / d * f;
        }
      };
      if (player.alive && player.invuln <= 0 && player.dashTime <= 0) pull(player);
      for (const m of level.marauders) if (m.alive && nearCamera(m, 600)) pull(m);
      for (const u of level.mutants) if (u.alive && nearCamera(u, 600)) pull(u);
    }
    const pd = dist(player.x, player.y, a.x, a.y);
    a.sndT -= dt;
    if (pd < 340 && a.sndT <= 0) {
      const prox = 1 - pd / 340;
      if (a.type === 'fry') { noiseBurst(0.04, 0.04 + 0.08 * prox, 1200); a.sndT = 0.5 + Math.random() * 1.6; }
      else if (a.type === 'arc') { tone(1800 + Math.random() * 900, 0.02, 'square', 0.02 + 0.05 * prox); a.sndT = 0.8 + Math.random() * 2; }
      else if (a.type === 'acid') { noiseBurst(0.1, 0.015 + 0.05 * prox, 500); a.sndT = 0.7 + Math.random() * 1.5; }
      else a.sndT = 1;
    }
    a.pT -= dt;
    if (a.pT <= 0 && nearCamera(a, 300)) {
      a.pT = a.reveal > 0 ? 0.1 : 1.2 + Math.random() * 1.6;
      if (particles.length < 350) {
        const ang = Math.random() * Math.PI * 2;
        const rr = Math.random() * a.r * 0.7;
        const col = a.type === 'fry' ? 'rgba(255,150,60,0.6)' : a.type === 'acid' ? 'rgba(184,232,58,0.5)' : 'rgba(180,255,140,0.5)';
        particles.push({ x: a.x + Math.cos(ang) * rr, y: a.y + Math.sin(ang) * rr, vx: 0, vy: a.type === 'fry' ? -30 : -14, life: 1.1, maxLife: 1.1, color: col, size: 2 });
      }
    }
  }
}
function checkAnomalyCollisions() {
  for (const a of level.anomalies) {
    if (player.alive && player.invuln <= 0 && dist(player.x, player.y, a.x, a.y) < a.r) {
      triggerAnomaly(a);
      killPlayer('anomaly_' + a.type);
      if (!player.alive) return;
    }
  }
  for (const m of level.marauders) {
    if (!m.alive || !nearCamera(m, 600)) continue;
    for (const a of level.anomalies) {
      if (dist(m.x, m.y, a.x, a.y) < a.r) { m.alive = false; spawnAnomalyDeath(m.x, m.y); dropWeapon(m); triggerAnomaly(a); break; }
    }
  }
  for (const u of level.mutants) {
    if (!u.alive || !nearCamera(u, 600)) continue;
    for (const a of level.anomalies) {
      if (dist(u.x, u.y, a.x, a.y) < a.r) { u.alive = false; spawnAnomalyDeath(u.x, u.y); triggerAnomaly(a); break; }
    }
  }
  if (level.boss && level.boss.alive) {
    const b = level.boss;
    for (const a of level.anomalies) {
      if (dist(b.x, b.y, a.x, a.y) < a.r + b.r * 0.4) {
        triggerAnomaly(a);
        damageBoss(b, 6, b.x, b.y);
        // knock him out of it, stunned and hurting
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        b.x = a.x + Math.cos(ang) * (a.r + b.r + 14);
        b.y = a.y + Math.sin(ang) * (a.r + b.r + 14);
        b.state = 'stunned'; b.t = 1.8;
        shake += 8;
        break;
      }
    }
  }
}

// ===== Emission (выброс) =====
function updateEmission(dt) {
  if (level.emisAt < 0 || level.emis === 'done') return;
  const elapsed = (performance.now() - levelStats.startTime) / 1000;
  if (level.emis === 'none') {
    if (elapsed >= level.emisAt) {
      level.emis = 'warning';
      level.emisT = 25;
      level.sirenT = 0;
      sndSiren();
      hudFlash('ВЫБРОС! В УКРЫТИЕ!');
    }
    return;
  }
  if (level.emis === 'warning') {
    level.emisT -= dt;
    level.sirenT -= dt;
    if (level.sirenT <= 0) { level.sirenT = 2.2; sndSiren(); }
    if (level.emisT <= 5 && level.emisT + dt > 5) tone(900, 0.3, 'square', 0.15);
    if (level.emisT <= 0) {
      level.emis = 'done';
      sndBlast();
      shake += 14;
      if (!playerInBuilding()) {
        killPlayer('emission');
      } else {
        relocateAnomalies();
        hudFlash('ВЫБРОС ПРОШЁЛ. АНОМАЛИИ СМЕСТИЛИСЬ');
      }
    }
  }
}

// ===== Ambient sound: hear what you cannot see =====
let ambT = 0;
function updateAmbientSound(dt) {
  ambT -= dt;
  if (ambT > 0) return;
  ambT = 0.34;
  for (const m of level.marauders) {
    if (m.alive && m.moved) {
      const d = dist(m.x, m.y, player.x, player.y);
      if (d < 420 && Math.random() < 0.6) { sndStep(d); m.stepT = 0; break; }
    }
  }
}

// ===== Particles, casings, blood =====
function spawnParticles(x, y, count, color, speed, life, size) {
  if (particles.length > 350) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, maxLife: life, color, size });
  }
}
function spawnSpark(x, y) { spawnParticles(x, y, 4, '#ffe9a8', 180, 0.25, 2); }
function spawnMuzzleFlash(x, y, facing) {
  particles.push({ x: x + Math.cos(facing) * 18, y: y + Math.sin(facing) * 18, vx: 0, vy: 0, life: 0.06, maxLife: 0.06, color: '#fff6d0', size: 9 });
}
function spawnMeleeSlash(x, y, facing) { spawnParticles(x + Math.cos(facing) * 20, y + Math.sin(facing) * 20, 6, '#ffffff', 120, 0.15, 2); }
function spawnDashTrail(x, y) { spawnParticles(x, y, 8, getPlayerLook().jacket, 60, 0.3, 3); }
function spawnAnomalyDeath(x, y) { spawnParticles(x, y, 14, PAL.anomaly, 220, 0.5, 3); }
function spawnPickupParticles(x, y) { spawnParticles(x, y, 16, PAL.artifact, 150, 0.6, 3); }
function spawnCasing(x, y, facing) {
  const side = facing + Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  casings.push({
    x, y,
    vx: Math.cos(side) * (60 + Math.random() * 60),
    vy: Math.sin(side) * (60 + Math.random() * 60),
    spin: Math.random() * Math.PI, vspin: 8 + Math.random() * 8,
    life: 0.45,
  });
}
function updateCasings(dt) {
  for (const c of casings) {
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.vx *= 0.86; c.vy *= 0.86;
    c.spin += c.vspin * dt;
    c.life -= dt;
    if (c.life <= 0) {
      decals.push({ x: c.x, y: c.y, casing: true, spin: c.spin });
      if (decals.length > 300) decals.shift();
    }
  }
  casings = casings.filter(c => c.life > 0);
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}
function spawnBlood(x, y, big) {
  const n = big ? 7 : 4;
  const splats = [];
  for (let i = 0; i < n; i++) {
    splats.push({ dx: (Math.random() - 0.5) * (big ? 36 : 20), dy: (Math.random() - 0.5) * (big ? 36 : 20), rr: (big ? 6 : 3) + Math.random() * (big ? 10 : 6) });
  }
  decals.push({ x, y, splats, color: Math.random() < 0.5 ? PAL.blood : PAL.bloodDark });
  if (decals.length > 300) decals.shift();
}

// ===== Main update =====
function updatePlaying(dt) {
  updatePlayerMovement(dt);
  if (!player.alive) return;
  updatePlayerActions();
  if (!player.alive) return;
  const margin = aiMargin();
  for (const m of level.marauders) {
    if (!m.alive) continue;
    if (nearCamera(m, margin)) updateMarauder(m, dt);
    else { if (m.fireCD > 0) m.fireCD -= dt; if (m.staggerT > 0) m.staggerT -= dt; }
  }
  if (!player.alive) return;
  for (const u of level.mutants) {
    if (!u.alive) continue;
    if (nearCamera(u, margin) || u.state === 'investigate') updateMutant(u, dt);
    else { if (u.staggerT > 0) u.staggerT -= dt; u.meleeCD -= dt; }
  }
  if (!player.alive) return;
  if (level.boss) updateBoss(level.boss, dt);
  if (!player.alive) return;
  updateBullets(dt);
  if (!player.alive) return;
  updateBolts(dt);
  updateParticles(dt);
  updateCasings(dt);
  updateAnomalies(dt);
  checkAnomalyCollisions();
  if (!player.alive) return;
  updateEmission(dt);
  if (!player.alive) return;
  checkArtifactPickups();
  checkLootPickups();
  checkWeaponPickups(dt);
  checkExtraction();
  if (state !== 'playing') return;
  updateDetectorSound(dt);
  updateAmbientSound(dt);
  updateHum();
  updateExplored();
  updateCamera(dt);
}
function update(dt) {
  shake *= Math.exp(-6 * dt);
  if (hudMsgT > 0) hudMsgT -= dt;
  if (state === 'intro') {
    stateTimer += dt;
    if (stateTimer > 1.8) enterState('playing');
  } else if (state === 'playing') {
    updatePlaying(dt);
  } else if (state === 'exit') {
    stateTimer += dt;
    const cx = level.extraction.x + level.extraction.w / 2;
    const cy = level.extraction.y + level.extraction.h / 2;
    player.x = lerp(player.x, cx, dt * 3);
    player.y = lerp(player.y, cy, dt * 3);
    player.facing = 0;
    player.walkT += 110 * dt;
    player.isMoving = true;
    updateParticles(dt);
    if (stateTimer >= 0.9) completeRaid();
  }
}

// ===== Sprites =====
function drawHuman(x, y, facing, r, frame, look, weaponType, aimFrac, maskKind) {
  const u = r / 6;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, u, r * 0.95, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(facing);
  const step = frame === 0 ? 1.5 * u : -1.5 * u;
  ctx.fillStyle = look.jacketDark;
  ctx.fillRect(-1 * u + step, -3.6 * u, 2.4 * u, 1.7 * u);
  ctx.fillRect(-1 * u - step, 1.9 * u, 2.4 * u, 1.7 * u);
  ctx.fillStyle = look.jacketDark;
  ctx.fillRect(-3.4 * u, -3.2 * u, 6.2 * u, 6.4 * u);
  ctx.fillStyle = look.jacket;
  ctx.fillRect(-2.8 * u, -2.6 * u, 5 * u, 5.2 * u);
  ctx.fillRect(0.6 * u, -2.6 * u, 3.2 * u, 1.4 * u);
  ctx.fillRect(0.6 * u, 1.2 * u, 3.2 * u, 1.4 * u);
  if (weaponType) {
    const w = WEAPONS[weaponType];
    const gl = w.gunLen * (0.45 + 0.55 * aimFrac) * u;
    const gw = w.wide ? 1.9 * u : 1.3 * u;
    ctx.fillStyle = '#1d1d1d';
    ctx.fillRect(2.6 * u, -gw / 2, gl, gw);
    ctx.fillStyle = '#3d3d3d';
    ctx.fillRect(2.6 * u, -gw / 2, 1.6 * u, gw);
  }
  const mk = maskKind || 'gasmask';
  ctx.fillStyle = look.head;
  ctx.beginPath(); ctx.arc(0.2 * u, 0, 2.6 * u, 0, Math.PI * 2); ctx.fill();
  if (mk === 'balaclava') {
    ctx.fillStyle = '#1e1e1a';
    ctx.beginPath(); ctx.arc(0.3 * u, 0, 2.3 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = look.eyes;
    ctx.fillRect(1.4 * u, -1.3 * u, 0.9 * u, 2.6 * u);
  } else if (mk === 'hood') {
    ctx.strokeStyle = look.jacketDark;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0.2 * u, 0, 2.4 * u, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#8a7a62';
    ctx.fillRect(1.5 * u, -1.1 * u, 1.4 * u, 2.2 * u);
    ctx.fillStyle = '#22201c';
    ctx.fillRect(1.9 * u, -1.2 * u, 0.7 * u, 0.8 * u);
    ctx.fillRect(1.9 * u, 0.4 * u, 0.7 * u, 0.8 * u);
  } else {
    ctx.fillStyle = look.mask;
    ctx.fillRect(1.6 * u, -1.2 * u, 2.1 * u, 2.4 * u);
    ctx.fillStyle = look.eyes;
    ctx.fillRect(1.1 * u, -1.7 * u, 1 * u, 1 * u);
    ctx.fillRect(1.1 * u, 0.7 * u, 1 * u, 1 * u);
  }
  ctx.restore();
}
function drawMutantSprite(x, y, facing, r, frame) {
  const u = r / 6;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, u, r * 1.15, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(facing);
  const lo = frame === 0 ? 1.3 * u : -1.3 * u;
  ctx.fillStyle = '#4a2620';
  ctx.fillRect(2 * u + lo, -4.8 * u, 2.2 * u, 2 * u);
  ctx.fillRect(-4.2 * u - lo, -4.8 * u, 2.2 * u, 2 * u);
  ctx.fillRect(2 * u - lo, 2.8 * u, 2.2 * u, 2 * u);
  ctx.fillRect(-4.2 * u + lo, 2.8 * u, 2.2 * u, 2 * u);
  ctx.fillStyle = '#5a3a30';
  ctx.fillRect(-7.6 * u, -0.6 * u, 2.6 * u, 1.2 * u);
  ctx.fillStyle = '#7a4a3a';
  ctx.beginPath(); ctx.ellipse(-0.5 * u, 0, 5.5 * u, 3.2 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9a6a52';
  ctx.beginPath(); ctx.ellipse(-1 * u, 0, 4 * u, 2.4 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a2a28';
  ctx.beginPath(); ctx.arc(-2 * u, 0, 2.2 * u, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a4a3a';
  ctx.beginPath(); ctx.arc(4.6 * u, 0, 2.1 * u, 0, Math.PI * 2); ctx.fill();

  ctx.fillRect(5.6 * u, -1.3 * u, 1.3 * u, 0.8 * u);

  ctx.fillStyle = '#ffd050';

  ctx.fillRect(4 * u, 0.5 * u, 1 * u, 1 * u);

}

// ===== World rendering =====
function drawFloor() {
  const th = level.theme;
  const tile = 64;
  const x0 = Math.floor(camera.x / tile) * tile, y0 = Math.floor(camera.y / tile) * tile;
  ctx.fillStyle = th.floor1;
  ctx.fillRect(camera.x, camera.y, W, H);
  ctx.fillStyle = th.floor2;
  for (let y = y0; y < camera.y + H; y += tile) {
    for (let x = x0; x < camera.x + W; x += tile) {
      if (((x / tile + y / tile) | 0) % 2 === 0) ctx.fillRect(x, y, tile, tile);
    }
  }
  ctx.fillStyle = th.decor;
  for (const r of level.decor) {
    if (r.x > camera.x - 80 && r.x < camera.x + W + 80 && r.y > camera.y - 40 && r.y < camera.y + H + 40) ctx.fillRect(r.x, r.y, r.w, r.h);
  }
}
function drawWalls() {
  for (const w of level.walls) {
    if (w.x + w.w < camera.x - 40 || w.x > camera.x + W + 40 || w.y + w.h < camera.y - 40 || w.y > camera.y + H + 40) continue;
    ctx.fillStyle = PAL.wallDark;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(w.x, w.y, w.w, Math.min(6, w.h));
    ctx.strokeStyle = PAL.wallEdge;
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
  }
}

function drawAnomalies() {
  for (let i = 0; i < level.anomalies.length; i++) {
    const a = level.anomalies[i];
    if (!nearCamera(a, 200)) continue;
    const tSeed = Math.floor(animT * 7);
    if (a.type === 'acid') drawAcidPuddle(a, false);
    if (a.reveal > 0) {
      const k = clamp(a.reveal / 2.6, 0, 1);
      const pulse = 0.7 + 0.3 * Math.sin(animT * 14);
      if (a.type === 'fry') {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.4);
        grad.addColorStop(0, 'rgba(255,200,120,' + (0.6 * k * pulse) + ')');
        grad.addColorStop(0.5, 'rgba(255,120,40,' + (0.32 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(255,90,30,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,140,' + 0.7 * k + ')';
        for (let j = 0; j < 5; j++) {
          const fx = a.x + (hash1(i * 9 + j * 23 + tSeed) - 0.5) * a.r * 1.4;
          const fy = a.y + (hash1(i * 17 + j * 31 + tSeed) - 0.5) * a.r * 1.2 - hash1(j + tSeed) * 12;
          ctx.fillRect(fx, fy, 3, 5);
        }
      } else if (a.type === 'vortex') {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.6);
        grad.addColorStop(0, 'rgba(30,40,30,' + 0.7 * k + ')');
        grad.addColorStop(0.6, 'rgba(143,255,90,' + (0.2 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(143,255,90,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(200,255,170,' + 0.8 * k + ')';
        ctx.lineWidth = 2;
        for (let j = 0; j < 3; j++) {
          const a0 = a.spin * 3 + j * (Math.PI * 2 / 3);
          ctx.beginPath();
          ctx.arc(a.x, a.y, a.r * (0.35 + j * 0.28), a0, a0 + 2.2);
          ctx.stroke();
        }
      } else if (a.type === 'acid') {
        drawAcidPuddle(a, true);
        ctx.strokeStyle = 'rgba(220,255,120,' + 0.8 * k + ')';
        for (let j = 0; j < 4; j++) {
          const bx = a.x + (hash1(i * 11 + j * 37 + tSeed) - 0.5) * a.r * 1.2;
          const by = a.y + (hash1(i * 29 + j * 13 + tSeed) - 0.5) * a.r * 0.9;
          ctx.beginPath(); ctx.arc(bx, by, 2 + hash1(j * 7 + tSeed) * 3, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 1.5);
        grad.addColorStop(0, 'rgba(216,255,176,' + (0.5 * k * pulse) + ')');
        grad.addColorStop(1, 'rgba(143,255,90,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = PAL.anomalyCore;
        ctx.globalAlpha = k * 0.9;
        ctx.lineWidth = 2;
        for (let j = 0; j < 3; j++) {
          const a0 = hash1(i * 7 + j * 13 + Math.floor(animT * 10)) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          for (let s = 1; s <= 3; s++) {
            const rr = (a.r * s) / 3;
            const wob = (hash1(i * 31 + j * 17 + s + Math.floor(animT * 12)) - 0.5) * 22;
            ctx.lineTo(a.x + Math.cos(a0) * rr + wob, a.y + Math.sin(a0) * rr + wob * 0.6);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    } else {
      const ringCol = a.type === 'fry' ? 'rgba(255,180,120,0.06)' : 'rgba(200,255,180,0.055)';
      ctx.strokeStyle = ringCol;
      ctx.lineWidth = 1.5;
      const wob = Math.sin(animT * 2.2 + i * 2) * 2;
      if (a.type === 'vortex') {
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 0.6 + wob, a.spin, a.spin + 2); ctx.stroke();
      } else if (a.type !== 'acid') {
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 0.8 + wob, 0.4 + i, 2.2 + i); ctx.stroke();
      }
      for (let k = 0; k < 3; k++) {
        if (hash1(i * 51 + k * 29 + tSeed) > (a.type === 'arc' ? 0.15 : 0.35)) continue;
        const px = a.x + (hash1(i * 77 + k * 41 + tSeed) - 0.5) * a.r * 1.4;
        const py = a.y + (hash1(i * 13 + k * 61 + tSeed) - 0.5) * a.r * 1.4;
        ctx.fillStyle = a.type === 'fry' ? 'rgba(255,170,90,0.35)' : a.type === 'arc' ? 'rgba(240,255,240,0.5)' : 'rgba(200,255,170,0.3)';
        ctx.fillRect(px, py, 2, 2);
      }
    }
  }
}
function drawArtifacts() {
  for (const a of level.artifacts) {
    if (a.taken) continue;
    const d = dist(player.x, player.y, a.x, a.y);
    if (d > ART_REVEAL_DIST) continue;
    const vis = clamp(1 - (d - 26) / (ART_REVEAL_DIST - 26), 0, 1);
    const flicker = 0.55 + 0.45 * Math.sin(animT * 9) * Math.sin(animT * 3.7);
    const alpha = vis * (0.35 + 0.65 * flicker);
    const bob = Math.sin(animT * 3) * 4;
    const x = a.x, y = a.y + bob;
    ctx.globalAlpha = alpha * 0.5;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, 26);
    grad.addColorStop(0, 'rgba(255,227,106,0.6)');
    grad.addColorStop(1, 'rgba(255,227,106,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAL.artifact;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(animT * 1.2);
    ctx.beginPath();
    ctx.moveTo(0, -11); ctx.lineTo(9, 0); ctx.lineTo(0, 11); ctx.lineTo(-9, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawVisionCone(m) {

  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.facing);
  const alerted = m.state !== 'patrol' || m.targetKind === 'mutant';
  ctx.fillStyle = alerted ? 'rgba(255,60,60,0.14)' : 'rgba(255,220,80,0.09)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, range, -half, half);
  ctx.closePath();
  ctx.fill();

}

function drawEnemies() {
  for (const m of level.marauders) { if (m.alive && nearCamera(m, 350)) drawVisionCone(m); }
  for (const m of level.marauders) {
    if (!m.alive || !nearCamera(m, 100)) continue;
    const frame = Math.floor(m.walkT / 14) % 2;
    const aimFrac = m.targetKind === 'none' ? 0.25 : clamp(1 - m.aimT / 0.4, 0, 1);
    drawHuman(m.x, m.y, m.facing, m.r, frame, LOOKS[m.weapon], m.weapon, aimFrac);
    if (m.aimT > 0 && m.targetKind !== 'none' && m.staggerT <= 0) {
      ctx.fillStyle = '#ffd23a';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', m.x, m.y - m.r - 8);
      ctx.textAlign = 'left';
    }
  }
  for (const u of level.mutants) {
    if (!u.alive || !nearCamera(u, 100)) continue;
    if (u.state === 'chase') {
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.12 * Math.sin(animT * 10);
      ctx.fillStyle = PAL.danger;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawMutantSprite(u.x, u.y, u.facing, u.r, Math.floor(u.walkT / 12) % 2);
  }
  const b = level.boss;
  if (b && b.alive && nearCamera(b, 200)) {
    if (b.state === 'telegraph') {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(animT * 22);
      ctx.strokeStyle = PAL.danger;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(b.facing) * 340, b.y + Math.sin(b.facing) * 340);
      ctx.stroke();
      ctx.restore();
    }
    drawMutantSprite(b.x, b.y, b.facing, b.r, Math.floor(b.walkT / 16) % 2);
    // hp bar
    const bw = 70;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(b.x - bw / 2, b.y - b.r - 18, bw, 7);
    ctx.fillStyle = PAL.danger;
    ctx.fillRect(b.x - bw / 2 + 1, b.y - b.r - 17, (bw - 2) * clamp(b.hp / b.maxHp, 0, 1), 5);
  }
}
function drawPlayer() {

  const flicker = player.invuln > 0 && Math.floor(animT * 20) % 2 === 0;
  if (flicker) ctx.globalAlpha = 0.5;
  const frame = player.isMoving ? Math.floor(player.walkT / 14) % 2 : 0;
  drawHuman(player.x, player.y, player.facing, player.r, frame, getPlayerLook(), activeWeapon(), 1, MASKS[save.gear.mask].id);
  ctx.globalAlpha = 1;
  if (player.armor > 0) {
    ctx.strokeStyle = 'rgba(200,210,180,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 4, 0, Math.PI * 2); ctx.stroke();

  if (player.carry.length) {
    const ang = animT * 4;
    ctx.fillStyle = PAL.artifact;
    for (let i = 0; i < Math.min(player.carry.length, 3); i++) {
      ctx.beginPath();
      ctx.arc(player.x + Math.cos(ang + i * 2.1) * 18, player.y + Math.sin(ang + i * 2.1) * 18, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

  g.addColorStop(0, 'rgba(0,0,0,1)');

  ctx.strokeRect(g.x, g.y, g.w, g.h);
  ctx.globalAlpha = 0.75 + 0.25 * Math.sin(animT * 3);
  ctx.fillStyle = PAL.hudText;
  ctx.font = 'bold 19px monospace';
  ctx.fillText('В ЗОНУ', W / 2, g.y + g.h / 2 + 7);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}
function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) {
      ctx.fillText(line, x, yy);
      line = w; yy += lineH;
    } else line = t;
  }
  ctx.fillText(line, x, yy);
}
function hubTap(x, y) {
  if (inputLock > 0) return;
  const L = hubLayout();
  for (let i = 0; i < 3; i++) {
    const t = L.tabs[i];
    if (x > t.x && x < t.x + t.w && y > t.y && y < t.y + t.h) { hubTab = i; hubToast = ''; sndBeep(600); return; }
  }
  const g = L.go;
  if (x > g.x && x < g.x + g.w && y > g.y && y < g.y + g.h) { startRaid(); return; }
  const cy = L.contentY;
  if (hubTab === 0) {
    const pr = Math.min(34, H * 0.055);
    const rowY0 = cy + pr * 2 + 34, rowH = Math.min(52, H * 0.075);
    const arrowDX = Math.min(150, W * 0.34);
    for (let i = 0; i < 4; i++) {
      const ry = rowY0 + i * rowH + rowH / 2;
      if (Math.abs(y - ry) < rowH / 2 - 2) {
        gearRow = i;
        if (Math.abs(x - (W / 2 - arrowDX)) < 30) { cycleGear(i, -1); return; }
        if (Math.abs(x - (W / 2 + arrowDX)) < 30) { cycleGear(i, 1); return; }
      }
    }
  } else if (hubTab === 1) {
    const items = shopItems();
    const rowH = Math.min(50, H * 0.07);
    for (let i = 0; i < items.length; i++) {
      const ry = cy + i * rowH;
      if (x > W * 0.08 && x < W * 0.92 && y > ry && y < ry + rowH - 8) { buyItem(items[i]); return; }
    }
  } else {
    if (y > L.go.y - 30 && y < L.go.y - 2) {
      if (x < W / 2) journalPage--; else journalPage++;
      sndBeep(600);
    }
  }
}
function startRaid() {
  if (!music.on) { genSong(); music.on = true; }
  else if (pendingLevel === 0) genSong();
  hubToast = '';
  loadLevel(pendingLevel);
}
// ===== Overlays =====
function drawIntroOverlay() {
  const alpha = stateTimer < 1.4 ? 0.72 : Math.max(0, 0.72 * (1 - (stateTimer - 1.4) / 0.4));
  ctx.fillStyle = 'rgba(5,8,4,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
  if (alpha <= 0.02) return;
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.hudDim;
  ctx.font = '14px monospace';
  ctx.fillText('ГЛУБИНА ' + (levelIndex + 1) + ' / ' + LEVELS.length + ' · ДЕНЬ ' + save.day, W / 2, H / 2 - 50);
  ctx.fillStyle = PAL.hudText;
  ctx.font = 'bold 26px monospace';
  ctx.fillText(level.name.toUpperCase(), W / 2, H / 2 - 18);
  if (raidModifier !== 'none') {
    ctx.fillStyle = PAL.danger;
    ctx.font = 'bold 15px monospace';
    ctx.fillText(MODIFIERS[raidModifier].name + ' — ' + MODIFIERS[raidModifier].desc, W / 2, H / 2 + 14);
  }
  if (levelIndex === 4) {
    ctx.fillStyle = PAL.danger;
    ctx.font = '13px monospace';
    ctx.fillText('Здесь живёт Горбач. Аномалии — твоё оружие.', W / 2, H / 2 + 40);
  } else if (levelIndex === 0 && save.day <= 2) {
    ctx.fillStyle = PAL.hudDim;
    ctx.font = '13px monospace';
    ctx.fillText('Артефакты невидимы — иди на писк детектора', W / 2, H / 2 + 40);
    ctx.fillText('Болт раскрывает аномалии. Пролом в заборе = выход', W / 2, H / 2 + 58);
  }
  ctx.textAlign = 'left';
}
function deathReasonText() {
  if (deathReason.startsWith('anomaly')) {
    const t = deathReason.split('_')[1];
    return t === 'fry' ? 'СОЖЖЁН ЖАРКОЙ' : t === 'vortex' ? 'ЗАТЯНУТ ВОРОНКОЙ' : t === 'acid' ? 'РАСТВОРЁН' : 'УБИТ РАЗРЯДОМ';
  }
  if (deathReason === 'mutant') return 'РАСТЕРЗАН';
  if (deathReason === 'emission') return 'НАКРЫЛО ВЫБРОСОМ';
  if (deathReason === 'boss') return 'ГОРБАЧ БЫЛ БЫСТРЕЕ';
  return 'ВЫ МЕРТВЫ';
}
function drawDeadOverlay() {
  ctx.fillStyle = 'rgba(120,10,10,0.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(clamp(W * 0.05, 26, 46)) + 'px monospace';
  ctx.fillText(deathReasonText(), W / 2, H / 2 - 30);
  const lost = player.carry.reduce((s, a) => s + a.value, 0);
  if (lost > 0) {
    ctx.fillStyle = PAL.artifact;
    ctx.font = '15px monospace';
    ctx.fillText('ХАБАР НА ' + lost + '₽ ПОТЕРЯН', W / 2, H / 2 + 4);
  }
  ctx.font = '17px monospace';
  ctx.fillStyle = PAL.hudText;
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ ЭКРАНА' : 'НАЖМИТЕ ЛЮБУЮ КЛАВИШУ', W / 2, H / 2 + 40);
  ctx.textAlign = 'left';
}
function drawVictoryOverlay() {
  ctx.fillStyle = 'rgba(6,14,6,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.artifact;
  ctx.font = 'bold 28px monospace';
  ctx.fillText('ЯДРО ПРОЙДЕНО', W / 2, H / 2 - 80);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '15px monospace';
  ctx.fillText('ЗАРАБОТАНО ЗА ЦИКЛ: ' + runStats.income + '₽', W / 2, H / 2 - 40);
  ctx.fillText('НА СЧЕТУ: ' + save.money + '₽', W / 2, H / 2 - 14);
  ctx.fillStyle = PAL.hudDim;
  ctx.font = '13px monospace';
  ctx.fillText('Зона перезарядится — цикл начнётся заново, деньги останутся', W / 2, H / 2 + 18);
  ctx.fillStyle = PAL.hudText;
  ctx.font = '16px monospace';
  ctx.fillText(usingTouch ? 'КОСНИТЕСЬ, ЧТОБЫ ВЕРНУТЬСЯ В ЛАГЕРЬ' : 'НАЖМИТЕ, ЧТОБЫ ВЕРНУТЬСЯ В ЛАГЕРЬ', W / 2, H / 2 + 58);
  ctx.textAlign = 'left';
}
function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { renderMenu(); drawGrain(); return; }
  if (state === 'hub') { renderHub(); drawGrain(); return; }
  if (!level) return;
  drawWorld();
  if (state === 'playing' || state === 'exit' || state === 'intro') drawFog();
  drawHUD();
  drawTouchControls();
  if (state === 'intro') drawIntroOverlay();
  if (state === 'exit') {
    const a = clamp(stateTimer / 0.9, 0, 1);
    ctx.fillStyle = 'rgba(215,245,235,' + (a * a) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (state === 'dead') drawDeadOverlay();
  if (state === 'victory') drawVictoryOverlay();
  drawGrain();
}
// ===== Input =====
function handleTapAdvance() {
  if (inputLock > 0) return;
  if (state === 'menu') {
    runStats = { kills: 0, income: 0, levels: 0 };
    pendingLevel = 0;
    rollModifier();
    hubTab = 0;
    enterState('hub');
  } else if (state === 'intro') enterState('playing');
  else if (state === 'dead') restartLevel();
  else if (state === 'victory') {
    runStats = { kills: 0, income: 0, levels: 0 };
    pendingLevel = 0;
    rollModifier();
    hubTab = 0;
    enterState('hub');
  }
}
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  ensureAudio();
  if (state === 'hub') {
    if (hubTab === 0) {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') gearRow = (gearRow + 3) % 4;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') gearRow = (gearRow + 1) % 4;
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') cycleGear(gearRow, -1);
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') cycleGear(gearRow, 1);
    }
    if (e.code === 'Tab') { e.preventDefault(); hubTab = (hubTab + 1) % 3; }
    if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); if (inputLock <= 0) startRaid(); }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); if (state === 'playing') tryDash(); }
  if (e.code === 'KeyE') { if (state === 'playing') throwBolt(); }
  if (e.code === 'KeyF') { if (state === 'playing') doNpcTrade(); }
  if (e.code === 'KeyQ') { if (state === 'playing') switchWeapon(); }
  if (e.code === 'Digit1' || e.code === 'Digit2') {
    const i = e.code === 'Digit1' ? 0 : 1;
    if (state === 'playing' && player.slots[i] && i !== player.active) switchWeapon();
  }
  if (e.code === 'KeyR') { if (state === 'playing' || state === 'dead') restartLevel(); }
  if (state !== 'playing' && state !== 'exit') handleTapAdvance();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('wheel', e => { if (state === 'playing') switchWeapon(); }, { passive: true });
window.addEventListener('mousedown', e => {
  ensureAudio();
  if (state === 'hub') { hubTap(e.clientX, e.clientY); return; }
  if (state === 'exit') return;
  if (state !== 'playing') { handleTapAdvance(); return; }
  if (e.button === 2) { throwBolt(); return; }
  mouse.down = true; tryAttack();
});
window.addEventListener('mouseup', e => { if (e.button !== 2) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function onTouchStart(e) {
  e.preventDefault();
  usingTouch = true;
  ensureAudio();
  if (state === 'hub') {
    for (const t of e.changedTouches) hubTap(t.clientX, t.clientY);
    return;
  }
  if (state === 'exit') return;
  if (state !== 'playing') { handleTapAdvance(); return; }
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    const jb = getJoyBase();
    if (joy.id === null && dist(x, y, jb.x, jb.y) < 95) {
      joy.id = t.identifier; joy.dx = 0; joy.dy = 0;
      continue;
    }
    const bt = getBtnTrade();
    if (npcTradeAvailable() && btnTrade.id === null && dist(x, y, bt.x, bt.y) < bt.r + 10) {
      btnTrade.id = t.identifier; btnTrade.active = true; doNpcTrade();
      continue;
    }
    const ba = getBtnAttack();
    if (btnAttack.id === null && dist(x, y, ba.x, ba.y) < ba.r + 10) {
      btnAttack.id = t.identifier; btnAttack.active = true; tryAttack();
      continue;
    }
    const bd = getBtnDash();
    if (btnDash.id === null && dist(x, y, bd.x, bd.y) < bd.r + 8) {
      btnDash.id = t.identifier; btnDash.active = true; tryDash();
      continue;
    }
    const bb = getBtnBolt();
    if (btnBolt.id === null && dist(x, y, bb.x, bb.y) < bb.r + 8) {
      btnBolt.id = t.identifier; btnBolt.active = true; throwBolt();
      continue;
    }
    const bs = getBtnSwap();
    if (player.slots[1] && btnSwap.id === null && dist(x, y, bs.x, bs.y) < bs.r + 8) {
      btnSwap.id = t.identifier; btnSwap.active = true; switchWeapon();
      continue;
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      const jb = getJoyBase();
      const dx = t.clientX - jb.x, dy = t.clientY - jb.y;
      const d = Math.hypot(dx, dy);
      const m = Math.min(d, joy.maxR);
      const a = Math.atan2(dy, dx);
      joy.dx = d > 0 ? Math.cos(a) * (m / joy.maxR) : 0;
      joy.dy = d > 0 ? Math.sin(a) * (m / joy.maxR) : 0;
    }
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { joy.id = null; joy.dx = 0; joy.dy = 0; }
    if (t.identifier === btnAttack.id) { btnAttack.id = null; btnAttack.active = false; }
    if (t.identifier === btnDash.id) { btnDash.id = null; btnDash.active = false; }
    if (t.identifier === btnBolt.id) { btnBolt.id = null; btnBolt.active = false; }
    if (t.identifier === btnSwap.id) { btnSwap.id = null; btnSwap.active = false; }
    if (t.identifier === btnTrade.id) { btnTrade.id = null; btnTrade.active = false; }
  }
}
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
// ===== Main loop =====
let lastTs = performance.now();
function tick(ts) {
  requestAnimationFrame(tick);
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  animT += dt;
  if (inputLock > 0) inputLock = Math.max(0, inputLock - dt);
  musicTick();
  update(dt);
  render();
}
requestAnimationFrame(tick);
</script>
</body>
